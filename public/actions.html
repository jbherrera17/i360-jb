<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actions | Insight 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/loading-spinner.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="/js/modal-service/loader.js" data-auto-load></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Actions Specific Styles */
        .actions-layout {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-header h1 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0;
        }

        .page-header p {
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
            font-size: 0.9rem;
        }

        /* Suite Tabs */
        .suite-tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .suite-tab {
            flex: 1;
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .suite-tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .suite-tab.active {
            background: var(--primary);
            color: white;
        }

        .suite-tab.active.align { background: #8b5cf6; }
        .suite-tab.active.strategy { background: #3b82f6; }
        .suite-tab.active.execute { background: #10b981; }

        .suite-tab .count {
            background: rgba(255,255,255,0.2);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .section-header h2 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        /* Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        /* Action Card */
        .action-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .action-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .action-card:hover::before {
            opacity: 1;
        }

        .action-card.align::before { background: #8b5cf6; }
        .action-card.strategy::before { background: #3b82f6; }
        .action-card.execute::before { background: #10b981; }

        .action-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .action-icon.align { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .action-icon.strategy { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .action-icon.execute { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        .action-info {
            flex: 1;
            min-width: 0;
        }

        .action-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .action-suite {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .action-suite.align { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .action-suite.strategy { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .action-suite.execute { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        .action-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .action-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .action-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .action-assets {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
        }

        .asset-pill {
            padding: 0.2rem 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 50px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* Template Card */
        .template-card {
            background: var(--bg-secondary);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .template-card:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .template-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
        }

        .template-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .template-description {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.actions { background: rgba(99, 102, 241, 0.15); color: #6366f1; }
        .stat-icon.executions { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .stat-icon.success { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .stat-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark, #4f46e5);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .btn-icon.btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: #ef4444;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            margin-bottom: 1.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Modal styles handled by modal-manager.js */

        /* Templates Grid */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .template-option {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .template-option:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .template-option.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .template-option-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .template-option-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .template-option-suite {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Execute Modal Styles */
        .execute-modal .i360-modal-body {
            min-height: 400px;
        }

        .execute-header-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .execute-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .execute-icon.align { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .execute-icon.strategy { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .execute-icon.execute { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        /* Modal form styles for ModalService */
        .i360-modal .form-group {
            margin-bottom: 1rem;
        }

        .i360-modal .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .i360-modal .form-input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .i360-modal .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Template option styles for create modal */
        .i360-modal .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .i360-modal .template-option {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .i360-modal .template-option:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .i360-modal .template-option.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .i360-modal .template-option-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .i360-modal .template-option-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .i360-modal .template-option-suite {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .execute-textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 100px;
        }

        .execute-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .execute-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            gap: 1rem;
        }

        .execute-loading .loading-spinner {
            width: 48px;
            height: 48px;
        }

        .execute-results {
            margin-top: 1.5rem;
        }

        .execute-output {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .execute-output h1, .execute-output h2, .execute-output h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .execute-output p {
            margin-bottom: 0.75rem;
        }

        .execute-output ul, .execute-output ol {
            margin-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .execute-metadata {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .execute-metadata span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }


        /* Responsive */
        @media (max-width: 768px) {
            .suite-tabs {
                flex-direction: column;
            }
            .stats-row {
                flex-direction: column;
            }
            .actions-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                width: 95vw;
                min-width: unset;
                max-height: 90vh;
                resize: vertical;
            }
            .templates-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="header-content">
                    <h1>Actions</h1>
                    <p class="header-subtitle">Composable web app experiences powered by Context + Parthenon + AI</p>
                </div>
                <div class="header-actions">
                    <button class="btn-primary" onclick="showCreateModal()">
                        <i data-lucide="plus" style="width:16px;height:16px;"></i> New Action
                    </button>
                    <button class="help-btn" onclick="HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                </div>
            </header>

            <div class="actions-layout">

                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-icon actions">
                            <i data-lucide="zap"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalActions">0</h3>
                            <p>Total Actions</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon executions">
                            <i data-lucide="play-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalExecutions">0</h3>
                            <p>Executions</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i data-lucide="check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="successRate">0%</h3>
                            <p>Success Rate</p>
                        </div>
                    </div>
                </div>

                <!-- Department Filter -->
                <div class="filter-row" style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <label for="filterDepartment" style="font-size: 0.9rem; color: var(--text-secondary);">Department:</label>
                        <select id="filterDepartment" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem; min-width: 180px;">
                            <option value="">All Departments</option>
                        </select>
                    </div>
                </div>

                <!-- Suite Tabs -->
                <div class="suite-tabs">
                    <button class="suite-tab active" data-suite="all">
                        <i data-lucide="layers" style="width:16px;height:16px;"></i>
                        All Actions
                        <span id="allCount" class="count">0</span>
                    </button>
                    <button class="suite-tab align" data-suite="align">
                        <i data-lucide="compass" style="width:16px;height:16px;"></i>
                        Align 120
                        <span id="alignCount" class="count">0</span>
                    </button>
                    <button class="suite-tab strategy" data-suite="strategy">
                        <i data-lucide="map" style="width:16px;height:16px;"></i>
                        Strategy 120
                        <span id="strategyCount" class="count">0</span>
                    </button>
                    <button class="suite-tab execute" data-suite="execute">
                        <i data-lucide="rocket" style="width:16px;height:16px;"></i>
                        Execute 120
                        <span id="executeCount" class="count">0</span>
                    </button>
                </div>

                <!-- Templates Section -->
                <div class="section-header">
                    <h2><i data-lucide="layout-template" style="width:20px;height:20px;"></i> Action Templates</h2>
                </div>
                <div id="templatesList" class="actions-grid">
                    <!-- Populated by JS -->
                </div>

                <!-- Actions Section -->
                <div class="section-header">
                    <h2><i data-lucide="zap" style="width:20px;height:20px;"></i> My Actions</h2>
                </div>
                <div id="actionsList" class="actions-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase client -->
    <script src="/js/supabase.js"></script>

    <script>
        // State
        let actions = [];
        let templates = [];
        let departments = [];
        let selectedTemplate = null;
        let currentSuite = 'all';
        let currentDepartment = '';
        let currentUserId = null;

        // Modal instances (created dynamically via ModalService)
        let createModal = null;
        let executeModal = null;
        let editModal = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await fetchCurrentUser();
            await fetchDepartments();
            await loadStats();
            await loadTemplates();
            await loadActions();
            setupSuiteTabs();
            setupDepartmentFilter();
        });

        // Fetch current user
        async function fetchCurrentUser() {
            try {
                const response = await authFetch('/api/auth/me');
                const data = await response.json();
                if (data.success && data.user) {
                    currentUserId = data.user.id;
                }
            } catch (error) {
                console.log('Not logged in or error fetching user');
            }
        }

        // Fetch departments
        async function fetchDepartments() {
            try {
                const response = await authFetch('/api/departments');
                const data = await response.json();
                if (data.success) {
                    departments = data.data;

                    // Populate filter dropdown
                    const filterSelect = document.getElementById('filterDepartment');
                    filterSelect.innerHTML = '<option value="">All Departments</option>';
                    departments.forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept.id;
                        option.textContent = dept.name;
                        filterSelect.appendChild(option);
                    });

                    // Populate create modal dropdown
                    const createSelect = document.getElementById('createActionDepartment');
                    if (createSelect) {
                        createSelect.innerHTML = '<option value="">No Department (Available to all)</option>';
                        departments.forEach(dept => {
                            const option = document.createElement('option');
                            option.value = dept.id;
                            option.textContent = dept.name;
                            createSelect.appendChild(option);
                        });
                    }

                    // Populate edit modal dropdown
                    const editSelect = document.getElementById('editDepartment');
                    if (editSelect) {
                        editSelect.innerHTML = '<option value="">No Department (Available to all)</option>';
                        departments.forEach(dept => {
                            const option = document.createElement('option');
                            option.value = dept.id;
                            option.textContent = dept.name;
                            editSelect.appendChild(option);
                        });
                    }
                }
            } catch (error) {
                console.error('Error fetching departments:', error);
            }
        }

        // Setup department filter
        function setupDepartmentFilter() {
            document.getElementById('filterDepartment').addEventListener('change', (e) => {
                currentDepartment = e.target.value;
                loadActions();
                loadTemplates();
            });
        }

        // Suite tab switching
        function setupSuiteTabs() {
            document.querySelectorAll('.suite-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentSuite = tab.dataset.suite;

                    // Update tab buttons
                    document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    // Filter actions
                    renderActions();
                    renderTemplates();
                });
            });
        }

        // Load stats
        async function loadStats() {
            try {
                const res = await authFetch('/api/actions/stats/overview');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('totalActions').textContent = data.data.total_actions;
                    document.getElementById('totalExecutions').textContent = data.data.total_executions;
                    document.getElementById('successRate').textContent = data.data.success_rate + '%';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load templates
        async function loadTemplates() {
            try {
                const params = new URLSearchParams();
                if (currentDepartment) {
                    params.append('department_id', currentDepartment);
                }
                const url = '/api/actions/templates/list' + (params.toString() ? '?' + params.toString() : '');
                const res = await authFetch(url);
                const data = await res.json();
                if (data.success) {
                    templates = data.data;
                    renderTemplates();
                    updateCounts();
                }
            } catch (error) {
                console.error('Error loading templates:', error);
            }
        }

        function renderTemplates() {
            const container = document.getElementById('templatesList');
            const filtered = currentSuite === 'all' ? templates : templates.filter(t => t.suite === currentSuite);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); padding: 1rem;">No templates for this suite.</p>`;
                return;
            }

            container.innerHTML = filtered.map(template => `
                <div class="action-card ${template.suite}" onclick="createFromTemplateSlug('${template.slug}')">
                    <div class="action-header">
                        <div class="action-icon ${template.suite}">
                            <i data-lucide="${template.icon || 'layout-template'}"></i>
                        </div>
                        <div class="action-info">
                            <div class="action-name">${template.name}</div>
                            <span class="action-suite ${template.suite}">${template.suite}</span>
                        </div>
                    </div>
                    <p class="action-description">${template.description || ''}</p>
                    <div class="action-assets">
                        ${(template.context_assets || []).slice(0, 4).map(a => `<span class="asset-pill">${a}</span>`).join('')}
                        ${(template.context_assets || []).length > 4 ? `<span class="asset-pill">+${template.context_assets.length - 4}</span>` : ''}
                    </div>
                    <div class="action-meta">
                        <span><i data-lucide="sparkles" style="width:12px;height:12px;"></i> Template</span>
                        <span>${template.category || 'General'}</span>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Load user actions
        async function loadActions() {
            try {
                const params = new URLSearchParams();
                if (currentDepartment) {
                    params.append('department_id', currentDepartment);
                }
                const url = '/api/actions' + (params.toString() ? '?' + params.toString() : '');
                const res = await authFetch(url);
                const data = await res.json();
                if (data.success) {
                    actions = data.data;
                    renderActions();
                    updateCounts();
                }
            } catch (error) {
                console.error('Error loading actions:', error);
            }
        }

        function renderActions() {
            const container = document.getElementById('actionsList');
            const filtered = currentSuite === 'all' ? actions : actions.filter(a => a.suite === currentSuite);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon">⚡</div>
                        <h3>No Actions Yet</h3>
                        <p>Create your first action from a template above, or build a custom one.</p>
                        <button class="btn-primary" onclick="showCreateModal()">
                            <i data-lucide="plus" style="width:16px;height:16px;"></i> Create Action
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(action => {
                const isOwner = action.user_id && action.user_id === currentUserId;
                return `
                <div class="action-card ${action.suite}">
                    <div class="action-header" onclick="openAction('${action.slug}')">
                        <div class="action-icon ${action.suite}">
                            <i data-lucide="${action.icon || 'zap'}"></i>
                        </div>
                        <div class="action-info">
                            <div class="action-name">${action.name}</div>
                            <span class="action-suite ${action.suite}">${action.suite}</span>
                        </div>
                    </div>
                    <p class="action-description" onclick="openAction('${action.slug}')">${action.description || ''}</p>
                    <div class="action-assets" onclick="openAction('${action.slug}')">
                        ${(action.context_assets || []).slice(0, 4).map(a => `<span class="asset-pill">${a}</span>`).join('')}
                        ${(action.context_assets || []).length > 4 ? `<span class="asset-pill">+${action.context_assets.length - 4}</span>` : ''}
                    </div>
                    <div class="action-meta">
                        <span><i data-lucide="play-circle" style="width:12px;height:12px;"></i> ${action.usage_count || 0} runs</span>
                        ${isOwner ? `
                            <div class="action-buttons" style="display: flex; gap: 0.5rem;">
                                <button class="btn-icon" onclick="event.stopPropagation(); openEditModal('${action.id}')" title="Edit">
                                    <i data-lucide="edit-2" style="width:14px;height:14px;"></i>
                                </button>
                                <button class="btn-icon btn-danger" onclick="event.stopPropagation(); deleteAction('${action.id}')" title="Delete">
                                    <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                                </button>
                            </div>
                        ` : `<span>${action.status}</span>`}
                    </div>
                </div>
            `;
            }).join('');

            lucide.createIcons();
        }

        // Update suite counts
        function updateCounts() {
            const allCount = actions.length + templates.length;
            const alignCount = actions.filter(a => a.suite === 'align').length + templates.filter(t => t.suite === 'align').length;
            const strategyCount = actions.filter(a => a.suite === 'strategy').length + templates.filter(t => t.suite === 'strategy').length;
            const executeCount = actions.filter(a => a.suite === 'execute').length + templates.filter(t => t.suite === 'execute').length;

            document.getElementById('allCount').textContent = allCount;
            document.getElementById('alignCount').textContent = alignCount;
            document.getElementById('strategyCount').textContent = strategyCount;
            document.getElementById('executeCount').textContent = executeCount;
        }

        // Modal functions
        function showCreateModal() {
            selectedTemplate = null;

            // Build department options
            const deptOptions = '<option value="">No Department (Available to all)</option>' +
                departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

            // Build template options HTML
            const templateOptionsHtml = templates.map(t => `
                <div class="template-option" data-slug="${t.slug}">
                    <div class="template-option-icon">
                        <i data-lucide="${t.icon || 'layout-template'}" style="width:32px;height:32px;"></i>
                    </div>
                    <div class="template-option-name">${t.name}</div>
                    <div class="template-option-suite">${t.suite}</div>
                </div>
            `).join('');

            // Create modal using ModalService
            createModal = ModalService.create({
                title: 'Create Action',
                content: `
                    <p style="color: var(--text-secondary); margin-bottom: 1rem;">Choose a template to get started:</p>
                    <div id="templateOptions" class="templates-grid">${templateOptionsHtml}</div>
                    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                        <label for="createActionDepartment" style="display: block; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                            Assign to Department (optional)
                        </label>
                        <select id="createActionDepartment" style="width: 100%; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem;">
                            ${deptOptions}
                        </select>
                    </div>
                `,
                footer: `
                    <button class="i360-btn i360-btn-secondary" data-action="close">Cancel</button>
                    <button class="i360-btn i360-btn-primary" id="createFromTemplateBtn" disabled>
                        <i data-lucide="plus" style="width:16px;height:16px;"></i> Create Action
                    </button>
                `,
                width: 700,
                draggable: true,
                resizable: true,
                onOpen: () => {
                    lucide.createIcons();
                    // Bind template selection
                    document.querySelectorAll('#templateOptions .template-option').forEach(opt => {
                        opt.addEventListener('click', () => selectTemplate(opt.dataset.slug));
                    });
                    // Bind create button
                    document.getElementById('createFromTemplateBtn').addEventListener('click', createFromTemplate);
                }
            });
            createModal.open();
        }

        function closeCreateModal() {
            if (createModal) {
                createModal.close();
                createModal = null;
            }
        }

        function selectTemplate(slug) {
            selectedTemplate = slug;
            document.querySelectorAll('.template-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.slug === slug);
            });
            const btn = document.getElementById('createFromTemplateBtn');
            if (btn) btn.disabled = false;
        }

        async function createFromTemplate() {
            if (!selectedTemplate) return;

            try {
                const department_id = document.getElementById('createActionDepartment')?.value || null;

                const res = await authFetch(`/api/actions/from-template/${selectedTemplate}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ department_id })
                });

                const result = await res.json();
                if (result.success) {
                    closeCreateModal();
                    await loadActions();
                    await loadStats();
                    ModalService.success(`Action "${result.data.name}" created!`);
                } else {
                    ModalService.error(result.error);
                }
            } catch (error) {
                console.error('Error creating action:', error);
                ModalService.error('Error creating action');
            }
        }

        async function createFromTemplateSlug(slug) {
            try {
                const res = await authFetch(`/api/actions/from-template/${slug}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const result = await res.json();
                if (result.success) {
                    await loadActions();
                    await loadStats();
                    alert(`Action "${result.data.name}" created!`);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error creating action:', error);
                alert('Error creating action');
            }
        }

        // ============================================
        // EDIT ACTION MODAL
        // ============================================

        let currentEditActionId = null;

        function openEditModal(actionId) {
            const action = actions.find(a => a.id === actionId);
            if (!action) {
                ModalService.error('Action not found');
                return;
            }

            currentEditActionId = actionId;

            // Build department options
            const deptOptions = `<option value="">No Department (Available to all)</option>` +
                departments.map(d => `<option value="${d.id}" ${action.department_id === d.id ? 'selected' : ''}>${d.name}</option>`).join('');

            editModal = ModalService.create({
                title: 'Edit Action',
                content: `
                    <div class="form-group">
                        <label for="editName">Name</label>
                        <input type="text" id="editName" class="form-input" placeholder="Action name" value="${action.name || ''}">
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description</label>
                        <textarea id="editDescription" class="form-input" rows="3" placeholder="Action description">${action.description || ''}</textarea>
                    </div>
                    <div class="form-row" style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex: 1;">
                            <label for="editSuite">Suite</label>
                            <select id="editSuite" class="form-input">
                                <option value="align" ${action.suite === 'align' ? 'selected' : ''}>Align</option>
                                <option value="strategy" ${action.suite === 'strategy' ? 'selected' : ''}>Strategy</option>
                                <option value="execute" ${action.suite === 'execute' ? 'selected' : ''}>Execute</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="editStatus">Status</label>
                            <select id="editStatus" class="form-input">
                                <option value="active" ${action.status === 'active' ? 'selected' : ''}>Active</option>
                                <option value="draft" ${action.status === 'draft' ? 'selected' : ''}>Draft</option>
                                <option value="archived" ${action.status === 'archived' ? 'selected' : ''}>Archived</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="editDepartment">Department</label>
                        <select id="editDepartment" class="form-input">${deptOptions}</select>
                    </div>
                `,
                footer: `
                    <button class="i360-btn i360-btn-secondary" data-action="close">Cancel</button>
                    <button class="i360-btn i360-btn-primary" id="saveActionBtn">
                        <i data-lucide="save" style="width:16px;height:16px;"></i> Save Changes
                    </button>
                `,
                width: 600,
                draggable: true,
                resizable: true,
                onOpen: () => {
                    lucide.createIcons();
                    document.getElementById('saveActionBtn').addEventListener('click', saveAction);
                }
            });
            editModal.open();
        }

        function closeEditModal() {
            if (editModal) {
                editModal.close();
                editModal = null;
            }
            currentEditActionId = null;
        }

        async function saveAction() {
            if (!currentEditActionId) return;

            const updates = {
                name: document.getElementById('editName').value,
                description: document.getElementById('editDescription').value,
                suite: document.getElementById('editSuite').value,
                status: document.getElementById('editStatus').value
            };

            try {
                const res = await authFetch(`/api/actions/${currentEditActionId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                const result = await res.json();
                if (result.success) {
                    closeEditModal();
                    await loadActions();
                    await loadStats();
                    ModalService.success('Action updated successfully!');
                } else {
                    ModalService.error(result.error);
                }
            } catch (error) {
                console.error('Error updating action:', error);
                ModalService.error('Error updating action');
            }
        }

        async function deleteAction(actionId) {
            const confirmed = await ModalService.confirm({
                title: 'Delete Action',
                message: 'Are you sure you want to delete this action? This action will be archived.',
                type: 'danger',
                confirmText: 'Delete',
                cancelText: 'Cancel'
            });

            if (!confirmed) return;

            try {
                const res = await authFetch(`/api/actions/${actionId}`, {
                    method: 'DELETE'
                });

                const result = await res.json();
                if (result.success) {
                    await loadActions();
                    await loadStats();
                    ModalService.success('Action deleted successfully!');
                } else {
                    ModalService.error(result.error);
                }
            } catch (error) {
                console.error('Error deleting action:', error);
                ModalService.error('Error deleting action');
            }
        }

        // ============================================
        // EXECUTE ACTION MODAL
        // ============================================
        let currentAction = null;
        let loadingController = null;

        // Action-specific loading messages
        const ACTION_LOADING_MESSAGES = [
            'Executing action...',
            'Processing your request...',
            'Applying context assets...',
            'Generating content...',
            'Running through AI engine...',
            'Analyzing input...',
            'Building response...',
            'Applying Parthenon principles...',
            'Almost there...',
            'Crafting output...'
        ];

        function openAction(slug) {
            // Find the action by slug
            const action = actions.find(a => a.slug === slug);
            if (!action) {
                ModalService.error('Action not found');
                return;
            }

            currentAction = action;

            executeModal = ModalService.create({
                title: action.name,
                content: `
                    <div class="execute-header-info" style="margin-bottom: 1rem;">
                        <div class="execute-icon ${action.suite}" style="display: inline-flex; width: 40px; height: 40px; border-radius: 10px; align-items: center; justify-content: center; margin-right: 0.75rem;">
                            <i data-lucide="${action.icon || 'zap'}"></i>
                        </div>
                        <span class="action-suite ${action.suite}">${action.suite}</span>
                    </div>
                    <p class="action-description" style="margin-bottom: 1.5rem;">${action.description || ''}</p>

                    <!-- Input Section -->
                    <div id="executeInputSection">
                        <label class="input-label" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.5rem;">
                            <i data-lucide="message-square" style="width:14px;height:14px;"></i>
                            Your Input
                        </label>
                        <textarea
                            id="executeInput"
                            class="execute-textarea"
                            placeholder="What would you like this action to help you with?"
                            rows="4"
                            style="width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; resize: vertical; min-height: 100px;"
                        ></textarea>
                    </div>

                    <!-- Loading State -->
                    <div id="executeLoading" class="execute-loading" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 3rem; gap: 1rem;">
                        <img src="/assets/loading-spinner.svg" alt="Loading" class="loading-spinner" style="width: 48px; height: 48px;">
                        <span id="executeLoadingText" class="loading-text">Executing action...</span>
                    </div>

                    <!-- Results Section -->
                    <div id="executeResults" class="execute-results" style="display: none; margin-top: 1.5rem;">
                        <label class="input-label" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.5rem;">
                            <i data-lucide="sparkles" style="width:14px;height:14px;"></i>
                            Results
                        </label>
                        <div id="executeOutput" class="execute-output" style="background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; min-height: 150px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6;"></div>
                        <div id="executeMetadata" class="execute-metadata" style="display: flex; gap: 1.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted);"></div>
                    </div>
                `,
                footer: `
                    <button class="i360-btn i360-btn-secondary" data-action="close">Close</button>
                    <button class="i360-btn i360-btn-primary" id="executeBtn">
                        <i data-lucide="play" style="width:16px;height:16px;"></i> Run Action
                    </button>
                `,
                width: 900,
                height: 600,
                draggable: true,
                resizable: true,
                maximizable: true,
                className: 'execute-modal',
                onOpen: () => {
                    lucide.createIcons();
                    document.getElementById('executeBtn').addEventListener('click', runAction);
                },
                onClose: () => {
                    currentAction = null;
                    if (loadingController) {
                        loadingController.stop();
                        loadingController = null;
                    }
                }
            });
            executeModal.open();
        }

        function closeExecuteModal() {
            if (executeModal) {
                executeModal.close();
                executeModal = null;
            }
            currentAction = null;
        }

        async function runAction() {
            if (!currentAction) return;

            const input = document.getElementById('executeInput').value.trim();
            const btn = document.getElementById('executeBtn');

            // Show loading state
            document.getElementById('executeInputSection').style.display = 'none';
            document.getElementById('executeLoading').style.display = 'flex';
            document.getElementById('executeResults').style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;"></i> Running...';
            lucide.createIcons();

            // Start rotating loading messages
            const loadingTextEl = document.getElementById('executeLoadingText');
            if (typeof LoadingMessages !== 'undefined') {
                loadingController = LoadingMessages.start(loadingTextEl, {
                    messages: ACTION_LOADING_MESSAGES,
                    interval: 2500
                });
            }

            try {
                const res = await authFetch(`/api/actions/${currentAction.id}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input_data: {
                            message: input || 'Execute with default parameters'
                        }
                    })
                });

                const result = await res.json();

                // Stop loading messages and hide loading
                if (loadingController) {
                    loadingController.stop();
                    loadingController = null;
                }
                document.getElementById('executeLoading').style.display = 'none';

                if (result.success) {
                    // Show results
                    const output = result.data.output_data?.response || 'No response generated';
                    document.getElementById('executeOutput').innerHTML = formatMarkdown(output);

                    // Show metadata
                    const metadata = document.getElementById('executeMetadata');
                    const duration = result.data.duration_ms ? `${(result.data.duration_ms / 1000).toFixed(1)}s` : 'N/A';
                    const model = result.data.model_used || 'claude';
                    metadata.innerHTML = `
                        <span style="display: flex; align-items: center; gap: 0.35rem;"><i data-lucide="clock" style="width:14px;height:14px;"></i> ${duration}</span>
                        <span style="display: flex; align-items: center; gap: 0.35rem;"><i data-lucide="cpu" style="width:14px;height:14px;"></i> ${model}</span>
                        <span style="display: flex; align-items: center; gap: 0.35rem;"><i data-lucide="check-circle" style="width:14px;height:14px;"></i> Completed</span>
                    `;

                    document.getElementById('executeResults').style.display = 'block';
                    btn.innerHTML = '<i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> Run Again';
                    btn.disabled = false;

                    // Reload stats to update execution count
                    loadStats();
                    loadActions();
                } else {
                    // Show error
                    document.getElementById('executeOutput').innerHTML = `<div style="color: #ef4444;">Error: ${result.error}</div>`;
                    document.getElementById('executeMetadata').innerHTML = '';
                    document.getElementById('executeResults').style.display = 'block';
                    btn.innerHTML = '<i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> Try Again';
                    btn.disabled = false;
                }

                lucide.createIcons();

            } catch (error) {
                console.error('Error executing action:', error);
                // Stop loading messages
                if (loadingController) {
                    loadingController.stop();
                    loadingController = null;
                }
                document.getElementById('executeLoading').style.display = 'none';
                document.getElementById('executeOutput').innerHTML = `<div style="color: #ef4444;">Error: ${error.message}</div>`;
                document.getElementById('executeMetadata').innerHTML = '';
                document.getElementById('executeResults').style.display = 'block';
                btn.innerHTML = '<i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> Try Again';
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        // Simple markdown formatter
        function formatMarkdown(text) {
            if (!text) return '';

            return text
                // Headers
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                // Bold
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                // Lists
                .replace(/^\- (.*$)/gim, '<li>$1</li>')
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
                // Line breaks
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }
