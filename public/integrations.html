<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrations | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .integrations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }

        .integration-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 2px solid var(--border);
            padding: var(--spacing-lg);
            transition: all 0.3s ease;
            position: relative;
        }

        .integration-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .integration-card.connected {
            border-color: var(--success);
        }

        .integration-card-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .integration-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--bg-tertiary);
        }

        .integration-icon.google { background: linear-gradient(135deg, #4285f4, #34a853); color: white; }
        .integration-icon.microsoft { background: linear-gradient(135deg, #00a4ef, #7fba00); color: white; }
        .integration-icon.salesforce { background: linear-gradient(135deg, #00a1e0, #1798c1); color: white; }
        .integration-icon.hubspot { background: linear-gradient(135deg, #ff7a59, #ff5c35); color: white; }
        .integration-icon.slack { background: linear-gradient(135deg, #4a154b, #611f69); color: white; }
        .integration-icon.default { background: var(--bg-tertiary); color: var(--text-secondary); }

        .integration-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .integration-category {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .integration-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-md);
            min-height: 40px;
        }

        .integration-status {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .integration-status.connected {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .integration-status.disconnected {
            background: rgba(107, 114, 128, 0.15);
            color: var(--text-tertiary);
        }

        .integration-status.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .integration-status.beta {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .integration-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border);
        }

        .integration-price {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .integration-price strong {
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .section-title .count {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
        }

        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .alert-banner {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: var(--spacing-md) var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .alert-banner.success { border-color: var(--success); }
        .alert-banner.error { border-color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-secondary);
        }

        .empty-state i {
            margin-bottom: var(--spacing-md);
            color: var(--text-tertiary);
        }

        .org-section {
            margin-top: var(--spacing-2xl);
        }

        .sync-info {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="page-header">
                <div class="header-content">
                    <h1>
                        <i data-lucide="plug" style="width:28px;height:28px;color:var(--primary);"></i>
                        Integrations
                    </h1>
                    <p class="header-subtitle">Connect external services to enhance your Insight 360 experience</p>
                </div>
                <div class="header-actions">
                    <button class="help-btn" onclick="HelpModal && HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                </div>
            </header>

            <div style="padding: var(--spacing-xl);">
                <!-- Alert banners for OAuth results -->
                <div id="alert-container"></div>

                <!-- Connected Integrations -->
                <div id="connected-section" style="display:none;">
                    <div class="section-title">
                        <i data-lucide="check-circle-2" style="width:20px;height:20px;color:var(--success);"></i>
                        Your Connected Services
                        <span class="count" id="connected-count">0</span>
                    </div>
                    <div class="integrations-grid" id="connected-grid"></div>
                </div>

                <!-- Org Integrations -->
                <div id="org-section" class="org-section" style="display:none;">
                    <div class="section-title">
                        <i data-lucide="building" style="width:20px;height:20px;color:var(--primary);"></i>
                        Organization Integrations
                        <span class="count" id="org-count">0</span>
                    </div>
                    <div class="integrations-grid" id="org-grid"></div>
                </div>

                <!-- Available Integrations -->
                <div style="margin-top: var(--spacing-2xl);">
                    <div class="section-title">
                        <i data-lucide="plus-circle" style="width:20px;height:20px;color:var(--text-secondary);"></i>
                        Available Integrations
                    </div>
                    <div class="integrations-grid" id="available-grid">
                        <div class="empty-state">
                            <i data-lucide="loader" style="width:32px;height:32px;"></i>
                            <p>Loading integrations...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/modal-service/loader.js" data-auto-load></script>
    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
    <script src="/js/integrations.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('insight360-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (typeof initNavigation === 'function') await initNavigation();
            if (typeof lucide !== 'undefined') lucide.createIcons();

            // Check URL params for OAuth results
            const params = new URLSearchParams(window.location.search);
            if (params.get('connected')) {
                showAlert(`Successfully connected ${params.get('connected')}!`, 'success');
                window.history.replaceState({}, '', '/integrations.html');
            } else if (params.get('error')) {
                showAlert(`Connection failed: ${params.get('error')}`, 'error');
                window.history.replaceState({}, '', '/integrations.html');
            }

            // Initialize integrations page
            await loadIntegrations();
        });

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert-banner ${type}`;
            alert.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" style="width:20px;height:20px;color:var(--${type === 'success' ? 'success' : 'danger'});"></i>
                <span>${message}</span>
            `;
            container.appendChild(alert);
            if (typeof lucide !== 'undefined') lucide.createIcons();
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
