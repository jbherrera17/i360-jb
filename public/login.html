<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/navigation.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Insight 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/direction-modal.js"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
            background: var(--bg-primary);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .login-logo {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .login-tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--spacing-md);
        }

        .login-tab {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-md);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
        }

        .login-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .login-tab.active {
            color: var(--primary);
            background: var(--bg-hover);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-base);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            font-size: 0.875rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .form-footer {
            margin-top: var(--spacing-xl);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-footer a {
            color: var(--primary);
            font-weight: 500;
        }

        .theme-toggle-corner {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            cursor: pointer;
        }

        .theme-toggle-slider {
            display: flex;
            gap: var(--spacing-xs);
        }

        .theme-toggle-icon {
            font-size: 1.25rem;
            opacity: 0.3;
            transition: opacity var(--transition-base);
        }

        [data-theme="dark"] .theme-toggle-icon.moon,
        [data-theme="light"] .theme-toggle-icon.sun {
            opacity: 1;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-card-content {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: var(--spacing-md);
            padding: var(--spacing-lg);
            align-items: start;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--spacing-sm);
            border-right: 1px solid var(--border);
        }

        .user-avatar {
            width: 56px;
            height: 56px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-xs);
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            text-align: center;
        }

        .user-role {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: capitalize;
        }

        .user-role.admin {
            color: var(--warning);
        }

        .user-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding-top: var(--spacing-sm);
        }

        .user-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .btn-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: var(--spacing-sm);
            padding: 0.6rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-base);
            text-decoration: none;
        }

        .btn-nav:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-nav i {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .btn-nav span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-container {
            display: flex;
            justify-content: flex-end;
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--border);
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: var(--radius-md);
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-logout i {
            width: 16px;
            height: 16px;
        }

        .btn-outline {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-base);
            margin-top: var(--spacing-md);
        }

        .btn-outline:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle-corner">
        <label class="theme-toggle" title="Toggle dark/light mode">
            <input type="checkbox" id="themeToggle" style="display: none;">
            <span class="theme-toggle-slider">
                <span class="theme-toggle-icon moon">&#127769;</span>
                <span class="theme-toggle-icon sun">&#9728;</span>
            </span>
        </label>
    </div>

    <div class="login-container">
        <!-- Login/Register Card -->
        <div class="login-card" id="authCard">
            <div class="login-header">
                <div class="login-logo">INSIGHT 360</div>
                <p class="login-subtitle">AI-Powered Command Center</p>
            </div>

            <!-- Tabs -->
            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Sign In</button>
                <button class="login-tab" data-tab="forgot">Reset Password</button>
            </div>

            <!-- Error/Success Messages -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Login Form -->
            <div class="form-panel active" id="loginPanel">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span>Sign In</span>
                    </button>
                </form>
            </div>

            <!-- Forgot Password Form -->
            <div class="form-panel" id="forgotPanel">
                <form id="forgotForm">
                    <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 0.9rem;">
                        Enter your email address and we'll send you a link to reset your password.
                    </p>
                    <div class="form-group">
                        <label class="form-label" for="forgotEmail">Email</label>
                        <input type="email" class="form-input" id="forgotEmail" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="btn-primary" id="forgotBtn">
                        <span>Send Reset Link</span>
                    </button>
                </form>
            </div>

            <!-- Reset Password Form (shown when user clicks email link) -->
            <div class="form-panel" id="resetPanel">
                <form id="resetForm">
                    <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 0.9rem;">
                        Enter your new password below.
                    </p>
                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input type="password" class="form-input" id="newPassword" placeholder="At least 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary" id="resetBtn">
                        <span>Reset Password</span>
                    </button>
                </form>
            </div>

            <div class="form-footer">
                <a href="/">Back to Dashboard</a>
            </div>
        </div>

        <!-- Logged In Card -->
        <div class="login-card" id="userCard" style="display: none; max-width: 520px;">
            <div class="user-card-content">
                <!-- Left Column: Avatar & Name -->
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-name" id="userName">User</div>
                    <div class="user-role" id="userRole">user</div>
                </div>

                <!-- Right Column: Role-based Navigation -->
                <div class="user-actions">
                    <!-- Admin Navigation (hidden by default) -->
                    <div class="user-actions-grid" id="adminNav" style="display: none;">
                        <a href="/parthenon.html" class="btn-nav">
                            <i data-lucide="landmark"></i>
                            <span>Parthenon</span>
                        </a>
                        <a href="/admin.html" class="btn-nav">
                            <i data-lucide="users"></i>
                            <span>User Mgmt</span>
                        </a>
                        <a href="/system-health.html" class="btn-nav">
                            <i data-lucide="activity"></i>
                            <span>System Health</span>
                        </a>
                        <a href="/synerginexus.html" class="btn-nav">
                            <i data-lucide="brain-circuit"></i>
                            <span>SynergiNexus</span>
                        </a>
                        <a href="/tags.html" class="btn-nav">
                            <i data-lucide="tags"></i>
                            <span>Tags</span>
                        </a>
                        <a href="/roles.html" class="btn-nav">
                            <i data-lucide="user-cog"></i>
                            <span>Titles</span>
                        </a>
                    </div>

                    <!-- Standard User Navigation (hidden by default) -->
                    <div class="user-actions-grid" id="userNav" style="display: none;">
                        <a href="/chat.html" class="btn-nav">
                            <i data-lucide="message-square"></i>
                            <span>Chat</span>
                        </a>
                        <a href="/execute120.html" class="btn-nav">
                            <i data-lucide="play-circle"></i>
                            <span>Execute 120</span>
                        </a>
                        <a href="/agents.html" class="btn-nav">
                            <i data-lucide="bot"></i>
                            <span>Agent Library</span>
                        </a>
                        <a href="/" class="btn-nav">
                            <i data-lucide="layout-dashboard"></i>
                            <span>Dashboard</span>
                        </a>
                    </div>

                    <!-- Logout Button (bottom right) -->
                    <div class="logout-container">
                        <button class="btn-logout" id="logoutBtn">
                            <i data-lucide="log-out"></i>
                            <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auth state
        let currentUser = null;

        // DOM Elements
        const authCard = document.getElementById('authCard');
        const userCard = document.getElementById('userCard');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const tabs = document.querySelectorAll('.login-tab');
        const panels = document.querySelectorAll('.form-panel');

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            // Check for password reset token in URL
            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));

            // Supabase sends tokens in the hash fragment
            const accessToken = hashParams.get('access_token') || urlParams.get('access_token');
            const resetMode = urlParams.get('reset') === 'true' || accessToken;

            if (resetMode && accessToken) {
                // Show reset password form
                showResetPasswordForm(accessToken);
                return;
            }

            await checkAuthStatus();
            setupEventListeners();
        });

        // Check if user is already logged in
        async function checkAuthStatus() {
            const token = localStorage.getItem('insight360_token');
            if (!token) {
                showAuthCard();
                return;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.user) {
                        currentUser = data.user;
                        showUserCard(data.user);
                        return;
                    }
                }

                // Token invalid, clear it
                localStorage.removeItem('insight360_token');
                localStorage.removeItem('insight360_user');
                showAuthCard();
            } catch (error) {
                console.error('Auth check failed:', error);
                showAuthCard();
            }
        }

        // Show login/register card
        function showAuthCard() {
            authCard.style.display = 'block';
            userCard.style.display = 'none';
        }

        // Show logged-in user card (direction modal)
        function showUserCard(user) {
            authCard.style.display = 'none';
            userCard.style.display = 'none';

            // Show the direction modal
            directionModal.show(user);
        }

        // Show reset password form (when user clicks email link)
        function showResetPasswordForm(accessToken) {
            // Store token for form submission
            window.resetAccessToken = accessToken;

            // Hide tabs and show reset panel
            document.querySelector('.login-tabs').style.display = 'none';
            panels.forEach(p => p.classList.remove('active'));
            document.getElementById('resetPanel').classList.add('active');

            // Setup reset form handler
            document.getElementById('resetForm').addEventListener('submit', handleResetPassword);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Tab switching
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;

                    tabs.forEach(t => t.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(tabId + 'Panel').classList.add('active');

                    hideMessages();
                });
            });

            // Login form
            document.getElementById('loginForm').addEventListener('submit', handleLogin);

            // Forgot password form
            document.getElementById('forgotForm').addEventListener('submit', handleForgotPassword);

            // Reset password form
            document.getElementById('resetForm').addEventListener('submit', handleResetPassword);

            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        }

        // Handle login
        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();

            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store token in localStorage (cookie is now set by server with httpOnly flag)
                    localStorage.setItem('insight360_token', data.session.access_token);
                    localStorage.setItem('insight360_user', JSON.stringify(data.user));
                    if (data.session.expires_at) {
                        localStorage.setItem('insight360_token_expires_at', String(data.session.expires_at));
                    }

                    currentUser = data.user;

                    // Check if this is a new user who needs onboarding
                    // Redirect to dashboard with onboarding param to trigger wizard
                    const isNewUser = !localStorage.getItem('insight360_onboarding_shown');
                    if (isNewUser) {
                        localStorage.setItem('insight360_onboarding_shown', 'true');
                        window.location.href = '/?onboarding=true';
                        return;
                    }

                    showUserCard(data.user);
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                console.error('Login error:', error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In</span>';
            }
        }

        // Handle forgot password
        async function handleForgotPassword(e) {
            e.preventDefault();
            hideMessages();

            const btn = document.getElementById('forgotBtn');
            const email = document.getElementById('forgotEmail').value;

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.message || 'If an account exists with this email, a password reset link has been sent.');
                    document.getElementById('forgotForm').reset();
                } else {
                    showError(data.error || 'Failed to send reset email');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                console.error('Forgot password error:', error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Send Reset Link</span>';
            }
        }

        // Handle reset password
        async function handleResetPassword(e) {
            e.preventDefault();
            hideMessages();

            const btn = document.getElementById('resetBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            if (newPassword.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        access_token: window.resetAccessToken,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.message || 'Password reset successfully!');
                    // Clear URL parameters and show login form
                    setTimeout(() => {
                        window.history.replaceState({}, document.title, '/login.html');
                        document.querySelector('.login-tabs').style.display = 'flex';
                        tabs[0].click(); // Switch to login tab
                    }, 2000);
                } else {
                    showError(data.error || 'Failed to reset password');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                console.error('Reset password error:', error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Reset Password</span>';
            }
        }

        // Handle logout
        async function handleLogout() {
            const token = localStorage.getItem('insight360_token');

            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            // Clear local storage and cookie
            localStorage.removeItem('insight360_token');
            localStorage.removeItem('insight360_user');
            document.cookie = 'auth_token=; path=/; max-age=0';
            currentUser = null;

            showAuthCard();
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Show success message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        // Hide messages
        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }
    </script>
</body>
</html>
