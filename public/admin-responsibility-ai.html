<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsibility AI Mapping | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .ai-mapping-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .responsibility-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .responsibility-info h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
        }

        .responsibility-meta {
            display: flex;
            gap: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .responsibility-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .ai-sections {
            display: grid;
            gap: 2rem;
        }

        .ai-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .ai-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .ai-section-header h2 {
            margin: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ai-section-header h2 svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        .add-btn {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .add-btn:hover {
            background: var(--primary-hover);
        }

        .ai-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .ai-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .ai-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .ai-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .ai-item-details h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1rem;
        }

        .ai-item-details p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .strength-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .strength-required {
            background: #fef2f2;
            color: #dc2626;
        }

        .strength-recommended {
            background: #fffbeb;
            color: #d97706;
        }

        .strength-suggested {
            background: #f0fdf4;
            color: #16a34a;
        }

        .ai-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-secondary);
        }

        .action-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .action-btn.delete:hover {
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-primary);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            color: var(--text-secondary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-secondary);
            font-size: 0.95rem;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn-secondary {
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary {
            padding: 0.75rem 1.25rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .help-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .help-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="ai-mapping-container">
                <!-- Header -->
                <div class="header-row">
                        <a href="/admin-responsibilities.html" class="back-link">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        Back to Responsibilities
                    </a>
                    <button class="help-btn" onclick="HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                </div>

                <div class="responsibility-header">
                <div class="responsibility-info">
                    <h1 id="responsibility-name">Loading...</h1>
                    <div class="responsibility-meta">
                        <span id="responsibility-level"></span>
                        <span id="responsibility-tags"></span>
                    </div>
                </div>
            </div>

            <!-- AI Sections -->
            <div class="ai-sections">
                <!-- Agents Section -->
                <section class="ai-section">
                    <div class="ai-section-header">
                        <h2>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 8V4H8"/>
                                <rect x="8" y="2" width="8" height="4" rx="1"/>
                                <rect x="3" y="12" width="18" height="10" rx="2"/>
                                <circle cx="9" cy="17" r="2"/>
                                <circle cx="15" cy="17" r="2"/>
                            </svg>
                            Recommended Agents
                        </h2>
                        <button class="add-btn" onclick="showAddModal('agents')">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Agent
                        </button>
                    </div>
                    <div id="agents-list" class="ai-list">
                        <div class="loading-spinner"><div class="spinner"></div></div>
                    </div>
                </section>

                <!-- Skills Section -->
                <section class="ai-section">
                    <div class="ai-section-header">
                        <h2>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                <path d="M2 17l10 5 10-5"/>
                                <path d="M2 12l10 5 10-5"/>
                            </svg>
                            Recommended Skills
                        </h2>
                        <button class="add-btn" onclick="showAddModal('skills')">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Skill
                        </button>
                    </div>
                    <div id="skills-list" class="ai-list">
                        <div class="loading-spinner"><div class="spinner"></div></div>
                    </div>
                </section>

                <!-- Workflows Section -->
                <section class="ai-section">
                    <div class="ai-section-header">
                        <h2>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 3h6v6H3zM15 3h6v6h-6zM9 15h6v6H9z"/>
                                <path d="M6 9v3H3v6h6v-3M18 9v6h-3"/>
                            </svg>
                            Recommended Workflows
                        </h2>
                        <button class="add-btn" onclick="showAddModal('workflows')">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Workflow
                        </button>
                    </div>
                    <div id="workflows-list" class="ai-list">
                        <div class="loading-spinner"><div class="spinner"></div></div>
                    </div>
                </section>
            </div>
            </div>
        </main>
    </div>

    <!-- Add Modal -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add AI Recommendation</h2>
                <button class="modal-close" onclick="closeModal()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="add-form" onsubmit="handleAddSubmit(event)">
                    <input type="hidden" id="add-type" value="">

                    <div class="form-group">
                        <label id="entity-label">Select Item</label>
                        <select id="entity-select" required>
                            <option value="">-- Select --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Recommendation Strength</label>
                        <select id="strength-select" required>
                            <option value="suggested">Suggested - Nice to have</option>
                            <option value="recommended">Recommended - Should use</option>
                            <option value="required">Required - Must use</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Use Case Note (Optional)</label>
                        <textarea id="use-case-note" rows="3" placeholder="Describe when/how this should be used..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary" form="add-form">Add Recommendation</button>
            </div>
        </div>
    </div>

    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
    <script>
        // State
        let responsibilityId = null;
        let responsibility = null;
        let aiMappings = { agents: [], skills: [], workflows: [] };
        let availableEntities = { agents: [], skills: [], workflows: [] };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            // Get responsibility ID from URL
            const params = new URLSearchParams(window.location.search);
            responsibilityId = params.get('id');

            if (!responsibilityId) {
                alert('No responsibility ID provided');
                window.location.href = '/admin-responsibilities.html';
                return;
            }

            loadData();
        });

        async function loadData() {
            try {
                await Promise.all([
                    loadResponsibility(),
                    loadAIMappings(),
                    loadAvailableEntities()
                ]);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        async function loadResponsibility() {
            try {
                const response = await fetch(`/api/roles/responsibilities/${responsibilityId}`);
                const result = await response.json();

                if (result.success && result.data) {
                    responsibility = result.data;
                    document.getElementById('responsibility-name').textContent = responsibility.name;
                    document.getElementById('responsibility-level').textContent =
                        `Level: ${responsibility.level || 'N/A'}`;
                } else {
                    document.getElementById('responsibility-name').textContent = 'Responsibility not found';
                }
            } catch (error) {
                console.error('Error loading responsibility:', error);
                document.getElementById('responsibility-name').textContent = 'Error loading responsibility';
            }
        }

        async function loadAIMappings() {
            try {
                const response = await fetch(`/api/connections/responsibilities/${responsibilityId}/ai`);
                const result = await response.json();

                if (result.success && result.data) {
                    // Group by entity type
                    aiMappings = { agents: [], skills: [], workflows: [] };
                    result.data.forEach(item => {
                        if (item.entity_type === 'agent') {
                            aiMappings.agents.push(item);
                        } else if (item.entity_type === 'skill') {
                            aiMappings.skills.push(item);
                        } else if (item.entity_type === 'workflow') {
                            aiMappings.workflows.push(item);
                        }
                    });
                }

                renderAllLists();
            } catch (error) {
                console.error('Error loading AI mappings:', error);
                renderAllLists();
            }
        }

        async function loadAvailableEntities() {
            try {
                const [agentsRes, skillsRes, workflowsRes] = await Promise.all([
                    fetch('/api/agents'),
                    fetch('/api/skills'),
                    fetch('/api/workflows')
                ]);

                const [agents, skills, workflows] = await Promise.all([
                    agentsRes.json(),
                    skillsRes.json(),
                    workflowsRes.json()
                ]);

                availableEntities.agents = agents.success ? agents.data : [];
                availableEntities.skills = skills.success ? skills.data : [];
                availableEntities.workflows = workflows.success ? workflows.data : [];
            } catch (error) {
                console.error('Error loading available entities:', error);
            }
        }

        function renderAllLists() {
            renderList('agents', aiMappings.agents);
            renderList('skills', aiMappings.skills);
            renderList('workflows', aiMappings.workflows);
        }

        function renderList(type, items) {
            const container = document.getElementById(`${type}-list`);

            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M12 8v8M8 12h8"/>
                        </svg>
                        <p>No ${type} mapped yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="ai-item">
                    <div class="ai-item-info">
                        <div class="ai-item-icon">
                            ${getTypeIcon(type)}
                        </div>
                        <div class="ai-item-details">
                            <h3>${item.entity_name || 'Unknown'}</h3>
                            <p>${item.use_case_note || 'No description'}</p>
                        </div>
                    </div>
                    <div class="ai-item-actions">
                        <span class="strength-badge strength-${item.recommendation_strength}">
                            ${item.recommendation_strength}
                        </span>
                        <button class="action-btn delete" onclick="removeMapping('${type}', '${item.entity_id}')" title="Remove">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getTypeIcon(type) {
            const icons = {
                agents: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a7.5 7.5 0 0113 0"/></svg>',
                skills: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>',
                workflows: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="9" y="15" width="6" height="6" rx="1"/><path d="M6 9v3H9M18 9v6h-3"/></svg>'
            };
            return icons[type] || '';
        }

        function showAddModal(type) {
            const modal = document.getElementById('add-modal');
            const typeInput = document.getElementById('add-type');
            const titleEl = document.getElementById('modal-title');
            const labelEl = document.getElementById('entity-label');
            const selectEl = document.getElementById('entity-select');

            typeInput.value = type;

            const typeLabels = {
                agents: 'Agent',
                skills: 'Skill',
                workflows: 'Workflow'
            };

            titleEl.textContent = `Add ${typeLabels[type]} Recommendation`;
            labelEl.textContent = `Select ${typeLabels[type]}`;

            // Populate select with available entities
            const entities = availableEntities[type] || [];
            const existingIds = aiMappings[type].map(m => m.entity_id);
            const filteredEntities = entities.filter(e => !existingIds.includes(e.id));

            selectEl.innerHTML = '<option value="">-- Select --</option>' +
                filteredEntities.map(e => `<option value="${e.id}">${e.name || e.title}</option>`).join('');

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.remove('active');
            document.getElementById('add-form').reset();
        }

        async function handleAddSubmit(event) {
            event.preventDefault();

            const type = document.getElementById('add-type').value;
            const entityId = document.getElementById('entity-select').value;
            const strength = document.getElementById('strength-select').value;
            const note = document.getElementById('use-case-note').value;

            if (!entityId) {
                alert('Please select an item');
                return;
            }

            const idKey = type === 'agents' ? 'agent_id' : type === 'skills' ? 'skill_id' : 'workflow_id';

            try {
                const response = await fetch(`/api/connections/responsibilities/${responsibilityId}/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        [idKey]: entityId,
                        recommendation_strength: strength,
                        use_case_note: note || null
                    })
                });

                const result = await response.json();

                if (result.success) {
                    closeModal();
                    await loadAIMappings();
                } else {
                    alert(result.error || 'Failed to add recommendation');
                }
            } catch (error) {
                console.error('Error adding recommendation:', error);
                alert('Failed to add recommendation');
            }
        }

        async function removeMapping(type, entityId) {
            if (!confirm('Remove this AI recommendation?')) return;

            try {
                const response = await fetch(
                    `/api/connections/responsibilities/${responsibilityId}/${type}/${entityId}`,
                    { method: 'DELETE' }
                );

                const result = await response.json();

                if (result.success) {
                    await loadAIMappings();
                } else {
                    alert(result.error || 'Failed to remove recommendation');
                }
            } catch (error) {
                console.error('Error removing recommendation:', error);
                alert('Failed to remove recommendation');
            }
        }
    </script>
</body>
</html>
