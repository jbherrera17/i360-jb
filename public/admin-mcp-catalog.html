<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Catalog | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .stat-card .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .section {
            margin-bottom: 2.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            background: var(--bg-tertiary);
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: var(--bg-tertiary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-badge.approved { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: #eab308; }
        .status-badge.rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .transport-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .action-btn {
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .action-btn:hover { background: var(--bg-tertiary); }
        .action-btn.approve { color: #22c55e; border-color: #22c55e; }
        .action-btn.reject { color: #ef4444; border-color: #ef4444; }
        .action-btn.test { color: #3b82f6; border-color: #3b82f6; }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .capabilities-panel {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .capabilities-panel .cap-section {
            margin-bottom: 0.75rem;
        }

        .capabilities-panel .cap-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-secondary);
        }

        .capabilities-panel .cap-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .capabilities-panel .cap-item {
            padding: 0.15rem 0.5rem;
            background: var(--bg-secondary);
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            width: min(640px, 90vw);
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="page-header">
                <div class="header-content">
                    <h1>
                        <i data-lucide="server" style="width:28px;height:28px;color:var(--primary);"></i>
                        MCP Server Catalog
                    </h1>
                    <p class="header-subtitle">Manage available Model Context Protocol servers for the platform</p>
                </div>
                <div class="header-actions">
                    <button class="help-btn" onclick="HelpModal && HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                    <button class="btn btn-primary" onclick="openCreateModal()">
                        <i data-lucide="plus"></i> Add Server
                    </button>
                </div>
            </header>

            <div style="padding: var(--spacing-xl);">
                <!-- Stats -->
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><div class="stat-label">Total Servers</div><div class="stat-value" id="statTotal">-</div></div>
                    <div class="stat-card"><div class="stat-label">Approved</div><div class="stat-value" id="statApproved">-</div></div>
                    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" id="statPending">-</div></div>
                    <div class="stat-card"><div class="stat-label">Active Connections</div><div class="stat-value" id="statConnections">-</div></div>
                </div>

                <!-- Filters -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="pending">Pending</button>
                    <button class="filter-tab" data-filter="approved">Approved</button>
                    <button class="filter-tab" data-filter="rejected">Rejected</button>
                </div>

                <!-- Table -->
                <div class="section">
                    <table class="data-table" id="catalogTable">
                        <thead>
                            <tr>
                                <th>Server</th>
                                <th>Transport</th>
                                <th>Auth</th>
                                <th>Min Tier</th>
                                <th>Status</th>
                                <th>Connections</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="catalogBody">
                            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add MCP Server</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="serverForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Slug (unique ID)</label>
                        <input type="text" id="slug" required placeholder="e.g., github-mcp" pattern="^[a-z0-9-]+$">
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="name" required placeholder="e.g., GitHub MCP Server">
                    </div>
                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="description" placeholder="What this server provides..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Icon (Lucide name)</label>
                        <input type="text" id="icon" value="plug" placeholder="plug, github, database...">
                    </div>
                    <div class="form-group">
                        <label>Transport Type</label>
                        <select id="transport_type" required onchange="toggleTransportFields()">
                            <option value="streamable_http">Streamable HTTP</option>
                            <option value="stdio">Stdio (subprocess)</option>
                        </select>
                    </div>

                    <!-- HTTP fields -->
                    <div class="form-group full-width" id="httpFields">
                        <label>Default URL</label>
                        <input type="url" id="default_url" placeholder="https://mcp.example.com/mcp">
                    </div>
                    <div class="form-group" id="authTypeField">
                        <label>Auth Type</label>
                        <select id="auth_type">
                            <option value="none">None</option>
                            <option value="api_key">API Key</option>
                            <option value="bearer">Bearer Token</option>
                        </select>
                    </div>

                    <!-- Stdio fields (hidden by default) -->
                    <div class="form-group" id="stdioCommand" style="display:none;">
                        <label>Command</label>
                        <input type="text" id="command" placeholder="npx">
                    </div>
                    <div class="form-group" id="stdioArgs" style="display:none;">
                        <label>Args (comma-separated)</label>
                        <input type="text" id="args" placeholder="-y, @modelcontextprotocol/server-filesystem">
                    </div>

                    <div class="form-group">
                        <label>Min Tier</label>
                        <select id="min_tier">
                            <option value="">All Tiers</option>
                            <option value="business">Business</option>
                            <option value="enterprise">Enterprise</option>
                            <option value="agency_starter">Agency Starter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="platform_admin_only"> Platform Admin Only
                        </label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Test Results Modal -->
    <div class="modal-overlay" id="testModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Test Results</h2>
                <button class="modal-close" onclick="closeTestModal()">&times;</button>
            </div>
            <div id="testResults"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeTestModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="/js/modal-service-loader.js"></script>
    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
    <script>
        let catalogData = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('insight360-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (typeof initNavigation === 'function') await initNavigation();
            if (typeof lucide !== 'undefined') lucide.createIcons();

            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderTable();
                });
            });

            await loadCatalog();
        });

        async function loadCatalog() {
            try {
                const resp = await fetch('/api/platform/mcp/catalog', {
                    headers: { 'x-org-id': localStorage.getItem('insight360-org-id') }
                });
                const result = await resp.json();
                if (result.success) {
                    catalogData = result.data;
                    updateStats();
                    renderTable();
                }
            } catch (err) {
                console.error('Failed to load catalog:', err);
            }
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = catalogData.length;
            document.getElementById('statApproved').textContent = catalogData.filter(e => e.status === 'approved').length;
            document.getElementById('statPending').textContent = catalogData.filter(e => e.status === 'pending').length;
            document.getElementById('statConnections').textContent = catalogData.reduce((sum, e) => sum + (e.connected_count || 0), 0);
        }

        function renderTable() {
            const filtered = currentFilter === 'all'
                ? catalogData
                : catalogData.filter(e => e.status === currentFilter);

            const tbody = document.getElementById('catalogBody');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No servers found</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(entry => `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:0.5rem;">
                            <i data-lucide="${entry.icon || 'plug'}" style="width:18px;height:18px;color:var(--primary);"></i>
                            <div>
                                <div style="font-weight:600;">${escapeHtml(entry.name)}</div>
                                <div style="font-size:0.8rem;color:var(--text-secondary);">${escapeHtml(entry.slug)}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="transport-badge">${entry.transport_type}</span></td>
                    <td>${entry.auth_type || 'none'}</td>
                    <td>${entry.min_tier || 'All'}</td>
                    <td><span class="status-badge ${entry.status}">${entry.status}</span></td>
                    <td>${entry.connection_count || 0} (${entry.connected_count || 0} active)</td>
                    <td>
                        <div class="actions-cell">
                            ${entry.status === 'pending' ? `
                                <button class="action-btn approve" onclick="approveEntry('${entry.id}')">Approve</button>
                                <button class="action-btn reject" onclick="rejectEntry('${entry.id}')">Reject</button>
                            ` : ''}
                            <button class="action-btn test" onclick="testEntry('${entry.id}')">Test</button>
                            <button class="action-btn" onclick="editEntry('${entry.id}')">Edit</button>
                            <button class="action-btn reject" onclick="deleteEntry('${entry.id}', '${escapeHtml(entry.name)}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Add MCP Server';
            document.getElementById('submitBtn').textContent = 'Create';
            document.getElementById('editId').value = '';
            document.getElementById('serverForm').reset();
            document.getElementById('transport_type').value = 'streamable_http';
            toggleTransportFields();
            document.getElementById('createModal').classList.add('active');
        }

        function editEntry(id) {
            const entry = catalogData.find(e => e.id === id);
            if (!entry) return;

            document.getElementById('modalTitle').textContent = 'Edit MCP Server';
            document.getElementById('submitBtn').textContent = 'Save';
            document.getElementById('editId').value = id;
            document.getElementById('slug').value = entry.slug;
            document.getElementById('name').value = entry.name;
            document.getElementById('description').value = entry.description || '';
            document.getElementById('icon').value = entry.icon || 'plug';
            document.getElementById('transport_type').value = entry.transport_type;
            document.getElementById('default_url').value = entry.default_url || '';
            document.getElementById('auth_type').value = entry.auth_type || 'none';
            document.getElementById('command').value = entry.command || '';
            document.getElementById('args').value = (entry.args || []).join(', ');
            document.getElementById('min_tier').value = entry.min_tier || '';
            document.getElementById('platform_admin_only').checked = entry.platform_admin_only;
            toggleTransportFields();
            document.getElementById('createModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        function closeTestModal() {
            document.getElementById('testModal').classList.remove('active');
        }

        function toggleTransportFields() {
            const isHttp = document.getElementById('transport_type').value === 'streamable_http';
            document.getElementById('httpFields').style.display = isHttp ? '' : 'none';
            document.getElementById('authTypeField').style.display = isHttp ? '' : 'none';
            document.getElementById('stdioCommand').style.display = isHttp ? 'none' : '';
            document.getElementById('stdioArgs').style.display = isHttp ? 'none' : '';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const body = {
                slug: document.getElementById('slug').value,
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                icon: document.getElementById('icon').value,
                transport_type: document.getElementById('transport_type').value,
                default_url: document.getElementById('default_url').value || null,
                auth_type: document.getElementById('auth_type').value,
                command: document.getElementById('command').value || null,
                args: document.getElementById('args').value ? document.getElementById('args').value.split(',').map(s => s.trim()) : [],
                min_tier: document.getElementById('min_tier').value || null,
                platform_admin_only: document.getElementById('platform_admin_only').checked
            };

            try {
                const url = editId
                    ? `/api/platform/mcp/catalog/${editId}`
                    : '/api/platform/mcp/catalog';
                const method = editId ? 'PUT' : 'POST';

                const resp = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'x-org-id': localStorage.getItem('insight360-org-id')
                    },
                    body: JSON.stringify(body)
                });
                const result = await resp.json();

                if (result.success) {
                    showToast(editId ? 'Server updated' : 'Server created', 'success');
                    closeModal();
                    await loadCatalog();
                } else {
                    showToast(result.error || 'Failed', 'error');
                }
            } catch (err) {
                showToast('Request failed: ' + err.message, 'error');
            }
        }

        async function approveEntry(id) {
            if (!confirm('Approve this MCP server?')) return;
            try {
                const resp = await fetch(`/api/platform/mcp/catalog/${id}/approve`, {
                    method: 'POST',
                    headers: { 'x-org-id': localStorage.getItem('insight360-org-id') }
                });
                const result = await resp.json();
                if (result.success) {
                    showToast('Server approved', 'success');
                    await loadCatalog();
                } else {
                    showToast(result.error, 'error');
                }
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
            }
        }

        async function rejectEntry(id) {
            const reason = prompt('Rejection reason (optional):');
            try {
                const resp = await fetch(`/api/platform/mcp/catalog/${id}/reject`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-org-id': localStorage.getItem('insight360-org-id')
                    },
                    body: JSON.stringify({ reason })
                });
                const result = await resp.json();
                if (result.success) {
                    showToast('Server rejected', 'success');
                    await loadCatalog();
                } else {
                    showToast(result.error, 'error');
                }
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
            }
        }

        async function testEntry(id) {
            const entry = catalogData.find(e => e.id === id);
            if (!entry) return;

            let credentials = {};
            if (entry.auth_type === 'api_key' || entry.auth_type === 'bearer') {
                const key = prompt('Enter API key/token for testing:');
                if (key === null) return;
                credentials.api_key = key;
            }

            const url = prompt('URL (leave blank for default):', entry.default_url || '');
            if (url) credentials.url = url;

            document.getElementById('testResults').innerHTML = '<p>Testing connection...</p>';
            document.getElementById('testModal').classList.add('active');

            try {
                const resp = await fetch(`/api/platform/mcp/catalog/${id}/test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-org-id': localStorage.getItem('insight360-org-id')
                    },
                    body: JSON.stringify({ credentials })
                });
                const result = await resp.json();

                if (result.success && result.data?.success) {
                    const caps = result.data.capabilities;
                    document.getElementById('testResults').innerHTML = `
                        <p style="color:#22c55e;font-weight:600;margin-bottom:1rem;">Connection successful!</p>
                        <div class="capabilities-panel">
                            <div class="cap-section">
                                <div class="cap-title">Tools (${caps.tools.length})</div>
                                <div class="cap-list">
                                    ${caps.tools.map(t => `<span class="cap-item" title="${escapeHtml(t.description || '')}">${escapeHtml(t.name)}</span>`).join('')}
                                    ${caps.tools.length === 0 ? '<span style="color:var(--text-secondary)">None</span>' : ''}
                                </div>
                            </div>
                            <div class="cap-section">
                                <div class="cap-title">Resources (${caps.resources.length})</div>
                                <div class="cap-list">
                                    ${caps.resources.map(r => `<span class="cap-item">${escapeHtml(r.name || r.uri)}</span>`).join('')}
                                    ${caps.resources.length === 0 ? '<span style="color:var(--text-secondary)">None</span>' : ''}
                                </div>
                            </div>
                            <div class="cap-section">
                                <div class="cap-title">Prompts (${caps.prompts.length})</div>
                                <div class="cap-list">
                                    ${caps.prompts.map(p => `<span class="cap-item">${escapeHtml(p.name)}</span>`).join('')}
                                    ${caps.prompts.length === 0 ? '<span style="color:var(--text-secondary)">None</span>' : ''}
                                </div>
                            </div>
                        </div>
                    `;
                    await loadCatalog();
                } else {
                    document.getElementById('testResults').innerHTML = `
                        <p style="color:#ef4444;font-weight:600;">Connection failed</p>
                        <p style="margin-top:0.5rem;color:var(--text-secondary);">${escapeHtml(result.error || result.data?.error || 'Unknown error')}</p>
                    `;
                }
            } catch (err) {
                document.getElementById('testResults').innerHTML = `
                    <p style="color:#ef4444;">Request failed: ${escapeHtml(err.message)}</p>
                `;
            }
        }

        async function deleteEntry(id, name) {
            if (!confirm(`Delete "${name}"? This will also remove all org connections to this server.`)) return;
            try {
                const resp = await fetch(`/api/platform/mcp/catalog/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-org-id': localStorage.getItem('insight360-org-id') }
                });
                const result = await resp.json();
                if (result.success) {
                    showToast('Server deleted', 'success');
                    await loadCatalog();
                } else {
                    showToast(result.error, 'error');
                }
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
            } else {
                console.log(`[${type}] ${message}`);
            }
        }
    </script>
</body>
</html>
