<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier Configuration | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .tier-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 2px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .tier-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .tier-card.editing {
            border-color: var(--primary);
        }

        .tier-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
            border-bottom: 1px solid var(--border);
        }

        .tier-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .tier-starter { background: #e5e7eb; color: #374151; }
        .tier-business { background: #dbeafe; color: #1d4ed8; }
        .tier-enterprise { background: #fef3c7; color: #b45309; }
        .tier-agency { background: #ede9fe; color: #7c3aed; }
        .tier-agency_starter { background: #e0e7ff; color: #4338ca; }
        .tier-agency_professional { background: #ede9fe; color: #7c3aed; }
        .tier-agency_enterprise { background: #fce7f3; color: #be185d; }

        .tier-group-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
            margin-bottom: 0.25rem;
        }

        .tier-group-header i {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        .tier-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .tier-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .tier-price span {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .tier-body {
            padding: 1.5rem;
        }

        .tier-section {
            margin-bottom: 1.5rem;
        }

        .tier-section:last-child {
            margin-bottom: 0;
        }

        .tier-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .limit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .limit-item {
            display: flex;
            flex-direction: column;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        .limit-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .limit-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .limit-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 600;
        }

        .feature-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .feature-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .feature-tag.enabled {
            background: var(--success);
            color: white;
        }

        .feature-tag.disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .feature-toggle {
            cursor: pointer;
        }

        .tier-footer {
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tier-stats {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 2rem;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .comparison-table th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }

        .comparison-table th:first-child,
        .comparison-table td:first-child {
            text-align: left;
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .check-icon {
            color: var(--success);
        }

        .x-icon {
            color: var(--text-muted);
        }

        .page-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Module grid styles */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .module-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .module-item i {
            width: 14px;
            height: 14px;
            color: var(--primary);
        }

        .module-item.disabled {
            opacity: 0.5;
        }

        .module-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .modules-category {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .modules-category:first-child {
            margin-top: 0;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
        }

        .loading-card h3 {
            margin: 1rem 0 0.5rem 0;
        }

        .loading-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .access-denied {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
        }

        .access-denied i {
            width: 64px;
            height: 64px;
            color: var(--danger);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div id="accessDenied" class="access-denied hidden">
                <i data-lucide="shield-x"></i>
                <h2>Access Denied</h2>
                <p>You don't have permission to configure subscription tiers.</p>
                <a href="/" class="btn btn-primary" style="margin-top: 1rem;">
                    <i data-lucide="home"></i>
                    Return to Dashboard
                </a>
            </div>

            <div id="mainContent">
                <header class="page-header">
                    <div class="header-content">
                        <h1>
                            <i data-lucide="layers" style="width:28px;height:28px;color:var(--primary);"></i>
                            Subscription Tier Configuration
                        </h1>
                        <p class="header-subtitle">Configure resource limits and features for each subscription tier</p>
                    </div>
                    <div class="header-actions">
                        <button class="help-btn" onclick="HelpModal.open()" title="Help">
                            <i data-lucide="help-circle"></i>
                        </button>
                        <button class="btn btn-secondary" onclick="resetChanges()">
                            <i data-lucide="rotate-ccw"></i>
                            Reset
                        </button>
                        <button class="btn btn-primary" onclick="saveAllChanges()">
                            <i data-lucide="save"></i>
                            Save All Changes
                        </button>
                    </div>
                </header>

                <!-- Content Area with consistent 2rem padding -->
                <div style="padding: var(--spacing-xl);">

                <!-- Tier Cards -->
                <div class="tier-grid" id="tierGrid">
                    <!-- Tier cards will be loaded here -->
                </div>

                <!-- Comparison Table -->
                <h2 style="margin-top: 2rem; margin-bottom: 1rem;">
                    <i data-lucide="table"></i>
                    Feature Comparison
                </h2>
                <table class="comparison-table" id="comparisonTable">
                    <thead id="comparisonHead">
                        <!-- Dynamic headers generated from tiers array -->
                    </thead>
                    <tbody id="comparisonBody">
                        <!-- Comparison rows will be loaded here -->
                    </tbody>
                </table>

                </div><!-- End content padding wrapper -->
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <img src="/assets/loading-spinner.svg" alt="Loading..." style="width:48px;height:48px;">
            <h3 id="loadingTitle">Loading</h3>
            <p id="loadingMessage">Please wait...</p>
        </div>
    </div>

    <script src="/js/modal-service/loader.js" data-auto-load></script>
    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
    <script>
        // State
        let tiers = [];
        let originalTiers = [];
        let hasChanges = false;
        let tierModules = {}; // { tierId: { modules: [], by_nav_group: {} } }
        let allModules = []; // All platform modules (for addon pricing config)
        let addonPricingChanges = {}; // { moduleId: { is_addon_purchasable, addon_price_monthly, ... } }

        // Nav group labels matching navigation.js
        const NAV_GROUP_LABELS = {
            'primary': 'Primary',
            'ai-systems': 'AI 360 Systems',
            'dashboards': 'Dashboards',
            'modules': 'Modules',
            'agency': 'Agency',
            'admin': 'Administration'
        };

        // Nav group display order
        const NAV_GROUP_ORDER = ['primary', 'ai-systems', 'dashboards', 'modules', 'agency', 'admin'];

        const ADDON_CATEGORIES = {
            productivity: 'Productivity (Google, Microsoft, Slack)',
            client_system: 'Client Systems (Salesforce, HubSpot)'
        };

        const ADDON_FIELDS = {
            monthly_price: { label: 'Price/mo ($)', step: '0.01' },
            api_call_limit: { label: 'API Calls' },
            user_limit: { label: 'Users' }
        };

        const FEATURE_LABELS = {
            white_label: 'White Label',
            custom_branding: 'Custom Branding',
            api_access: 'API Access',
            sso: 'Single Sign-On',
            priority_support: 'Priority Support',
            advanced_analytics: 'Advanced Analytics',
            client_portal: 'Client Portal'
        };

        const LIMIT_LABELS = {
            max_members: 'Members',
            max_clients: 'Clients',
            max_agents: 'Agents',
            max_workflows: 'Workflows',
            max_skills: 'Skills',
            max_context_assets: 'Context Assets',
            max_research_studios: 'Research Studios',
            max_monthly_api_calls: 'API Calls/Month',
            max_social_posts_monthly: 'Social Posts/Month',
            max_social_channels: 'Social Channels'
        };

        // Show/hide loading overlay
        function showLoading(title = 'Loading', message = 'Please wait...') {
            document.getElementById('loadingTitle').textContent = title;
            document.getElementById('loadingMessage').textContent = message;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('insight360-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            if (typeof initNavigation === 'function') {
                await initNavigation();
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            const hasAccess = await checkPlatformAdminAccess();
            if (!hasAccess) {
                document.getElementById('mainContent').classList.add('hidden');
                document.getElementById('accessDenied').classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            await loadTiers();
        });

        function getAuthToken() {
            const token = localStorage.getItem('insight360_token') || localStorage.getItem('auth_token');
            if (token) return token;
            const cookies = document.cookie.split(';');
            for (const cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'auth_token') return value;
            }
            return null;
        }

        async function checkPlatformAdminAccess() {
            try {
                const token = getAuthToken();
                if (!token) return false;

                const response = await fetch('/api/platform/tiers', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                return response.ok;
            } catch (error) {
                return false;
            }
        }

        async function loadTiers() {
            try {
                showLoading('Loading Tiers', 'Fetching subscription tier data...');
                const token = getAuthToken();
                const response = await fetch('/api/platform/tiers', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load tiers');

                const data = await response.json();
                tiers = data.data || [];
                originalTiers = JSON.parse(JSON.stringify(tiers));

                // Load modules for each tier
                showLoading('Loading Tiers', 'Loading module configurations...');
                await loadTierModules();

                renderTiers();
                renderComparison();
            } catch (error) {
                console.error('Error loading tiers:', error);
                showToast('Failed to load tiers', 'error');
            } finally {
                hideLoading();
            }
        }

        async function loadTierModules() {
            const token = getAuthToken();

            // Load modules per tier and all modules in parallel
            const promises = tiers.map(async tier => {
                try {
                    const response = await fetch(`/api/platform/tiers/${tier.id}/modules`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        tierModules[tier.id] = data.data || { modules: [], by_nav_group: {} };
                    }
                } catch (error) {
                    console.warn(`Failed to load modules for tier ${tier.id}:`, error);
                    tierModules[tier.id] = { modules: [], by_nav_group: {} };
                }
            });

            // Also fetch all modules for addon pricing config
            promises.push((async () => {
                try {
                    const response = await fetch('/api/pricing/modules');
                    if (response.ok) {
                        const data = await response.json();
                        allModules = data.data?.modules || [];
                    }
                } catch (error) {
                    console.warn('Failed to load all modules:', error);
                }
            })());

            await Promise.all(promises);
        }

        function renderTierModules(tierId) {
            const data = tierModules[tierId];
            const groups = data?.by_nav_group;
            if (!groups || Object.keys(groups).length === 0) {
                return '<div style="color: var(--text-muted); font-size: 0.75rem;">No modules configured</div>';
            }

            let html = '';
            for (const groupId of NAV_GROUP_ORDER) {
                const modules = groups[groupId];
                if (!modules || modules.length === 0) continue;

                html += `<div class="modules-category">${NAV_GROUP_LABELS[groupId] || groupId}</div>`;
                html += '<div class="modules-grid">';
                for (const module of modules) {
                    html += `
                        <div class="module-item" title="${escapeHtml(module.description || '')}">
                            <i data-lucide="${module.icon || 'puzzle'}"></i>
                            <span>${escapeHtml(module.name)}</span>
                            ${module.is_beta ? '<span style="color: var(--warning); font-size: 0.6rem;">BETA</span>' : ''}
                        </div>
                    `;
                }
                html += '</div>';
            }

            return html || '<div style="color: var(--text-muted); font-size: 0.75rem;">No modules available</div>';
        }

        function renderModuleAddonConfig() {
            if (!allModules || allModules.length === 0) {
                return '<div style="color: var(--text-muted); font-size: 0.75rem;">Loading modules...</div>';
            }

            // Show modules that have min_tier set (i.e., not available to all tiers)
            const addonCandidates = allModules.filter(m => m.min_tier);
            if (addonCandidates.length === 0) {
                return '<div style="color: var(--text-muted); font-size: 0.75rem;">All modules are available to every tier</div>';
            }

            let html = '<div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Configure which modules can be purchased as add-ons by lower tiers.</div>';

            for (const mod of addonCandidates) {
                const changes = addonPricingChanges[mod.id] || {};
                const purchasable = changes.is_addon_purchasable ?? mod.is_addon_purchasable ?? false;
                const monthly = changes.addon_price_monthly ?? mod.addon_price_monthly ?? '';
                const yearly = changes.addon_price_yearly ?? mod.addon_price_yearly ?? '';

                html += `
                    <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0; border-bottom: 1px solid var(--border); flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer; min-width: 160px;">
                            <input type="checkbox" ${purchasable ? 'checked' : ''}
                                   onchange="updateModuleAddon('${mod.id}', 'is_addon_purchasable', this.checked)">
                            <i data-lucide="${mod.icon || 'puzzle'}" style="width: 14px; height: 14px;"></i>
                            <span style="font-size: 0.8rem;">${escapeHtml(mod.name)}</span>
                        </label>
                        <span style="font-size: 0.7rem; color: var(--text-muted);">min: ${mod.min_tier}</span>
                        <div style="display: flex; gap: 0.25rem; align-items: center; margin-left: auto;">
                            <span style="font-size: 0.7rem; color: var(--text-secondary);">$</span>
                            <input type="number" class="limit-input" style="width: 60px;" step="0.01" placeholder="Mo"
                                   value="${monthly}" ${!purchasable ? 'disabled' : ''}
                                   onchange="updateModuleAddon('${mod.id}', 'addon_price_monthly', this.value)">
                            <span style="font-size: 0.7rem; color: var(--text-muted);">/mo</span>
                            <input type="number" class="limit-input" style="width: 60px;" step="0.01" placeholder="Yr"
                                   value="${yearly}" ${!purchasable ? 'disabled' : ''}
                                   onchange="updateModuleAddon('${mod.id}', 'addon_price_yearly', this.value)">
                            <span style="font-size: 0.7rem; color: var(--text-muted);">/yr</span>
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function updateModuleAddon(moduleId, field, value) {
            if (!addonPricingChanges[moduleId]) {
                const mod = allModules.find(m => m.id === moduleId) || {};
                addonPricingChanges[moduleId] = {
                    is_addon_purchasable: mod.is_addon_purchasable || false,
                    addon_price_monthly: mod.addon_price_monthly,
                    addon_price_yearly: mod.addon_price_yearly
                };
            }
            if (field === 'is_addon_purchasable') {
                addonPricingChanges[moduleId][field] = value;
            } else {
                addonPricingChanges[moduleId][field] = value ? parseFloat(value) : null;
            }
            hasChanges = true;
            renderTiers();
        }

        function renderTierCard(tier) {
            return `
                <div class="tier-card" data-tier-id="${tier.id}">
                    <div class="tier-header">
                        <span class="tier-badge tier-${tier.id}">${tier.id.toUpperCase().replace(/_/g, ' ')}</span>
                        <div class="tier-name">${escapeHtml(tier.name)}</div>
                        <div class="tier-price">
                            $<input type="number" class="limit-input" style="width: 80px; display: inline-block;"
                                   value="${tier.price_monthly || 0}"
                                   onchange="updateTier('${tier.id}', 'price_monthly', this.value)">
                            <span>/month</span>
                        </div>
                    </div>

                    <div class="tier-body">
                        <div class="tier-section">
                            <div class="tier-section-title">Resource Limits</div>
                            <div class="limit-grid">
                                ${Object.entries(LIMIT_LABELS).map(([key, label]) => `
                                    <div class="limit-item">
                                        <span class="limit-label">${label}</span>
                                        ${tier[key] === -1 ? `
                                            <span class="limit-input" style="text-align:center; color: var(--success); font-weight: 600;">Unlimited</span>
                                        ` : `
                                            <input type="number" class="limit-input"
                                                   value="${tier[key] || 0}"
                                                   onchange="updateTier('${tier.id}', '${key}', this.value)">
                                        `}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="tier-section">
                            <div class="tier-section-title">Features</div>
                            <div class="feature-list">
                                ${Object.entries(FEATURE_LABELS).map(([key, label]) => {
                                    const enabled = tier.features?.[key] || false;
                                    return `
                                        <span class="feature-tag feature-toggle ${enabled ? 'enabled' : 'disabled'}"
                                              onclick="toggleFeature('${tier.id}', '${key}')">
                                            <i data-lucide="${enabled ? 'check' : 'x'}" style="width: 12px; height: 12px;"></i>
                                            ${label}
                                        </span>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="tier-section">
                            <div class="tier-section-title">Integration Addon Pricing</div>
                            ${Object.entries(ADDON_CATEGORIES).map(([catKey, catLabel]) => {
                                const addon = tier.integration_addons?.[catKey] || {};
                                return `
                                    <div style="margin-bottom: 0.75rem;">
                                        <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem;">${catLabel}</div>
                                        <div class="limit-grid">
                                            ${Object.entries(ADDON_FIELDS).map(([field, meta]) => `
                                                <div class="limit-item">
                                                    <span class="limit-label">${meta.label}</span>
                                                    <input type="number" class="limit-input"
                                                           value="${addon[field] || 0}"
                                                           ${meta.step ? 'step="' + meta.step + '"' : ''}
                                                           onchange="updateAddon('${tier.id}', '${catKey}', '${field}', this.value)">
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="tier-section">
                            <div class="tier-section-title">
                                Modules Included
                                <span class="module-count">${tierModules[tier.id]?.total_count || 0}</span>
                            </div>
                            ${renderTierModules(tier.id)}
                        </div>

                        <div class="tier-section">
                            <div class="tier-section-title">Module Add-on Pricing</div>
                            ${renderModuleAddonConfig()}
                        </div>
                    </div>

                    <div class="tier-footer">
                        <span class="tier-stats">
                            ${tier.allow_self_upgrade ? 'Self-service upgrade' : 'Manual approval required'}
                        </span>
                        <button class="btn btn-sm btn-secondary" onclick="toggleSelfUpgrade('${tier.id}')">
                            ${tier.allow_self_upgrade ? 'Disable' : 'Enable'} Self-Service
                        </button>
                    </div>
                </div>
            `;
        }

        function renderTiers() {
            const grid = document.getElementById('tierGrid');

            // Group tiers by tier_group
            const groups = {};
            tiers.forEach(tier => {
                const group = tier.tier_group || 'standard';
                if (!groups[group]) groups[group] = [];
                groups[group].push(tier);
            });

            const GROUP_META = {
                standard: { label: 'Standard Tiers', icon: 'building' },
                agency:   { label: 'Agency Tiers', icon: 'briefcase' },
                platform: { label: 'Platform Tiers', icon: 'server' }
            };

            // Render order: standard, agency, then any others
            const orderedGroups = ['standard', 'agency', ...Object.keys(groups).filter(g => g !== 'standard' && g !== 'agency')];

            let html = '';
            for (const groupKey of orderedGroups) {
                const groupTiers = groups[groupKey];
                if (!groupTiers || groupTiers.length === 0) continue;

                const meta = GROUP_META[groupKey] || { label: groupKey.charAt(0).toUpperCase() + groupKey.slice(1) + ' Tiers', icon: 'layers' };

                html += `
                    <div class="tier-group-header">
                        <i data-lucide="${meta.icon}"></i>
                        ${meta.label}
                    </div>
                `;
                html += groupTiers.map(tier => renderTierCard(tier)).join('');
            }

            grid.innerHTML = html;
            lucide.createIcons();
        }

        function renderComparison() {
            const thead = document.getElementById('comparisonHead');
            const tbody = document.getElementById('comparisonBody');
            const colSpan = tiers.length + 1;

            // Dynamic headers
            thead.innerHTML = `<tr><th>Feature</th>${tiers.map(t => `<th>${escapeHtml(t.name)}</th>`).join('')}</tr>`;

            // Limits comparison
            const limitRows = Object.entries(LIMIT_LABELS).map(([key, label]) => `
                <tr>
                    <td><strong>${label}</strong></td>
                    ${tiers.map(tier => `<td>${tier[key] === -1 ? '<span style="color: var(--success);">&#8734;</span>' : (tier[key] || 0)}</td>`).join('')}
                </tr>
            `).join('');

            // Features comparison
            const featureRows = Object.entries(FEATURE_LABELS).map(([key, label]) => `
                <tr>
                    <td><strong>${label}</strong></td>
                    ${tiers.map(tier => {
                        const enabled = tier.features?.[key] || false;
                        return `<td><i data-lucide="${enabled ? 'check' : 'x'}" class="${enabled ? 'check-icon' : 'x-icon'}"></i></td>`;
                    }).join('')}
                </tr>
            `).join('');

            // Integration addon comparison
            const addonRows = Object.entries(ADDON_CATEGORIES).map(([catKey, catLabel]) => `
                <tr>
                    <td><strong>${catLabel}</strong></td>
                    ${tiers.map(tier => {
                        const addon = tier.integration_addons?.[catKey];
                        if (!addon || addon.monthly_price === 0) return '<td style="color: var(--text-muted);">N/A</td>';
                        return `<td>$${addon.monthly_price}/mo<br><span style="font-size:0.75rem;color:var(--text-secondary);">${(addon.api_call_limit||0).toLocaleString()} calls, ${addon.user_limit||0} users</span></td>`;
                    }).join('')}
                </tr>
            `).join('');

            // Module comparison by nav_group
            let moduleRows = '';
            for (const groupId of NAV_GROUP_ORDER) {
                const label = NAV_GROUP_LABELS[groupId] || groupId;
                // Collect all modules in this group from any tier
                const groupModules = new Map();
                for (const tier of tiers) {
                    const modules = tierModules[tier.id]?.by_nav_group?.[groupId] || [];
                    for (const mod of modules) {
                        if (!groupModules.has(mod.id)) groupModules.set(mod.id, mod);
                    }
                }
                if (groupModules.size === 0) continue;

                moduleRows += `<tr><td colspan="${colSpan}" style="background: var(--bg-tertiary); font-weight: 600; font-size: 0.85rem;">${label}</td></tr>`;
                for (const [modId, mod] of groupModules) {
                    moduleRows += `<tr>
                        <td style="padding-left: 1.5rem;"><i data-lucide="${mod.icon || 'puzzle'}" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i>${escapeHtml(mod.name)}</td>
                        ${tiers.map(tier => {
                            const hasMod = (tierModules[tier.id]?.modules || []).some(m => m.id === modId);
                            const addonMod = allModules.find(m => m.id === modId);
                            if (hasMod) {
                                return '<td><i data-lucide="check" class="check-icon"></i></td>';
                            } else if (addonMod?.is_addon_purchasable && addonMod?.addon_price_monthly) {
                                return `<td style="font-size:0.75rem;color:var(--warning);">$${addonMod.addon_price_monthly}/mo</td>`;
                            } else {
                                return '<td><i data-lucide="x" class="x-icon"></i></td>';
                            }
                        }).join('')}
                    </tr>`;
                }
            }

            tbody.innerHTML = `
                <tr><td colspan="${colSpan}" style="background: var(--bg-tertiary); font-weight: 600;">Resource Limits</td></tr>
                ${limitRows}
                <tr><td colspan="${colSpan}" style="background: var(--bg-tertiary); font-weight: 600;">Features</td></tr>
                ${featureRows}
                <tr><td colspan="${colSpan}" style="background: var(--bg-tertiary); font-weight: 600;">Integration Addons</td></tr>
                ${addonRows}
                ${moduleRows}
            `;

            lucide.createIcons();
        }

        function updateAddon(tierId, category, field, value) {
            const tier = tiers.find(t => t.id === tierId);
            if (tier) {
                if (!tier.integration_addons) tier.integration_addons = {};
                if (!tier.integration_addons[category]) tier.integration_addons[category] = {};
                tier.integration_addons[category][field] = field === 'monthly_price' ? parseFloat(value) || 0 : parseInt(value) || 0;
                hasChanges = true;
            }
        }

        function updateTier(tierId, field, value) {
            const tier = tiers.find(t => t.id === tierId);
            if (tier) {
                tier[field] = parseInt(value) || 0;
                hasChanges = true;
                renderComparison();
            }
        }

        function toggleFeature(tierId, featureKey) {
            const tier = tiers.find(t => t.id === tierId);
            if (tier) {
                if (!tier.features) tier.features = {};
                tier.features[featureKey] = !tier.features[featureKey];
                hasChanges = true;
                renderTiers();
                renderComparison();
            }
        }

        function toggleSelfUpgrade(tierId) {
            const tier = tiers.find(t => t.id === tierId);
            if (tier) {
                tier.allow_self_upgrade = !tier.allow_self_upgrade;
                hasChanges = true;
                renderTiers();
            }
        }

        async function saveAllChanges() {
            const token = getAuthToken();

            try {
                showLoading('Saving Changes', 'Updating subscription tiers...');
                for (const tier of tiers) {
                    const response = await fetch(`/api/platform/tiers/${tier.id}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            price_monthly: tier.price_monthly,
                            price_yearly: tier.price_yearly,
                            max_members: tier.max_members,
                            max_clients: tier.max_clients,
                            max_agents: tier.max_agents,
                            max_workflows: tier.max_workflows,
                            max_skills: tier.max_skills,
                            max_context_assets: tier.max_context_assets,
                            max_research_studios: tier.max_research_studios,
                            max_monthly_api_calls: tier.max_monthly_api_calls,
                            max_social_posts_monthly: tier.max_social_posts_monthly,
                            max_social_channels: tier.max_social_channels,
                            features: tier.features,
                            integration_addons: tier.integration_addons,
                            allow_self_upgrade: tier.allow_self_upgrade
                        })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || `Failed to save ${tier.id}`);
                    }
                }

                // Save module addon pricing changes
                showLoading('Saving Changes', 'Updating addon pricing...');
                const addonModuleIds = Object.keys(addonPricingChanges);
                for (const moduleId of addonModuleIds) {
                    const changes = addonPricingChanges[moduleId];
                    const addonResponse = await fetch(`/api/platform/modules/${moduleId}/addon-pricing`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(changes)
                    });

                    if (!addonResponse.ok) {
                        const addonData = await addonResponse.json();
                        throw new Error(addonData.error || `Failed to save addon pricing for ${moduleId}`);
                    }
                }

                originalTiers = JSON.parse(JSON.stringify(tiers));
                addonPricingChanges = {};
                hasChanges = false;
                showToast('All tiers and addon pricing saved successfully', 'success');

                // Reload modules to reflect changes
                await loadTierModules();
                renderTiers();
            } catch (error) {
                console.error('Error saving tiers:', error);
                showToast(error.message || 'Failed to save tiers', 'error');
            } finally {
                hideLoading();
            }
        }

        function resetChanges() {
            tiers = JSON.parse(JSON.stringify(originalTiers));
            hasChanges = false;
            renderTiers();
            renderComparison();
            showToast('Changes reset', 'info');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        function showToast(message, type = 'info') {
            if (typeof ModalService !== 'undefined' && ModalService.toast) {
                ModalService.toast({ message, type });
            } else {
                // Fallback for early calls before ModalService is ready
                const toast = document.createElement('div');
                toast.style.cssText = `position:fixed;bottom:20px;right:20px;padding:1rem 1.5rem;` +
                    `background:${type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--info)'};` +
                    `color:white;border-radius:var(--radius-md);z-index:9999;font-size:0.9rem;`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        }

        // Warn before leaving with unsaved changes
        window.addEventListener('beforeunload', (e) => {
            if (hasChanges) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
