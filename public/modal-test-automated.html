<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Service Automated Tests - Insight 360</title>

    <!-- Modal Service CSS -->
    <link rel="stylesheet" href="js/modal-service/modal-service.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 20px;
            background: var(--i360-modal-bg, #0f0f1a);
            color: var(--i360-modal-text, #ffffff);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            color: var(--i360-modal-text-secondary, #94a3b8);
            margin: 0 0 20px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        .btn-secondary {
            background: var(--i360-modal-border, #334155);
            color: var(--i360-modal-text, #ffffff);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            padding: 12px 16px;
            background: var(--i360-modal-header-bg, #1e293b);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-label {
            color: var(--i360-modal-text-secondary, #94a3b8);
        }

        .status-value {
            font-weight: 600;
        }

        .status-value.pass { color: #10b981; }
        .status-value.fail { color: #ef4444; }
        .status-value.running { color: #f59e0b; }

        .test-suites {
            display: grid;
            gap: 16px;
        }

        .test-suite {
            background: var(--i360-modal-header-bg, #1e293b);
            border: 1px solid var(--i360-modal-border, #334155);
            border-radius: 10px;
            overflow: hidden;
        }

        .suite-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .suite-header:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .suite-name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .suite-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .suite-status.pending { background: #334155; color: #94a3b8; }
        .suite-status.running { background: #f59e0b; color: #1a202c; }
        .suite-status.passed { background: #10b981; color: white; }
        .suite-status.failed { background: #ef4444; color: white; }

        .suite-tests {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 300ms ease;
        }

        .suite-tests.expanded {
            max-height: 2000px;
            padding: 8px 0;
        }

        .test-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .test-item:last-child {
            border-bottom: none;
        }

        .test-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-icon.pending { color: #64748b; }
        .test-icon.running { color: #f59e0b; }
        .test-icon.passed { color: #10b981; }
        .test-icon.failed { color: #ef4444; }

        .test-name {
            flex: 1;
        }

        .test-time {
            color: var(--i360-modal-text-secondary, #94a3b8);
            font-size: 11px;
            margin-left: 10px;
        }

        .test-error {
            font-size: 12px;
            color: #ef4444;
            padding: 6px 16px 6px 46px;
            background: rgba(239, 68, 68, 0.1);
            margin-top: -1px;
        }

        .console-output {
            margin-top: 20px;
            background: #0f172a;
            border: 1px solid var(--i360-modal-border, #334155);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .console-header {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--i360-modal-border, #334155);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-body {
            padding: 12px 16px;
        }

        .console-line {
            padding: 2px 0;
            color: #94a3b8;
        }

        .console-line.info { color: #3b82f6; }
        .console-line.success { color: #10b981; }
        .console-line.warn { color: #f59e0b; }
        .console-line.error { color: #ef4444; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            height: 4px;
            background: var(--i360-modal-border, #334155);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            transition: width 300ms ease;
        }
    </style>
</head>
<body>
    <h1>Modal Service Automated Tests</h1>
    <p class="subtitle">Automated test suite for ModalService, ModalBase, and all modal types</p>

    <div class="controls">
        <button class="btn btn-primary" id="runAllBtn" onclick="runAllTests()">Run All Tests</button>
        <button class="btn btn-secondary" onclick="runFailedTests()">Re-run Failed</button>
        <button class="btn btn-secondary" onclick="clearResults()">Clear Results</button>
        <button class="btn btn-danger" onclick="ModalService.closeAll(true)">Close All Modals</button>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressBar" style="width: 0%"></div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">Total:</span>
            <span class="status-value" id="totalCount">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">Passed:</span>
            <span class="status-value pass" id="passCount">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">Failed:</span>
            <span class="status-value fail" id="failCount">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">Duration:</span>
            <span class="status-value" id="duration">-</span>
        </div>
    </div>

    <div class="test-suites" id="testSuites"></div>

    <div class="console-output">
        <div class="console-header">
            <span>Console Output</span>
            <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="clearConsole()">Clear</button>
        </div>
        <div class="console-body" id="consoleOutput"></div>
    </div>

    <!-- Modal Service Scripts -->
    <script src="js/modal-service/utils/sanitize.js"></script>
    <script src="js/modal-service/utils/position.js"></script>
    <script src="js/modal-service/mixins/DraggableMixin.js"></script>
    <script src="js/modal-service/mixins/ResizableMixin.js"></script>
    <script src="js/modal-service/mixins/FullscreenMixin.js"></script>
    <script src="js/modal-service/mixins/PersistenceMixin.js"></script>
    <script src="js/modal-service/ModalBase.js"></script>
    <script src="js/modal-service/modals/AlertModal.js"></script>
    <script src="js/modal-service/modals/ConfirmModal.js"></script>
    <script src="js/modal-service/modals/PromptModal.js"></script>
    <script src="js/modal-service/modals/FormModal.js"></script>
    <script src="js/modal-service/modals/ContentModal.js"></script>
    <script src="js/modal-service/modals/ChatModal.js"></script>
    <script src="js/modal-service/modals/AgentModal.js"></script>
    <script src="js/modal-service/index.js"></script>

    <script>
        // ============================================
        // Test Framework
        // ============================================

        const TestRunner = {
            suites: [],
            results: [],
            currentSuite: null,
            startTime: null,
            isRunning: false,

            describe(name, fn) {
                const suite = {
                    name,
                    tests: [],
                    status: 'pending',
                    passCount: 0,
                    failCount: 0
                };
                this.suites.push(suite);
                this.currentSuite = suite;
                fn();
                this.currentSuite = null;
            },

            it(name, fn, options = {}) {
                if (!this.currentSuite) {
                    console.error('Test must be inside a describe block');
                    return;
                }
                this.currentSuite.tests.push({
                    name,
                    fn,
                    status: 'pending',
                    error: null,
                    duration: null,
                    timeout: options.timeout || 10000
                });
            },

            async runAll() {
                if (this.isRunning) return;
                this.isRunning = true;
                this.startTime = Date.now();

                document.getElementById('runAllBtn').disabled = true;
                this.updateProgress(0);

                const totalTests = this.suites.reduce((sum, s) => sum + s.tests.length, 0);
                let completedTests = 0;

                for (const suite of this.suites) {
                    suite.status = 'running';
                    suite.passCount = 0;
                    suite.failCount = 0;
                    this.renderSuites();

                    for (const test of suite.tests) {
                        test.status = 'running';
                        test.error = null;
                        this.renderSuites();

                        const testStart = Date.now();
                        try {
                            await this.runWithTimeout(test.fn(), test.timeout);
                            test.status = 'passed';
                            suite.passCount++;
                            log(`✓ ${suite.name}: ${test.name}`, 'success');
                        } catch (err) {
                            test.status = 'failed';
                            test.error = err.message || String(err);
                            suite.failCount++;
                            log(`✗ ${suite.name}: ${test.name} - ${test.error}`, 'error');
                        } finally {
                            // ALWAYS cleanup after each test - close all modals
                            ModalService.closeAll(true);
                            await sleep(100);
                            // Force remove any remaining modal elements from DOM
                            document.querySelectorAll('.i360-modal-container, .i360-modal-overlay').forEach(el => el.remove());
                            await sleep(50);
                        }
                        test.duration = Date.now() - testStart;

                        completedTests++;
                        this.updateProgress((completedTests / totalTests) * 100);
                        this.renderSuites();

                        // Small delay between tests
                        await sleep(50);
                    }

                    suite.status = suite.failCount > 0 ? 'failed' : 'passed';
                    this.renderSuites();
                }

                this.isRunning = false;
                document.getElementById('runAllBtn').disabled = false;
                document.getElementById('duration').textContent = `${((Date.now() - this.startTime) / 1000).toFixed(2)}s`;
            },

            async runFailed() {
                if (this.isRunning) return;

                for (const suite of this.suites) {
                    const failedTests = suite.tests.filter(t => t.status === 'failed');
                    if (failedTests.length === 0) continue;

                    suite.status = 'running';
                    this.renderSuites();

                    for (const test of failedTests) {
                        test.status = 'running';
                        test.error = null;
                        this.renderSuites();

                        const testStart = Date.now();
                        try {
                            await this.runWithTimeout(test.fn(), test.timeout);
                            test.status = 'passed';
                            suite.passCount++;
                            suite.failCount--;
                            log(`✓ ${suite.name}: ${test.name} (retry)`, 'success');
                        } catch (err) {
                            test.status = 'failed';
                            test.error = err.message || String(err);
                            log(`✗ ${suite.name}: ${test.name} - ${test.error}`, 'error');
                        } finally {
                            // ALWAYS cleanup after each test
                            ModalService.closeAll(true);
                            await sleep(100);
                            // Force remove any remaining modal elements from DOM
                            document.querySelectorAll('.i360-modal-container, .i360-modal-overlay').forEach(el => el.remove());
                            await sleep(50);
                        }
                        test.duration = Date.now() - testStart;
                        this.renderSuites();

                        await sleep(50);
                    }

                    suite.status = suite.failCount > 0 ? 'failed' : 'passed';
                    this.renderSuites();
                }
            },

            runWithTimeout(promise, timeout) {
                return new Promise((resolve, reject) => {
                    const timer = setTimeout(() => {
                        reject(new Error(`Test timed out after ${timeout}ms`));
                    }, timeout);

                    Promise.resolve(promise)
                        .then(result => {
                            clearTimeout(timer);
                            resolve(result);
                        })
                        .catch(err => {
                            clearTimeout(timer);
                            reject(err);
                        });
                });
            },

            clear() {
                for (const suite of this.suites) {
                    suite.status = 'pending';
                    suite.passCount = 0;
                    suite.failCount = 0;
                    for (const test of suite.tests) {
                        test.status = 'pending';
                        test.error = null;
                        test.duration = null;
                    }
                }
                this.renderSuites();
                this.updateProgress(0);
                document.getElementById('duration').textContent = '-';
            },

            updateProgress(percent) {
                document.getElementById('progressBar').style.width = `${percent}%`;

                const total = this.suites.reduce((sum, s) => sum + s.tests.length, 0);
                const passed = this.suites.reduce((sum, s) => sum + s.passCount, 0);
                const failed = this.suites.reduce((sum, s) => sum + s.failCount, 0);

                document.getElementById('totalCount').textContent = total;
                document.getElementById('passCount').textContent = passed;
                document.getElementById('failCount').textContent = failed;
            },

            renderSuites() {
                const container = document.getElementById('testSuites');
                container.innerHTML = this.suites.map((suite, idx) => `
                    <div class="test-suite">
                        <div class="suite-header" onclick="toggleSuite(${idx})">
                            <span class="suite-name">
                                ${this.getStatusIcon(suite.status)}
                                ${suite.name}
                            </span>
                            <span class="suite-status ${suite.status}">
                                ${suite.status === 'pending' ? 'Pending' :
                                  suite.status === 'running' ? 'Running...' :
                                  `${suite.passCount}/${suite.tests.length} passed`}
                            </span>
                        </div>
                        <div class="suite-tests ${suite.status !== 'pending' ? 'expanded' : ''}" id="suite-${idx}">
                            ${suite.tests.map(test => `
                                <div class="test-item">
                                    <span class="test-icon ${test.status}">
                                        ${this.getStatusIcon(test.status)}
                                    </span>
                                    <span class="test-name">${test.name}</span>
                                    ${test.duration !== null ? `<span class="test-time">${test.duration}ms</span>` : ''}
                                </div>
                                ${test.error ? `<div class="test-error">${test.error}</div>` : ''}
                            `).join('')}
                        </div>
                    </div>
                `).join('');

                this.updateProgress(
                    this.suites.reduce((sum, s) => sum + s.passCount + s.failCount, 0) /
                    Math.max(1, this.suites.reduce((sum, s) => sum + s.tests.length, 0)) * 100
                );
            },

            getStatusIcon(status) {
                switch (status) {
                    case 'pending': return '<span style="opacity:0.5">○</span>';
                    case 'running': return '<div class="spinner"></div>';
                    case 'passed': return '✓';
                    case 'failed': return '✗';
                    default: return '○';
                }
            }
        };

        // ============================================
        // Test Utilities
        // ============================================

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function assert(condition, message = 'Assertion failed') {
            if (!condition) {
                throw new Error(message);
            }
        }

        function assertEqual(actual, expected, message = '') {
            if (actual !== expected) {
                throw new Error(`${message} Expected: ${JSON.stringify(expected)}, Got: ${JSON.stringify(actual)}`);
            }
        }

        function assertExists(value, message = 'Value should exist') {
            if (value === null || value === undefined) {
                throw new Error(message);
            }
        }

        function assertType(value, type, message = '') {
            const actualType = typeof value;
            if (actualType !== type) {
                throw new Error(`${message} Expected type: ${type}, Got: ${actualType}`);
            }
        }

        function assertInstanceOf(value, constructor, message = '') {
            if (!(value instanceof constructor)) {
                throw new Error(`${message} Expected instance of ${constructor.name}`);
            }
        }

        async function waitForElement(selector, timeout = 2000) {
            const start = Date.now();
            while (Date.now() - start < timeout) {
                const el = document.querySelector(selector);
                if (el) return el;
                await sleep(50);
            }
            throw new Error(`Element not found: ${selector}`);
        }

        async function waitForNoElement(selector, timeout = 2000) {
            const start = Date.now();
            while (Date.now() - start < timeout) {
                const el = document.querySelector(selector);
                if (!el) return;
                await sleep(50);
            }
            throw new Error(`Element still exists: ${selector}`);
        }

        function log(message, type = 'info') {
            const output = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '';
        }

        function toggleSuite(idx) {
            const el = document.getElementById(`suite-${idx}`);
            el.classList.toggle('expanded');
        }

        function runAllTests() {
            log('Starting automated test suite...', 'info');
            TestRunner.runAll();
        }

        function runFailedTests() {
            log('Re-running failed tests...', 'info');
            TestRunner.runFailed();
        }

        function clearResults() {
            TestRunner.clear();
            clearConsole();
            log('Results cleared', 'info');
        }

        // ============================================
        // Test Suites
        // ============================================

        // Suite 1: ModalService Core
        TestRunner.describe('ModalService Core', () => {
            TestRunner.it('should be defined globally', async () => {
                assertExists(window.ModalService, 'ModalService should be defined');
                assertType(ModalService.alert, 'function', 'alert should be a function');
                assertType(ModalService.confirm, 'function', 'confirm should be a function');
                assertType(ModalService.prompt, 'function', 'prompt should be a function');
            });

            TestRunner.it('should register and unregister modals', async () => {
                const modal = new ModalBase({ title: 'Test Modal' });
                ModalService.register(modal);
                assertExists(modal.id, 'Modal should have an ID');
                const registered = ModalService.get(modal.id);
                assertEqual(registered, modal, 'Should retrieve registered modal');
                ModalService.unregister(modal.id);
            });

            TestRunner.it('should bring modal to front', async () => {
                const modal1 = ModalService.create({ title: 'Modal 1' });
                const modal2 = ModalService.create({ title: 'Modal 2' });
                modal1.open();
                modal2.open();
                await sleep(100);

                const initialZ = modal1._zIndex;
                ModalService.bringToFront(modal1);
                assert(modal1._zIndex > initialZ, 'Z-index should increase');

                ModalService.closeAll(true);
                await sleep(100);
            });

            TestRunner.it('should close all modals', async () => {
                ModalService.create({ title: 'Test 1' }).open();
                ModalService.create({ title: 'Test 2' }).open();
                await sleep(100);

                const openBefore = ModalService.getOpenModals().length;
                assert(openBefore >= 2, 'Should have open modals');

                ModalService.closeAll(true);
                await sleep(200);

                const openAfter = ModalService.getOpenModals().length;
                assertEqual(openAfter, 0, 'All modals should be closed');
            });

            TestRunner.it('should get open modals list', async () => {
                const modal = ModalService.create({ title: 'Test' });
                await modal.open();
                await sleep(150);

                const openModals = ModalService.getOpenModals();
                assert(openModals.length > 0, 'Should have open modals');
                assert(openModals.includes(modal), 'Should include our modal');
            });

            TestRunner.it('should configure service options', async () => {
                ModalService.configure({ zIndexBase: 2000 });
                // Test passes if no error thrown
                ModalService.configure({ zIndexBase: 1000 }); // Reset
            });
        });

        // Suite 2: ModalBase
        TestRunner.describe('ModalBase', () => {
            TestRunner.it('should create modal with default options', async () => {
                const modal = new ModalBase();
                modal.init();
                assertExists(modal.elements.container, 'Should have container');
                assertExists(modal.elements.header, 'Should have header');
                assertExists(modal.elements.body, 'Should have body');
                modal.destroy();
            });

            TestRunner.it('should create modal with custom options', async () => {
                const modal = new ModalBase({
                    title: 'Custom Title',
                    content: '<p>Custom content</p>',
                    width: 500
                });
                modal.init();

                assertEqual(modal.elements.title.textContent, 'Custom Title');
                assertEqual(modal.elements.container.style.width, '500px');
                assert(modal.elements.body.innerHTML.includes('Custom content'));

                modal.destroy();
            });

            TestRunner.it('should open and close modal', async () => {
                const modal = new ModalBase({ title: 'Open/Close Test' });
                ModalService.register(modal);
                modal.init();

                assertEqual(modal.state.isOpen, false, 'Should be closed initially');

                await modal.open();
                await sleep(150);
                assertEqual(modal.state.isOpen, true, 'Should be open');
                assertExists(document.querySelector('.i360-modal-container'), 'Should be in DOM');

                await modal.close();
                await sleep(200);
                assertEqual(modal.state.isOpen, false, 'Should be closed');
            });

            TestRunner.it('should emit events', async () => {
                const modal = new ModalBase({ title: 'Event Test' });
                ModalService.register(modal);
                modal.init();

                let openCalled = false;
                let closeCalled = false;

                modal.on('open', () => { openCalled = true; });
                modal.on('close', () => { closeCalled = true; });

                await modal.open();
                await sleep(150);
                assert(openCalled, 'Open event should fire');

                modal.close();
                await sleep(200);
                assert(closeCalled, 'Close event should fire');
            });

            TestRunner.it('should support setTitle and setContent', async () => {
                const modal = new ModalBase({ title: 'Initial' });
                ModalService.register(modal);
                modal.init();
                modal.open();
                await sleep(100);

                modal.setTitle('Updated Title');
                assertEqual(modal.elements.title.textContent, 'Updated Title');

                modal.setContent('<p>New Content</p>');
                assert(modal.elements.body.innerHTML.includes('New Content'));

                modal.close();
                await sleep(100);
            });

            TestRunner.it('should close on escape key when enabled', async () => {
                const modal = new ModalBase({ title: 'Escape Test', closeOnEscape: true });
                ModalService.register(modal);
                modal.init();
                modal.open();
                await sleep(100);

                document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
                await sleep(200);

                assertEqual(modal.state.isOpen, false, 'Should close on escape');
            });

            TestRunner.it('should have proper ARIA attributes', async () => {
                const modal = new ModalBase({ title: 'ARIA Test' });
                modal.init();

                assertEqual(modal.elements.container.getAttribute('role'), 'dialog');
                assertEqual(modal.elements.container.getAttribute('aria-modal'), 'true');

            TestRunner.it('PositionUtils should calculate positions', async () => {
                if (typeof PositionUtils !== 'undefined') {
                    const center = PositionUtils.center(400, 300);
                    assertExists(center.x, 'Should have x coordinate');
                    assertExists(center.y, 'Should have y coordinate');
                }
            });
        });

        // Suite 16: Edge Cases
        TestRunner.describe('Edge Cases', () => {
            TestRunner.it('should handle rapid open/close', async () => {
                // Test that rapid operations don't crash - use separate modals
                for (let i = 0; i < 3; i++) {
                    const modal = ModalService.create({ title: `Rapid Test ${i}` });
                    await modal.open();
                    await sleep(100);
                    await modal.close();
                    await sleep(100);
                }

                // Should not throw errors
                assert(true, 'No errors thrown during rapid open/close');
            });

            TestRunner.it('should handle multiple modals stacking', async () => {
                const modals = [];
                for (let i = 0; i < 3; i++) {
                    const m = ModalService.create({ title: `Modal ${i + 1}` });
                    modals.push(m);
                    await m.open();
                    await sleep(150);
                }

                await sleep(100);
                const openModals = ModalService.getOpenModals();
                assertEqual(openModals.length, 3, 'Should have 3 open modals');

                // Verify z-index ordering
                for (let i = 1; i < modals.length; i++) {
                    assert(modals[i]._zIndex > modals[i-1]._zIndex, 'Z-index should increase');
                }
            });

            TestRunner.it('should handle empty content gracefully', async () => {
                const modal = ModalService.create({
                    title: 'Empty Content',
                    content: ''
                });
                modal.open();
                await sleep(100);

                assertExists(modal.elements.body, 'Body should exist');

                modal.close();
                await sleep(100);
            });

            TestRunner.it('should handle very long content', async () => {
                const longContent = 'A'.repeat(10000);
                const modal = ModalService.create({
                    title: 'Long Content',
                    content: longContent
                });
                modal.open();
                await sleep(100);

                assert(modal.elements.body.textContent.length > 0, 'Should render long content');

                modal.close();
                await sleep(100);
            });

            TestRunner.it('should handle special characters in title', async () => {
                const xssTitle = '<scr' + 'ipt>alert("XSS")</scr' + 'ipt> & "quotes" \'single\'';
                let modal = null;
                try {
                    modal = ModalService.create({
                        title: xssTitle,
                        content: 'Test'
                    });
                    modal.open();
                    await sleep(100);

                    // Title uses textContent so script tags are displayed as text, not executed
                    // The innerHTML will have escaped entities like &lt;script&gt;
                    assert(!modal.elements.title.innerHTML.includes('<scr' + 'ipt>'), 'Should not have unescaped script tag');
                } finally {
                    if (modal) modal.close();
                    await sleep(100);
                }
            });
        });

        // ============================================
        // Initialize
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            TestRunner.renderSuites();
            log('Test suites loaded. Click "Run All Tests" to start.', 'info');
        });
    </script>
