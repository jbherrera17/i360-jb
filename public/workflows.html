<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflows | Insight 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/modal-service/loader.js" data-auto-load></script>
    <style>
        /* Workflows Specific Styles */
        .workflows-layout {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-header h1 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0;
        }

        .page-header p {
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
            font-size: 0.9rem;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Suite Tabs */
        .suite-tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .suite-tab {
            flex: 1;
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .suite-tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .suite-tab.active {
            background: var(--primary);
            color: white;
        }

        .suite-tab.active.align { background: #8b5cf6; }
        .suite-tab.active.strategy { background: #3b82f6; }
        .suite-tab.active.execute { background: #10b981; }

        .suite-tab .count {
            background: rgba(255,255,255,0.2);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* Category Filters */
        .category-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-chip {
            padding: 0.4rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s;
        }

        .category-chip:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .category-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .stat-card {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.workflows { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .stat-icon.templates { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .stat-icon.executions { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .stat-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Workflows Grid */
        .workflows-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        /* Workflow Card */
        .workflow-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .workflow-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
        }

        .workflow-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .workflow-card:hover::before {
            opacity: 1;
        }

        .workflow-card.align::before { background: #8b5cf6; }
        .workflow-card.strategy::before { background: #3b82f6; }
        .workflow-card.execute::before { background: #10b981; }

        .workflow-delete-btn {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.2s;
            z-index: 10;
        }

        .workflow-delete-btn i {
            width: 16px;
            height: 16px;
        }

        .workflow-card:hover .workflow-delete-btn {
            opacity: 1;
        }

        .workflow-delete-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .workflow-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .workflow-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .workflow-icon.align { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .workflow-icon.strategy { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .workflow-icon.execute { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        .workflow-info {
            flex: 1;
            min-width: 0;
        }

        .workflow-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .workflow-badges {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .workflow-suite {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .workflow-suite.align { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .workflow-suite.strategy { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .workflow-suite.execute { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        .workflow-category-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 500;
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .workflow-system {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .workflow-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .workflow-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
        }

        .tag-pill {
            padding: 0.2rem 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 50px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .workflow-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .workflow-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Create Card */
        .create-card {
            background: var(--bg-secondary);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .create-card:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .create-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .create-card h3 {
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 0.25rem 0;
        }

        .create-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Section Header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .section-header h2 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        /* Buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark, #4f46e5);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            margin-bottom: 1.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Search */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            flex: 1;
            max-width: 400px;
        }

        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* Workflow Detail Modal Styles */
        .workflow-detail-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .workflow-detail-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .workflow-detail-title h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .workflow-detail-title p {
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
        }

        .detail-section {
            margin-bottom: 1.5rem;
        }

        .detail-section h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0 0 0.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .step-item {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .step-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .suite-tabs {
                flex-direction: column;
            }
            .stats-row {
                flex-direction: column;
            }
            .workflows-grid {
                grid-template-columns: 1fr;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .header-actions {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="header-content">
                    <h1>Workflows</h1>
                    <p class="header-subtitle">Automated multi-step processes for consistent execution</p>
                </div>
                <div class="header-actions">
                    <button class="btn-secondary" onclick="showTemplates()">
                        <i data-lucide="layout-template" style="width:16px;height:16px;"></i> Templates
                    </button>
                    <button class="btn-primary" onclick="goToBuilder()">
                        <i data-lucide="plus" style="width:16px;height:16px;"></i> Create Workflow
                    </button>
                    <button class="help-btn" onclick="HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                </div>
            </header>

            <div class="workflows-layout">

                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-icon workflows">
                            <i data-lucide="git-branch"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalWorkflows">0</h3>
                            <p>Total Workflows</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon templates">
                            <i data-lucide="layout-template"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalTemplates">0</h3>
                            <p>Templates Available</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon executions">
                            <i data-lucide="play-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalExecutions">0</h3>
                            <p>Total Executions</p>
                        </div>
                    </div>
                </div>

                <!-- Department Filter -->
                <div class="filter-row" style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <label for="filterDepartment" style="font-size: 0.9rem; color: var(--text-secondary);">Department:</label>
                        <select id="filterDepartment" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem; min-width: 180px;">
                            <option value="">All Departments</option>
                        </select>
                    </div>
                </div>

                <!-- Suite Tabs -->
                <div class="suite-tabs">
                    <button class="suite-tab active" data-suite="all">
                        <i data-lucide="layers" style="width:16px;height:16px;"></i>
                        All Workflows
                        <span id="allCount" class="count">0</span>
                    </button>
                    <button class="suite-tab align" data-suite="align">
                        <i data-lucide="compass" style="width:16px;height:16px;"></i>
                        Align
                        <span id="alignCount" class="count">0</span>
                    </button>
                    <button class="suite-tab strategy" data-suite="strategy">
                        <i data-lucide="map" style="width:16px;height:16px;"></i>
                        Strategy
                        <span id="strategyCount" class="count">0</span>
                    </button>
                    <button class="suite-tab execute" data-suite="execute">
                        <i data-lucide="rocket" style="width:16px;height:16px;"></i>
                        Execute
                        <span id="executeCount" class="count">0</span>
                    </button>
                </div>

                <!-- Category Filters -->
                <div class="section-header">
                    <h2><i data-lucide="filter" style="width:18px;height:18px;"></i> Categories</h2>
                    <div class="search-bar">
                        <i data-lucide="search" style="width:16px;height:16px;color:var(--text-muted);"></i>
                        <input type="text" id="searchInput" placeholder="Search workflows..." oninput="filterWorkflows()">
                    </div>
                </div>
                <div id="categoryFilters" class="category-filters">
                    <!-- Populated by JS -->
                </div>

                <!-- Workflows Grid -->
                <div class="section-header" style="margin-top: 1rem;">
                    <h2><i data-lucide="git-branch" style="width:18px;height:18px;"></i> My Workflows</h2>
                </div>
                <div id="workflowsList" class="workflows-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // State
        let workflows = [];
        let templates = [];
        let categories = [];
        let departments = [];
        let currentSuite = 'all';
        let currentCategory = 'all';
        let currentDepartment = '';
        let userDepartmentId = null;
        let selectedWorkflow = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            await fetchUserProfile();
            await fetchDepartments();
            await loadTemplates();
            await loadWorkflows();
            setupSuiteTabs();
            setupDepartmentFilter();
            buildCategories();
        });

        // Fetch user profile to get their department
        async function fetchUserProfile() {
            try {
                const response = await authFetch('/api/auth/profile', { credentials: 'include' });
                const data = await response.json();
                if (data.success && data.user?.department_id) {
                    userDepartmentId = data.user.department_id;
                    currentDepartment = userDepartmentId; // Default to user's department
                }
            } catch (error) {
                console.error('Error fetching user profile:', error);
            }
        }

        // Fetch departments
        async function fetchDepartments() {
            try {
                const response = await authFetch('/api/departments');
                const data = await response.json();
                if (data.success) {
                    departments = data.data;
                    const select = document.getElementById('filterDepartment');
                    select.innerHTML = '<option value="">All Departments</option>';
                    departments.forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept.id;
                        option.textContent = dept.name;
                        // Pre-select user's department
                        if (dept.id === userDepartmentId) {
                            option.selected = true;
                        }
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error fetching departments:', error);
            }
        }

        // Setup department filter
        function setupDepartmentFilter() {
            document.getElementById('filterDepartment').addEventListener('change', (e) => {
                currentDepartment = e.target.value;
                loadWorkflows();
            });
        }

        // Load templates
        async function loadTemplates() {
            try {
                const res = await authFetch('/api/workflows/templates');
                const data = await res.json();
                if (data.success) {
                    templates = data.templates || [];
                    document.getElementById('totalTemplates').textContent = templates.length;
                }
            } catch (error) {
                console.error('Error loading templates:', error);
            }
        }

        // Load workflows
        async function loadWorkflows() {
            try {
                const params = new URLSearchParams();
                if (currentDepartment) {
                    params.append('department_id', currentDepartment);
                }
                const url = '/api/workflows' + (params.toString() ? '?' + params.toString() : '');
                const res = await authFetch(url);
                const data = await res.json();
                if (data.success) {
                    workflows = data.workflows || [];
                    renderWorkflows();
                    updateStats();
                    updateCounts();
                    buildCategories();
                }
            } catch (error) {
                console.error('Error loading workflows:', error);
            }
        }

        // Build categories from workflows
        function buildCategories() {
            const categorySet = new Set();
            workflows.forEach(wf => {
                if (wf.category) categorySet.add(wf.category);
            });

            categories = Array.from(categorySet).map(cat => ({
                key: cat,
                name: cat.charAt(0).toUpperCase() + cat.slice(1).replace(/_/g, ' '),
                count: workflows.filter(wf => wf.category === cat).length
            }));

            renderCategoryFilters();
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = `
                <button class="category-chip active" data-category="all" onclick="setCategory('all')">
                    <i data-lucide="layers" style="width:14px;height:14px;"></i> All
                </button>
                ${categories.map(cat => `
                    <button class="category-chip" data-category="${cat.key}" onclick="setCategory('${cat.key}')">
                        ${cat.name}
                        <span style="opacity:0.6;">${cat.count || 0}</span>
                    </button>
                `).join('')}
            `;
            lucide.createIcons();
        }

        function setCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.category === category);
            });
            renderWorkflows();
        }

        // Suite tab switching
        function setupSuiteTabs() {
            document.querySelectorAll('.suite-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentSuite = tab.dataset.suite;
                    document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderWorkflows();
                });
            });
        }

        function filterWorkflows() {
            renderWorkflows();
        }

        function renderWorkflows() {
            const container = document.getElementById('workflowsList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = workflows;

            // Filter by suite
            if (currentSuite !== 'all') {
                filtered = filtered.filter(wf => wf.suite === currentSuite);
            }

            // Filter by category
            if (currentCategory !== 'all') {
                filtered = filtered.filter(wf => wf.category === currentCategory);
            }

            // Filter by search
            if (searchTerm) {
                filtered = filtered.filter(wf =>
                    wf.name?.toLowerCase().includes(searchTerm) ||
                    wf.description?.toLowerCase().includes(searchTerm) ||
                    (wf.tags || []).some(t => t.toLowerCase().includes(searchTerm))
                );
            }

            // Create card first
            let html = `
                <div class="create-card" onclick="goToBuilder()">
                    <div class="create-icon">
                        <i data-lucide="plus" style="width:32px;height:32px;"></i>
                    </div>
                    <h3>Create New Workflow</h3>
                    <p>Build a multi-step automated process with agents and skills</p>
                </div>
            `;

            if (filtered.length === 0 && !searchTerm) {
                html += `
                    <div class="empty-state" style="grid-column: span 2;">
                        <div class="empty-icon">&#x1F504;</div>
                        <h3>No Workflows Yet</h3>
                        <p>Create your first workflow to automate multi-step processes.</p>
                        <button class="btn-primary" onclick="showTemplates()">
                            <i data-lucide="layout-template" style="width:16px;height:16px;"></i> Browse Templates
                        </button>
                    </div>
                `;
            } else if (filtered.length === 0) {
                html += `
                    <div class="empty-state" style="grid-column: span 2;">
                        <div class="empty-icon">&#x1F50D;</div>
                        <h3>No Matching Workflows</h3>
                        <p>Try adjusting your search or filters.</p>
                    </div>
                `;
            } else {
                html += filtered.map(wf => `
                    <div class="workflow-card ${wf.suite || ''}" onclick="showWorkflowDetail('${wf.id}')">
                        ${!wf.is_system ? `
                            <button class="workflow-delete-btn" onclick="event.stopPropagation(); deleteWorkflow('${wf.id}', '${(wf.name || '').replace(/'/g, "\\'")}')" title="Delete workflow">
                                <i data-lucide="trash-2"></i>
                            </button>
                        ` : ''}
                        <div class="workflow-header">
                            <div class="workflow-icon ${wf.suite || ''}" style="background:${wf.color ? `${wf.color}20` : ''};color:${wf.color || ''};">
                                <i data-lucide="${wf.icon || 'git-branch'}"></i>
                            </div>
                            <div class="workflow-info">
                                <div class="workflow-name">${wf.name}</div>
                                <div class="workflow-badges">
                                    ${wf.suite ? `<span class="workflow-suite ${wf.suite}">${wf.suite}</span>` : ''}
                                    ${wf.category ? `<span class="workflow-category-badge">${wf.category}</span>` : ''}
                                    ${wf.is_system ? '<span class="workflow-system">System</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <p class="workflow-description">${wf.description || 'No description'}</p>
                        ${(wf.tags || []).length > 0 ? `
                            <div class="workflow-tags">
                                ${wf.tags.slice(0, 3).map(t => `<span class="tag-pill">${t}</span>`).join('')}
                                ${wf.tags.length > 3 ? `<span class="tag-pill">+${wf.tags.length - 3}</span>` : ''}
                            </div>
                        ` : ''}
                        <div class="workflow-meta">
                            <span><i data-lucide="play-circle" style="width:12px;height:12px;"></i> ${wf.usage_count || 0} runs</span>
                            ${wf.estimated_minutes ? `<span><i data-lucide="clock" style="width:12px;height:12px;"></i> ~${wf.estimated_minutes} min</span>` : ''}
                            ${wf.department?.name ? `<span>${wf.department.name}</span>` : ''}
                        </div>
                    </div>
                `).join('');
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        function updateStats() {
            document.getElementById('totalWorkflows').textContent = workflows.length;

            const executions = workflows.reduce((sum, wf) => sum + (wf.usage_count || 0), 0);
            document.getElementById('totalExecutions').textContent = executions;
        }

        function updateCounts() {
            document.getElementById('allCount').textContent = workflows.length;
            document.getElementById('alignCount').textContent = workflows.filter(wf => wf.suite === 'align').length;
            document.getElementById('strategyCount').textContent = workflows.filter(wf => wf.suite === 'strategy').length;
            document.getElementById('executeCount').textContent = workflows.filter(wf => wf.suite === 'execute').length;
        }

        // Delete workflow
        async function deleteWorkflow(id, name) {
            const confirmed = await ModalService.confirmDanger(
                `Are you sure you want to delete "${name}"? This action cannot be undone.`,
                'Delete Workflow'
            );

            if (!confirmed) return;

            try {
                const response = await authFetch(`/api/workflows/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    workflows = workflows.filter(wf => wf.id !== id);
                    renderWorkflows();
                    updateStats();
                    updateCounts();
                    buildCategories();
                    ModalService.success('Workflow deleted successfully', 'Deleted');
                } else {
                    ModalService.error(data.error || 'Failed to delete workflow', 'Delete Failed');
                }
            } catch (error) {
                console.error('Error deleting workflow:', error);
                ModalService.error('Failed to delete workflow: ' + error.message, 'Delete Failed');
            }
        }

        // Workflow detail modal
        let detailModal = null;

        async function showWorkflowDetail(id) {
            selectedWorkflow = workflows.find(wf => wf.id === id);
            if (!selectedWorkflow) return;

            // Fetch full workflow with steps
            try {
                const res = await authFetch(`/api/workflows/${id}`);
                const data = await res.json();
                if (data.success) {
                    selectedWorkflow = data.workflow;
                }
            } catch (error) {
                console.error('Error loading workflow details:', error);
            }

            const content = `
                <div class="workflow-detail-header">
                    <div class="workflow-detail-icon ${selectedWorkflow.suite || ''}" style="background:${selectedWorkflow.color ? `${selectedWorkflow.color}20` : ''};color:${selectedWorkflow.color || ''};">
                        <i data-lucide="${selectedWorkflow.icon || 'git-branch'}"></i>
                    </div>
                    <div class="workflow-detail-title">
                        <h2>${selectedWorkflow.name}</h2>
                        <p>${selectedWorkflow.description || 'No description'}</p>
                        <div class="workflow-badges" style="margin-top:0.5rem;">
                            ${selectedWorkflow.suite ? `<span class="workflow-suite ${selectedWorkflow.suite}">${selectedWorkflow.suite.toUpperCase()}</span>` : ''}
                            ${selectedWorkflow.category ? `<span class="workflow-category-badge">${selectedWorkflow.category}</span>` : ''}
                            ${selectedWorkflow.is_system ? '<span class="workflow-system">SYSTEM</span>' : ''}
                        </div>
                    </div>
                </div>

                ${(selectedWorkflow.steps || []).length > 0 ? `
                    <div class="detail-section">
                        <h3><i data-lucide="list-ordered" style="width:16px;height:16px;"></i> Steps (${selectedWorkflow.steps.length})</h3>
                        <div class="steps-list">
                            ${selectedWorkflow.steps.map((step, idx) => `
                                <div class="step-item">
                                    <span class="step-number">${idx + 1}</span>
                                    <div>
                                        <strong>${step.name || `Step ${idx + 1}`}</strong>
                                        ${step.description ? `<div style="font-size:0.8rem;color:var(--text-muted);">${step.description}</div>` : ''}
                                        ${step.agent?.name ? `<span style="font-size:0.75rem;color:var(--primary);">Agent: ${step.agent.name}</span>` : ''}
                                        ${step.skill?.display_name ? `<span style="font-size:0.75rem;color:#10b981;">Skill: ${step.skill.display_name}</span>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                ${(selectedWorkflow.tags || []).length > 0 ? `
                    <div class="detail-section">
                        <h3><i data-lucide="tags" style="width:16px;height:16px;"></i> Tags</h3>
                        <div class="workflow-tags">
                            ${selectedWorkflow.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="detail-section">
                    <h3><i data-lucide="info" style="width:16px;height:16px;"></i> Details</h3>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;font-size:0.9rem;">
                        <div><strong>Usage:</strong> ${selectedWorkflow.usage_count || 0} executions</div>
                        ${selectedWorkflow.estimated_minutes ? `<div><strong>Est. Time:</strong> ~${selectedWorkflow.estimated_minutes} min</div>` : ''}
                        <div><strong>Public:</strong> ${selectedWorkflow.is_public ? 'Yes' : 'No'}</div>
                        <div><strong>System:</strong> ${selectedWorkflow.is_system ? 'Yes' : 'No'}</div>
                    </div>
                </div>
            `;

            const footer = `
                <button type="button" class="i360-btn i360-btn-secondary" id="btnEditWorkflow" ${selectedWorkflow.is_system ? 'disabled' : ''}>
                    <i data-lucide="edit" style="width:16px;height:16px;"></i> Edit
                </button>
                <button type="button" class="i360-btn i360-btn-primary" id="btnRunWorkflow">
                    <i data-lucide="play" style="width:16px;height:16px;"></i> Run Workflow
                </button>
            `;

            detailModal = ModalService.create({
                title: selectedWorkflow.name,
                content: content,
                footer: footer,
                width: 600,
                draggable: true,
                resizable: true,
                onOpen: () => {
                    lucide.createIcons();
                    document.getElementById('btnEditWorkflow')?.addEventListener('click', editWorkflow);
                    document.getElementById('btnRunWorkflow')?.addEventListener('click', runWorkflow);
                }
            });

            detailModal.open();
        }

        function editWorkflow() {
            if (!selectedWorkflow || selectedWorkflow.is_system) return;
            window.location.href = `/workflow-builder.html?edit=${selectedWorkflow.id}`;
        }

        function runWorkflow() {
            if (!selectedWorkflow) return;
            window.location.href = `/workflow-run.html?workflow=${selectedWorkflow.id}`;
        }

        // Templates modal
        let templatesModal = null;

        function showTemplates() {
            const content = templates.length > 0 ? `
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">
                    Start with a pre-built workflow template:
                </p>
                <div style="display:flex;flex-direction:column;gap:0.75rem;max-height:400px;overflow-y:auto;">
                    ${templates.map(tpl => `
                        <div class="step-item" style="cursor:pointer;" onclick="createFromTemplate('${tpl.id}')">
                            <div class="workflow-icon" style="width:40px;height:40px;background:${tpl.color ? `${tpl.color}20` : 'var(--bg-tertiary)'};color:${tpl.color || 'var(--primary)'};">
                                <i data-lucide="${tpl.icon || 'layout-template'}" style="width:20px;height:20px;"></i>
                            </div>
                            <div style="flex:1;">
                                <strong>${tpl.display_name || tpl.name}</strong>
                                <div style="font-size:0.8rem;color:var(--text-muted);">${tpl.description || ''}</div>
                                <div style="display:flex;gap:0.5rem;margin-top:0.25rem;">
                                    ${tpl.suite ? `<span class="workflow-suite ${tpl.suite}" style="font-size:0.65rem;">${tpl.suite}</span>` : ''}
                                    ${tpl.category ? `<span class="workflow-category-badge" style="font-size:0.65rem;">${tpl.category}</span>` : ''}
                                </div>
                            </div>
                            <span style="color:var(--text-muted);font-size:0.8rem;">${tpl.usage_count || 0} uses</span>
                        </div>
                    `).join('')}
                </div>
            ` : `
                <div class="empty-state">
                    <div class="empty-icon">&#x1F4DD;</div>
                    <h3>No Templates Available</h3>
                    <p>Templates will be added soon. In the meantime, create a workflow from scratch.</p>
                </div>
            `;

            const footer = `
                <button type="button" class="i360-btn i360-btn-secondary" data-action="close">Cancel</button>
                <button type="button" class="i360-btn i360-btn-primary" onclick="goToBuilder()">
                    <i data-lucide="plus" style="width:16px;height:16px;"></i> Create from Scratch
                </button>
            `;

            templatesModal = ModalService.create({
                title: 'Workflow Templates',
                content: content,
                footer: footer,
                width: 600,
                draggable: true,
                onOpen: () => {
                    lucide.createIcons();
                }
            });

            templatesModal.open();
        }

        async function createFromTemplate(templateId) {
            const template = templates.find(t => t.id === templateId);
            if (!template) return;

            const name = await ModalService.prompt({
                title: 'Create Workflow',
                message: `Create a new workflow from "${template.display_name || template.name}"`,
                placeholder: 'Enter workflow name...',
                defaultValue: template.display_name || template.name
            });

            if (!name) return;

            try {
                const res = await authFetch(`/api/workflows/from-template/${templateId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await res.json();

                if (data.success) {
                    if (templatesModal) templatesModal.close();
                    ModalService.success(`Workflow "${name}" created!`, 'Created');
                    await loadWorkflows();
                    buildCategories();
                } else {
                    ModalService.error(data.error || 'Failed to create workflow', 'Error');
                }
            } catch (error) {
                console.error('Error creating from template:', error);
                ModalService.error('Failed to create workflow', 'Error');
            }
        }

        // Navigation
        function goToBuilder() {
            window.location.href = '/workflow-builder.html';
        }
    </script>
    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
</body>
</html>
