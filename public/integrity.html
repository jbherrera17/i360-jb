<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrity Dashboard | Insight 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/integrity-styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="header-content">
                    <h1>Integrity Dashboard</h1>
                    <p class="header-subtitle">Making the Invisible Visible</p>
                </div>
                <div class="header-actions">
                    <div class="period-selector">
                        <button class="period-btn" data-days="7" onclick="setPeriod(7)">7d</button>
                        <button class="period-btn active" data-days="30" onclick="setPeriod(30)">30d</button>
                        <button class="period-btn" data-days="90" onclick="setPeriod(90)">90d</button>
                    </div>
                    <button class="btn-secondary" onclick="refreshData()">
                        <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                        Recalculate
                    </button>
                    <button class="help-btn" onclick="HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                </div>
            </header>

            <div id="dashboardContent" class="integrity-layout">
                <!-- Content loaded dynamically -->
            </div>
        </main>
    </div>

    <script>
        // Integrity Dashboard JavaScript

        let selectedPeriod = 30; // 7, 30, or 90

        function setPeriod(days) {
            selectedPeriod = days;
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.days) === days);
            });
            loadDashboard();
        }

        // Build auth headers with org context
        function getIntegrityHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const token = localStorage.getItem('insight360_token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const orgId = localStorage.getItem('currentOrgId');
            if (orgId) headers['x-org-id'] = orgId;
            return headers;
        }

        // Sample data with meaningful demo values for preview
        const sampleData = {
            integrityYield: {
                score: 78,
                interpretation: 'adequate',
                trend: { change: 3, direction: 'up' },
                period: 'Sample Preview'
            },
            components: {
                trustVelocity: { score: 85, weight: 0.30 },
                interventionEffectiveness: { score: 82, weight: 0.25 },
                alignmentAudit: { score: 68, weight: 0.25 },
                counterfactualValue: { score: 75, weight: 0.20 }
            },
            leadingIndicators: [
                { name: 'Values alignment trend', status: 'positive', note: 'Consistent with stated values' },
                { name: 'Bright line awareness', status: 'positive', note: 'Team trained on boundaries' },
                { name: 'Close call response time', status: 'neutral', note: 'Within acceptable range' },
                { name: 'Stakeholder trust signals', status: 'positive', note: 'Above baseline' }
            ],
            laggingIndicators: [],
            assets: {
                bright_lines: { populated: false, lastUpdated: null },
                values_map: { populated: false, lastUpdated: null },
                intervention_metrics: { populated: false, lastUpdated: null },
                trust_velocity_metrics: { populated: false, lastUpdated: null },
                close_call_log: { populated: false, lastUpdated: null },
                industry_baseline: { populated: false, lastUpdated: null },
                integrity_yield: { populated: false, lastUpdated: null }
            },
            actionItems: []
        };

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', async function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            await loadDashboard();
        });

        async function loadDashboard() {
            const container = document.getElementById('dashboardContent');
            const orgId = localStorage.getItem('currentOrgId');

            if (!orgId) {
                renderNoOrgState(container);
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            try {
                const headers = getIntegrityHeaders();

                // Fetch metrics, soul config, incidents, baseline, and alignment audit in parallel
                const periodStart = new Date();
                periodStart.setDate(periodStart.getDate() - selectedPeriod);
                const sinceISO = periodStart.toISOString();

                const [metricsRes, soulRes, incidentsRes, baselineRes, alignmentRes] = await Promise.all([
                    fetch(`/api/soul-config/integrity-metrics/${orgId}?days=${selectedPeriod}`, { headers }).then(r => r.json()).catch(() => ({})),
                    fetch(`/api/soul-config/resolve/${orgId}`, { headers }).then(r => r.json()).catch(() => ({})),
                    fetch(`/api/soul-config/bright-line-incidents/${orgId}?created_after=${sinceISO}`, { headers }).then(r => r.json()).catch(() => ({})),
                    fetch(`/api/context/assets?type=industry_baseline`, { headers }).then(r => r.json()).catch(() => ({})),
                    fetch(`/api/soul-config/values-alignment/history/${orgId}?limit=1`, { headers }).then(r => r.json()).catch(() => ({}))
                ]);

                const metrics = metricsRes.success ? metricsRes.data : null;
                const soulConfig = soulRes.success ? soulRes.data?.config : null;
                const incidents = incidentsRes.success ? (incidentsRes.data || []) : [];
                const baselineAssets = baselineRes.success ? (baselineRes.data || []) : [];
                const baselineAsset = baselineAssets[0] || null;
                const baselineEntries = baselineAsset?.content_json?.entries || [];
                // Latest audit record (may be null if never run)
                const latestAudit = (alignmentRes.success && alignmentRes.data?.length) ? alignmentRes.data[0] : null;

                if (metrics) {
                    const hasSoulConfig = !!(soulConfig?.values?.length);
                    const hasAlign120 = !!(latestAudit?.discovered_values?.length);
                    const data = mapMetricsToDashboard(metrics, hasSoulConfig, hasAlign120);
                    data.assets = buildAssetReadiness(soulConfig, metrics, incidents, baselineEntries);
                    data.incidents = incidents;
                    data.baselineAsset = baselineAsset;
                    data.baselineEntries = baselineEntries;
                    data.latestAudit = latestAudit;
                    data.hasSoulConfig = hasSoulConfig;
                    data.hasAlign120 = hasAlign120;
                    renderDashboard(container, data);
                } else {
                    renderEmptyState(container);
                }
            } catch (error) {
                console.log('Loading with empty state:', error.message);
                renderEmptyState(container);
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function mapMetricsToDashboard(metrics, hasSoulConfig, hasAlign120) {
            const score = metrics.metrics?.integrityYield || 0;
            const interpretation = metrics.interpretation || (score >= 80 ? 'strong' : score >= 60 ? 'adequate' : score >= 40 ? 'gaps' : 'critical');

            return {
                integrityYield: {
                    score,
                    interpretation,
                    trend: metrics.trend || { change: 0, direction: 'stable' },
                    period: `Last ${metrics.period?.days || 30} days`
                },
                components: {
                    trustVelocity: metrics.components?.trustVelocity || { score: 0, weight: 0.30 },
                    interventionEffectiveness: metrics.components?.interventionEffectiveness || { score: 0, weight: 0.25 },
                    alignmentAudit: metrics.components?.alignmentAudit || { score: 0, weight: 0.25 },
                    counterfactualValue: metrics.components?.counterfactualValue || { score: 0, weight: 0.20 }
                },
                leadingIndicators: metrics.leadingIndicators || [],
                laggingIndicators: [
                    {
                        name: 'Total evaluations',
                        status: metrics.evaluations?.total > 0 ? 'positive' : 'neutral',
                        value: String(metrics.evaluations?.total || 0),
                        note: `${metrics.evaluations?.highStakes || 0} high stakes`
                    },
                    {
                        name: 'Total incidents',
                        status: metrics.incidents?.total === 0 ? 'positive' : 'negative',
                        value: String(metrics.incidents?.total || 0),
                        note: `${metrics.incidents?.violations || 0} violations, ${metrics.incidents?.nearMisses || 0} near-misses`
                    }
                ],
                actionItems: generateActionItems(metrics, hasSoulConfig, hasAlign120),
                assets: {} // filled by caller
            };
        }

        function buildAssetReadiness(soulConfig, metrics, incidents = [], baselineEntries = []) {
            const hasBrightLines = Array.isArray(soulConfig?.bright_lines) && soulConfig.bright_lines.length > 0;
            const hasValues = Array.isArray(soulConfig?.values) && soulConfig.values.length > 0;
            const hasEvaluations = (metrics?.evaluations?.total || 0) > 0;
            const hasIncidents = incidents.length > 0;
            const hasBaseline = baselineEntries.length > 0;

            return {
                bright_lines: {
                    populated: hasBrightLines,
                    lastUpdated: null,
                    source: 'soul-config'
                },
                values_map: {
                    populated: hasValues,
                    lastUpdated: null,
                    source: 'soul-config'
                },
                intervention_metrics: {
                    populated: hasEvaluations,
                    lastUpdated: hasEvaluations ? new Date().toISOString() : null,
                    source: 'auto'
                },
                trust_velocity_metrics: {
                    populated: hasEvaluations || hasIncidents,
                    lastUpdated: (hasEvaluations || hasIncidents) ? new Date().toISOString() : null,
                    source: 'auto'
                },
                close_call_log: {
                    populated: hasIncidents,
                    lastUpdated: hasIncidents ? incidents[0].created_at : null,
                    source: 'incidents'
                },
                industry_baseline: {
                    populated: hasBaseline,
                    lastUpdated: hasBaseline ? new Date().toISOString() : null,
                    source: 'context-asset'
                },
                integrity_yield: {
                    populated: hasEvaluations || hasIncidents,
                    lastUpdated: (hasEvaluations || hasIncidents) ? new Date().toISOString() : null,
                    source: 'auto'
                }
            };
        }

        function generateActionItems(metrics, hasSoulConfig, hasAlign120) {
            const items = [];
            if (metrics.incidents?.violations > 0 && metrics.incidents?.resolved < metrics.incidents?.total) {
                items.push({
                    title: 'Resolve open incidents',
                    description: `${metrics.incidents.total - metrics.incidents.resolved} incident(s) remain unresolved. Review and resolve them to improve your integrity score.`,
                    priority: 'high'
                });
            }
            if (metrics.evaluations?.requiresReview > metrics.evaluations?.reviewsCompleted) {
                items.push({
                    title: 'Complete pending reviews',
                    description: `${metrics.evaluations.requiresReview - metrics.evaluations.reviewsCompleted} evaluation(s) are awaiting human review.`,
                    priority: 'high'
                });
            }
            if (metrics.evaluations?.total === 0) {
                items.push({
                    title: 'Start using chat with ethical context',
                    description: 'Send messages that involve decisions, ethics, or stakeholder impact to begin building your integrity metrics.',
                    priority: 'medium'
                });
            }
            if (metrics.metrics?.integrityYield < 60) {
                items.push({
                    title: 'Improve integrity posture',
                    description: 'Your integrity yield is below 60. Focus on resolving incidents and completing reviews to raise your score.',
                    priority: 'high'
                });
            }
            // Alignment audit prerequisites
            if (!hasSoulConfig) {
                items.push({
                    title: 'Define your values to enable Alignment Audit',
                    description: 'The Alignment Audit requires a Soul Configuration with stated values. Complete the Soul Wizard to unlock this component.',
                    priority: 'medium',
                    cta: 'Soul Wizard',
                    action: "window.location.href='/soul-wizard.html'"
                });
            } else if (!hasAlign120) {
                items.push({
                    title: 'Complete Align 120 to enable Alignment Audit',
                    description: 'Your values are defined. Complete the Align 120 Module 2 assessment to generate discovered values and run a live alignment audit.',
                    priority: 'medium',
                    cta: 'Open Align 120',
                    action: "window.location.href='/align120.html'"
                });
            }
            return items;
        }

        function renderNoOrgState(container) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i data-lucide="building" style="width: 48px; height: 48px;"></i></div>
                    <h2>No Organization Selected</h2>
                    <p>Select an organization to view its integrity metrics. Your organization context is needed to calculate org-scoped scores.</p>
                </div>
            `;
        }

        function renderEmptyState(container) {
            // Render sample preview with meaningful data
            const circumference = 2 * Math.PI * 70;
            const sampleOffset = circumference - (sampleData.integrityYield.score / 100) * circumference;

            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i data-lucide="shield" style="width: 48px; height: 48px;"></i></div>
                    <h2>Set Up Your Integrity Dashboard</h2>
                    <p>Start by configuring your Soul Configuration to define your organization's values and bright lines. These form the basis for measuring your integrity posture.</p>
                    <div class="empty-state-actions">
                        <button class="btn-primary" onclick="startSetup()">
                            <i data-lucide="heart" style="width: 18px; height: 18px;"></i>
                            Soul Configuration Wizard
                        </button>
                        <button class="btn-secondary" onclick="window.location.href='/soul-configuration.html'">
                            <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
                            Manage Soul Config
                        </button>
                    </div>
                </div>

                <!-- Sample Preview Banner -->
                <div style="display:flex;align-items:flex-start;gap:0.75rem;padding:1rem 1.25rem;background:color-mix(in srgb, var(--primary) 10%, transparent);border:1px solid color-mix(in srgb, var(--primary) 30%, transparent);border-radius:12px;color:var(--text-primary);font-size:0.9rem;line-height:1.5;">
                    <i data-lucide="info" style="width:18px;height:18px;flex-shrink:0;"></i>
                    <div><strong style="color:var(--primary);">Sample Preview</strong> &mdash; Below is how your Integrity Dashboard will look once configured. These are example values to demonstrate the dashboard's capabilities.</div>
                </div>

                <!-- Sample Integrity Yield Preview -->
                <div style="opacity:0.85;">
                    <div class="yield-card">
                        <div class="yield-score-container">
                            <svg class="yield-score-ring adequate" viewBox="0 0 160 160">
                                <circle class="bg-ring" cx="80" cy="80" r="70"/>
                                <circle class="score-ring" cx="80" cy="80" r="70"
                                    stroke-dasharray="${circumference}"
                                    stroke-dashoffset="${sampleOffset}"/>
                            </svg>
                            <div class="yield-score-value">
                                <div class="yield-score-number">${sampleData.integrityYield.score}</div>
                                <div class="yield-score-label">of 100</div>
                            </div>
                        </div>
                        <div class="yield-info">
                            <h2 class="yield-title">Integrity Yield</h2>
                            <p class="yield-subtitle">Sample Preview</p>
                            <div class="yield-interpretation adequate">
                                <i data-lucide="check-circle" style="width:16px;height:16px;"></i>
                                Adequate with Opportunities
                            </div>
                        </div>
                        <div class="yield-trend">
                            <div class="trend-value up">
                                <i data-lucide="trending-up" style="width:14px;height:14px;"></i>
                                +3%
                            </div>
                            <span class="trend-label">vs. previous</span>
                        </div>
                    </div>

                    <!-- Sample Component Scores -->
                    <div class="components-grid">
                        <div class="component-card">
                            <div class="component-header"><h3>Trust Velocity</h3><span class="component-weight">30%</span></div>
                            <div class="component-score">85</div>
                            <div class="component-bar"><div class="component-fill" style="width:85%;background:var(--success);"></div></div>
                        </div>
                        <div class="component-card">
                            <div class="component-header"><h3>Intervention Effectiveness</h3><span class="component-weight">25%</span></div>
                            <div class="component-score">82</div>
                            <div class="component-bar"><div class="component-fill" style="width:82%;background:var(--success);"></div></div>
                        </div>
                        <div class="component-card">
                            <div class="component-header"><h3>Alignment Audit</h3><span class="component-weight">25%</span></div>
                            <div class="component-score">68</div>
                            <div class="component-bar"><div class="component-fill" style="width:68%;background:var(--warning);"></div></div>
                        </div>
                        <div class="component-card">
                            <div class="component-header"><h3>Counterfactual Value</h3><span class="component-weight">20%</span></div>
                            <div class="component-score">75</div>
                            <div class="component-bar"><div class="component-fill" style="width:75%;background:var(--success);"></div></div>
                        </div>
                    </div>
                </div>

                <!-- Asset Status Grid -->
                <div class="assets-section">
                    <div class="assets-header">
                        <h3><i data-lucide="layers" style="width: 18px; height: 18px;"></i> Integrity Assets</h3>
                    </div>
                    <div class="assets-grid">
                        ${renderAssetStatusCards(sampleData.assets)}
                    </div>
                </div>

                <!-- Quick Start Guide -->
                <div class="actions-section">
                    <div class="actions-header">
                        <h3><i data-lucide="rocket" style="width: 18px; height: 18px;"></i> Quick Start Guide</h3>
                    </div>
                    <div class="action-item">
                        <div class="action-priority high"></div>
                        <div class="action-content">
                            <h4 class="action-title">1. Define Your Bright Lines</h4>
                            <p class="action-description">Document your non-negotiable ethical boundaries - the lines you won't cross regardless of business pressure.</p>
                        </div>
                        <button class="action-cta" onclick="window.location.href='/soul-wizard.html'">Configure</button>
                    </div>
                    <div class="action-item">
                        <div class="action-priority high"></div>
                        <div class="action-content">
                            <h4 class="action-title">2. Map Your Values</h4>
                            <p class="action-description">Document how your stated values manifest under normal conditions vs. under pressure (stress values).</p>
                        </div>
                        <button class="action-cta" onclick="window.location.href='/soul-wizard.html'">Configure</button>
                    </div>
                    <div class="action-item">
                        <div class="action-priority medium"></div>
                        <div class="action-content">
                            <h4 class="action-title">3. Start Your Close Call Log</h4>
                            <p class="action-description">Begin documenting near-misses - the crises that didn't happen because someone intervened.</p>
                        </div>
                        <button class="action-cta" onclick="openLogIncidentForm()">Log Incident</button>
                    </div>
                    <div class="action-item">
                        <div class="action-priority low"></div>
                        <div class="action-content">
                            <h4 class="action-title">4. Research Industry Baseline</h4>
                            <p class="action-description">Document industry incidents to quantify what you've avoided through your integrity practices.</p>
                        </div>
                        <button class="action-cta" onclick="openBaselineForm()">Add Entry</button>
                    </div>
                </div>

                <!-- Close Call Log (always visible) -->
                ${renderCloseCallSection([])}

                <!-- Industry Baseline (always visible) -->
                ${renderBaselineSection([], null)}
            `;
        }

        function renderDashboard(container, data) {
            const circumference = 2 * Math.PI * 70;
            const offset = circumference - (data.integrityYield.score / 100) * circumference;

            container.innerHTML = `
                <!-- Integrity Yield Card -->
                <div class="yield-card">
                    <div class="yield-score-container">
                        <svg class="yield-score-ring ${data.integrityYield.interpretation}" viewBox="0 0 160 160">
                            <circle class="bg-ring" cx="80" cy="80" r="70"/>
                            <circle class="score-ring" cx="80" cy="80" r="70"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${offset}"/>
                        </svg>
                        <div class="yield-score-value">
                            <div class="yield-score-number">${data.integrityYield.score}</div>
                            <div class="yield-score-label">of 100</div>
                        </div>
                    </div>
                    <div class="yield-info">
                        <h2 class="yield-title">Integrity Yield</h2>
                        <p class="yield-subtitle">${data.integrityYield.period}</p>
                        <div class="yield-interpretation ${data.integrityYield.interpretation}">
                            ${getInterpretationIcon(data.integrityYield.interpretation)}
                            ${getInterpretationLabel(data.integrityYield.interpretation)}
                        </div>
                    </div>
                    <div class="yield-trend">
                        <div class="trend-value ${data.integrityYield.trend.direction}">
                            ${getTrendIcon(data.integrityYield.trend.direction)}
                            ${data.integrityYield.trend.change > 0 ? '+' : ''}${data.integrityYield.trend.change}%
                        </div>
                        <div class="trend-label">vs. prior period</div>
                    </div>
                </div>

                <!-- Component Scores -->
                <div class="components-grid">
                    ${renderTrustVelocityCard(data)}
                    ${renderInterventionCard(data)}
                    ${renderAlignmentCard(data)}
                    ${renderCounterfactualCard(data)}
                </div>

                <!-- Leading & Lagging Indicators -->
                <div class="indicators-section">
                    <div class="indicators-card">
                        <div class="indicators-header">
                            <h3><i data-lucide="trending-up" style="width: 18px; height: 18px;"></i> Leading Indicators</h3>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Early warning system</span>
                        </div>
                        <div class="indicator-list">
                            ${renderIndicators(data.leadingIndicators, 'leading')}
                        </div>
                    </div>
                    <div class="indicators-card">
                        <div class="indicators-header">
                            <h3><i data-lucide="trending-down" style="width: 18px; height: 18px;"></i> Lagging Indicators</h3>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Reference context</span>
                        </div>
                        <div class="indicator-list">
                            ${renderIndicators(data.laggingIndicators, 'lagging')}
                        </div>
                    </div>
                </div>

                <!-- Asset Status -->
                <div class="assets-section">
                    <div class="assets-header">
                        <h3><i data-lucide="layers" style="width: 18px; height: 18px;"></i> Integrity Assets</h3>
                        <button class="btn-secondary" onclick="window.location.href='/soul-configuration.html'" style="padding: 0.5rem 1rem; font-size: 0.85rem;">
                            Soul Configuration
                        </button>
                    </div>
                    <div class="assets-grid">
                        ${renderAssetStatusCards(data.assets, data.hasSoulConfig, data.hasAlign120)}
                    </div>
                </div>

                <!-- Close Call Log -->
                ${renderCloseCallSection(data.incidents || [])}

                <!-- Industry Baseline -->
                ${renderBaselineSection(data.baselineEntries || [], data.baselineAsset)}

                <!-- Action Items -->
                ${data.actionItems.length > 0 ? `
                <div class="actions-section">
                    <div class="actions-header">
                        <h3><i data-lucide="check-square" style="width: 18px; height: 18px;"></i> Recommended Actions</h3>
                    </div>
                    ${data.actionItems.map(item => `
                        <div class="action-item">
                            <div class="action-priority ${item.priority}"></div>
                            <div class="action-content">
                                <h4 class="action-title">${item.title}</h4>
                                <p class="action-description">${item.description}</p>
                            </div>
                            ${item.cta ? `<button class="action-cta" onclick="${item.action}">${item.cta}</button>` : ''}
                        </div>
                    `).join('')}
                </div>
                ` : ''}
            `;
        }

        // ==========================================
        // Shared Component Card Helpers
        // ==========================================

        function toggleComponentPanel(cardId) {
            const panel = document.getElementById(`${cardId}-detail`);
            const btn = document.getElementById(`${cardId}-expand-btn`);
            if (!panel || !btn) return;
            const isOpen = !panel.classList.contains('collapsed');
            panel.classList.toggle('collapsed', isOpen);
            btn.setAttribute('aria-expanded', String(!isOpen));
        }

        function formatCurrency(amount) {
            if (!amount || amount === 0) return 'N/A';
            if (amount >= 1e9) return `$${(amount / 1e9).toFixed(1)}B`;
            if (amount >= 1e6) return `$${(amount / 1e6).toFixed(1)}M`;
            if (amount >= 1e3) return `$${(amount / 1e3).toFixed(0)}K`;
            return `$${amount.toFixed(0)}`;
        }

        function detailRow(label, value, statusClass) {
            return `<div class="component-detail-row">
                <span class="component-detail-label">${label}</span>
                <span class="component-detail-value ${statusClass || ''}">${value}</span>
            </div>`;
        }

        function expandBtnHtml(cardId) {
            return `<button class="component-expand-btn"
                    id="${cardId}-expand-btn"
                    aria-expanded="false"
                    aria-controls="${cardId}-detail"
                    onclick="toggleComponentPanel('${cardId}')"
                    title="View details">
                <i data-lucide="chevron-down" style="width:15px;height:15px;"></i>
            </button>`;
        }

        // ==========================================
        // Trust Velocity Card
        // ==========================================

        function renderTrustVelocityCard(data) {

        function renderAlignmentPanel(audit) {
            const lastAuditText = audit?.audit_date
                ? `Last audited: ${formatDate(audit.audit_date)}`
                : 'No audit run yet';

            const scores = audit?.alignment_scores || [];
            const drift = audit?.drift_details || null;
            const recommendations = audit?.recommendations || [];

            return `
                <div class="alignment-audit-meta">
                    <span class="alignment-audit-meta-text">${lastAuditText}</span>
                    <button class="alignment-run-btn" id="alignment-run-btn" onclick="runAlignmentAudit()">
                        <i data-lucide="play" style="width:12px;height:12px;"></i>
                        Run Audit
                    </button>
                </div>
                ${renderAlignmentValueRows(scores)}
                ${renderDriftAlert(drift)}
                ${renderAlignmentRecommendation(recommendations)}`;
        }

        function renderAlignmentValueRows(scores) {
            if (!scores || scores.length === 0) {
                return `<div class="section-empty-state" style="padding:0.75rem 0.5rem;">
                    <i data-lucide="info" style="width:16px;height:16px;color:var(--text-muted);"></i>
                    <span>No audit data yet. Run an audit to see per-value scores.</span>
                </div>`;
            }

            // Sort: worst first (not_found, critical, significant, moderate, aligned), then unstated at end
            const gapOrder = { not_found: 0, critical: 1, significant: 2, moderate: 3, aligned: 4, unstated: 99 };
            const stated = scores
                .filter(s => s.gap !== 'unstated')
                .sort((a, b) => (gapOrder[a.gap] ?? 5) - (gapOrder[b.gap] ?? 5));
            const unstated = scores.filter(s => s.gap === 'unstated');

            const SHOW_LIMIT = 5;
            const showAll = stated.length <= SHOW_LIMIT;
            const visibleStated = showAll ? stated : stated.slice(0, SHOW_LIMIT);

            const statedRows = visibleStated.map(s => renderValueRow(s)).join('');
            const hiddenCount = stated.length - SHOW_LIMIT;
            const showAllBtn = !showAll
                ? `<button class="alignment-show-all-btn"
                          onclick="expandAlignmentValues()"
                          id="alignment-show-all-btn">
                       Show all ${stated.length} values
                   </button>`
                : '';

            // Hidden rows (initially display:none)
            const hiddenRows = !showAll
                ? `<div id="alignment-hidden-values" style="display:none;">
                       ${stated.slice(SHOW_LIMIT).map(s => renderValueRow(s)).join('')}
                   </div>`
                : '';

            const unstatedSection = unstated.length > 0
                ? `<div class="alignment-unstated-sep">Observed but not stated (${unstated.length})</div>
                   ${unstated.map(s => renderValueRow(s)).join('')}`
                : '';

            return `<div class="alignment-values-list">
                ${statedRows}
                ${hiddenRows}
                ${showAllBtn}
                ${unstatedSection}
            </div>`;
        }

        function renderValueRow(s) {
            const gapLabel = { aligned: 'Aligned', moderate: 'Moderate', significant: 'Gap', critical: 'Critical', not_found: 'Missing', unstated: 'Unstated' };
            const dotClass = { aligned: 'green', moderate: 'yellow', significant: 'yellow', critical: 'red', not_found: 'red', unstated: 'green' };
            const badgeClass = { aligned: 'aligned', moderate: 'moderate', significant: 'significant', critical: 'critical', not_found: 'not-found', unstated: 'unstated' };
            const scoreText = s.alignmentScore !== null ? `${s.alignmentScore}/100` : '—';

            return `<div class="alignment-value-row">
                <div class="indicator-status ${dotClass[s.gap] || 'yellow'}"></div>
                <span class="alignment-value-name" title="${escapeHtml(s.valueName)}">${escapeHtml(s.valueName)}</span>
                <span class="gap-badge ${badgeClass[s.gap] || ''}">${gapLabel[s.gap] || s.gap}</span>
                <span class="alignment-value-score">${scoreText}</span>
            </div>`;
        }

        function renderDriftAlert(drift) {
            if (!drift?.driftDetected) return '';
            const summary = drift.summary || `${drift.driftedValues?.length || 'Some'} values shifted since last audit`;
            return `<div class="alignment-drift-alert">
                <i data-lucide="alert-triangle" style="width:15px;height:15px;flex-shrink:0;color:#f59e0b;"></i>
                <span>Values drift detected — ${escapeHtml(summary)}</span>
            </div>`;
        }

        function renderAlignmentRecommendation(recommendations) {
            if (!recommendations || recommendations.length === 0) return '';
            const first = typeof recommendations[0] === 'string'
                ? recommendations[0]
                : recommendations[0].text || recommendations[0].recommendation || String(recommendations[0]);
            const viewAllLink = recommendations.length > 1
                ? ` <button class="alignment-show-all-btn" style="display:inline;padding:0;" onclick="showAllAlignmentRecommendations()">View all ${recommendations.length}</button>`
                : '';
            return `<div class="alignment-recommendation">
                <i data-lucide="lightbulb" style="width:14px;height:14px;flex-shrink:0;color:var(--primary);margin-top:0.05rem;"></i>
                <span>${escapeHtml(first)}${viewAllLink}</span>
            </div>`;
        }

        function toggleAlignmentPanel() {
            const panel = document.getElementById('alignment-detail-panel');
            const btn = document.getElementById('alignment-expand-btn');
            if (!panel || !btn) return;
            const isOpen = !panel.classList.contains('collapsed');
            panel.classList.toggle('collapsed', isOpen);
            btn.setAttribute('aria-expanded', String(!isOpen));
        }

        function expandAlignmentValues() {
            const hidden = document.getElementById('alignment-hidden-values');
            const btn = document.getElementById('alignment-show-all-btn');
            if (hidden) hidden.style.display = '';
            if (btn) btn.remove();
        }

        async function runAlignmentAudit() {
            const orgId = localStorage.getItem('currentOrgId');
            if (!orgId) return;

            const btn = document.getElementById('alignment-run-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" style="width:12px;height:12px;animation:spin 1s linear infinite;"></i> Running...';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }

            try {
                const headers = getIntegrityHeaders();
                const res = await fetch('/api/soul-config/values-alignment/audit', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ orgId })
                });
                const result = await res.json();

                if (result.success && result.data?.status === 'complete') {
                    if (typeof showToast === 'function') showToast('Alignment audit complete', 'success');
                    // Re-render just the panel with fresh data
                    const panel = document.getElementById('alignment-detail-panel');
                    if (panel) {
                        panel.innerHTML = renderAlignmentPanel(result.data);
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    }
                } else if (result.data?.status === 'incomplete') {
                    if (typeof showToast === 'function') showToast(result.data.message || 'Audit prerequisites not met', 'error');
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i data-lucide="play" style="width:12px;height:12px;"></i> Run Audit';
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    }
                } else {
                    throw new Error(result.error || 'Audit failed');
                }
            } catch (err) {
                console.error('Alignment audit error:', err);
                if (typeof showToast === 'function') showToast('Audit failed. Try again.', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="play" style="width:12px;height:12px;"></i> Run Audit';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        }

        async function showAllAlignmentRecommendations() {
            if (typeof ModalService === 'undefined') return;
            const orgId = localStorage.getItem('currentOrgId');
            if (!orgId) return;
            try {
                const headers = getIntegrityHeaders();
                const res = await fetch(`/api/soul-config/values-alignment/history/${orgId}?limit=1`, { headers });
                const result = await res.json();
                const recs = result.data?.[0]?.recommendations || [];
                const body = recs.map((r, i) => {
                    const text = typeof r === 'string' ? r : r.text || r.recommendation || String(r);
                    return `${i + 1}. ${text}`;
                }).join('\n\n');
                await ModalService.alert({
                    title: 'Alignment Audit Recommendations',
                    message: body || 'No recommendations available.'
                });
            } catch (err) {
                console.error('Failed to load recommendations:', err);
            }
        }

        function renderAssetStatusCards(assets, hasSoulConfig, hasAlign120) {
            const assetTypes = {
                bright_lines: { icon: 'ban', name: 'Bright Lines', layer: 'Foundation', href: '/soul-configuration.html', setupHref: '/soul-wizard.html' },
                values_map: { icon: 'map', name: 'Values Map', layer: 'Foundation', href: '/soul-configuration.html', setupHref: '/soul-wizard.html' },
                intervention_metrics: { icon: 'zap', name: 'Intervention Metrics', layer: 'Measurement', href: null, setupHref: null },
                trust_velocity_metrics: { icon: 'trending-up', name: 'Trust Velocity', layer: 'Measurement', href: null, setupHref: null },
                close_call_log: { icon: 'shield', name: 'Close Call Log', layer: 'Measurement', href: null, setupHref: null, sectionClass: 'close-call-section', formFn: 'openLogIncidentForm' },
                industry_baseline: { icon: 'bar-chart-2', name: 'Industry Baseline', layer: 'Comparison', href: null, setupHref: null, sectionClass: 'baseline-section', formFn: 'openBaselineForm' },
                integrity_yield: { icon: 'target', name: 'Integrity Yield', layer: 'Composite', href: null, setupHref: null }
            };

            return Object.entries(assets).map(([key, value]) => {
                const type = assetTypes[key];
                const isAuto = value.source === 'auto';
                const destination = value.populated ? type.href : (type.setupHref || type.href);
                const hasInlineSection = !!type.sectionClass;
                const isClickable = !!destination || hasInlineSection;

                // Status label and badge class
                let badgeLabel, badgeClass;
                if (value.populated) {
                    badgeLabel = isAuto ? 'Live' : 'Configured';
                    badgeClass = 'configured';
                } else if (isAuto) {
                    badgeLabel = 'Awaiting Data';
                    badgeClass = 'setup';
                } else {
                    badgeLabel = 'Set Up';
                    badgeClass = 'setup';
                }

                // Meta text
                let metaText;
                if (value.populated && isAuto) {
                    metaText = 'Auto-computed from chat';
                } else if (value.populated && value.source === 'soul-config') {
                    // If values are configured but Align 120 is missing, annotate to guide the user
                    if (key === 'values_map' && hasSoulConfig && !hasAlign120) {
                        metaText = 'Align 120 needed for audit';
                    } else {
                        metaText = 'From Soul Configuration';
                    }
                } else if (value.populated && value.source === 'incidents') {
                    metaText = 'From incident tracking';
                } else if (value.populated) {
                    metaText = `Updated ${formatDate(value.lastUpdated)}`;
                } else {
                    metaText = isAuto ? 'Populates from chat activity' : `${type.layer} Layer`;
                }

                const clickHandler = destination
                    ? `window.location.href='${destination}'`
                    : hasInlineSection
                        ? `handleAssetCardClick('${type.sectionClass}', '${type.formFn || ''}')`
                        : '';

                return `
                    <div class="asset-status-card ${value.populated ? 'populated' : 'empty'}"
                         ${isClickable ? `onclick="${clickHandler}" style="cursor:pointer;"` : ''}>
                        <div class="asset-status-icon"><i data-lucide="${type.icon}" style="width: 24px; height: 24px;"></i></div>
                        <div class="asset-status-info">
                            <h4>${type.name}</h4>
                            <div class="asset-status-meta">${metaText}</div>
                        </div>
                        <span class="asset-status-badge ${badgeClass}">
                            ${badgeLabel}
                        </span>
                    </div>
                `;
            }).join('');
        }

            const icons = {
                improving: '↑',
                stable: '→',
                declining: '↓'
            };
            return icons[direction] || '→';
        }

        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            return date.toLocaleDateString();
        }

                window[formFn]();
            }

                                </div>
                                <i data-lucide="chevron-down" class="incident-chevron" style="width:16px;height:16px;flex-shrink:0;"></i>
                            </div>
                            <div class="incident-detail collapsed" id="inc-${inc.id}">
                                ${inc.resolution_notes ? `<div class="incident-resolution"><strong>Resolution:</strong> ${escapeHtml(inc.resolution_notes)}</div>` : ''}
                                ${isOpen ? `<button class="btn-secondary" onclick="resolveIncident('${inc.id}')" style="margin-top:0.5rem;padding:0.4rem 0.8rem;font-size:0.85rem;">
                                    <i data-lucide="check-circle" style="width:14px;height:14px;"></i> Resolve
                                </button>` : `<div class="incident-resolved-info">Resolved ${inc.resolved_at ? new Date(inc.resolved_at).toLocaleDateString() : ''}</div>`}
                            </div>
                        </div>
                    `;
                }).join('')
                : `<div class="section-empty-state"><i data-lucide="shield-check" style="width:24px;height:24px;color:var(--text-muted);"></i><span>No incidents logged yet. Use "Log Incident" to record near-misses, violations, or inquiries.</span></div>`;

            return `
                <div class="close-call-section">
                    <div class="section-header">
                        <h3><i data-lucide="shield-alert" style="width:18px;height:18px;"></i> Close Call Log</h3>
                        <button class="btn-primary" onclick="openLogIncidentForm()" style="padding:0.5rem 1rem;font-size:0.85rem;">
                            <i data-lucide="plus" style="width:14px;height:14px;"></i> Log Incident
                        </button>
                    </div>
                    <div class="incident-list">
                        ${incidentCards}
                    </div>
                </div>
            `;
        }

        function formatIncidentType(type) {
            const labels = { near_miss: 'Near Miss', violation: 'Violation', inquiry: 'Inquiry' };
            return labels[type] || type;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toggleIncidentDetail(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('collapsed');
                // Rotate chevron
                const header = el.previousElementSibling;
                const chevron = header?.querySelector('.incident-chevron');
                if (chevron) chevron.classList.toggle('rotated');
            }
        }

        async function openLogIncidentForm() {
            if (typeof ModalService === 'undefined') {
                showToast('Modal service not available', 'error');
                return;
            }
            const orgId = localStorage.getItem('currentOrgId');
            if (!orgId) return;

            const result = await ModalService.form({
                title: 'Log Bright Line Incident',
                fields: [
                    { name: 'brightLineName', label: 'Bright Line Name', type: 'text', required: true, placeholder: 'e.g. Never misrepresent data' },
                    { name: 'incidentType', label: 'Incident Type', type: 'select', required: true, options: [
                        { value: 'near_miss', label: 'Near Miss' },
                        { value: 'violation', label: 'Violation' },
                        { value: 'inquiry', label: 'Inquiry' }
                    ]},
                    { name: 'severity', label: 'Severity', type: 'select', required: true, options: [
                        { value: 'low', label: 'Low' },
                        { value: 'medium', label: 'Medium' },
                        { value: 'high', label: 'High' },
                        { value: 'critical', label: 'Critical' }
                    ]},
                    { name: 'description', label: 'Description', type: 'textarea', required: true, placeholder: 'Describe what happened...' }
                ],
                submitText: 'Log Incident'
            });

            if (!result) return;

            try {
                const headers = getIntegrityHeaders();
                const res = await fetch('/api/soul-config/bright-line-incident', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        orgId,
                        brightLineName: result.brightLineName,
                        incidentType: result.incidentType,
                        severity: result.severity,
                        description: result.description
                    })
                });
                const data = await res.json();
                if (data.success) {
                    if (typeof showToast === 'function') showToast('Incident logged successfully', 'success');
                    await loadDashboard();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Failed to log incident', 'error');
                }
            } catch (err) {
                console.error('Error logging incident:', err);
                if (typeof showToast === 'function') showToast('Failed to log incident', 'error');
            }
        }

        async function resolveIncident(id) {
            if (typeof ModalService === 'undefined') return;

            const result = await ModalService.form({
                title: 'Resolve Incident',
                fields: [
                    { name: 'resolutionNotes', label: 'Resolution Notes', type: 'textarea', required: true, placeholder: 'How was this resolved?' }
                ],
                submitText: 'Resolve'
            });

            if (!result) return;

            try {
                const headers = getIntegrityHeaders();
                const res = await fetch(`/api/soul-config/bright-line-incident/${id}/resolve`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({ resolutionNotes: result.resolutionNotes })
                });
                const data = await res.json();
                if (data.success) {
                    if (typeof showToast === 'function') showToast('Incident resolved', 'success');
                    await loadDashboard();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Failed to resolve', 'error');
                }
            } catch (err) {
                console.error('Error resolving incident:', err);
                if (typeof showToast === 'function') showToast('Failed to resolve incident', 'error');
            }
        }

        // ==========================================
        // Industry Baseline Section
        // ==========================================

        function renderBaselineSection(entries, baselineAsset) {
            const tableRows = entries.length > 0
                ? entries.map((entry, i) => `
                    <tr>
                        <td>${escapeHtml(entry.industry || entry.company || '-')}</td>
                        <td>${escapeHtml(entry.incident || entry.description || '-')}</td>
                        <td>${escapeHtml(entry.financialImpact || entry.financial_impact || '-')}</td>
                        <td>${escapeHtml(entry.date || '-')}</td>
                        <td>${escapeHtml(entry.source || '-')}</td>
                        <td><button class="btn-icon-sm" onclick="deleteBaselineEntry(${i})" title="Remove"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button></td>
                    </tr>
                `).join('')
                : '';

            const content = entries.length > 0
                ? `<table class="baseline-table">
                    <thead><tr><th>Industry/Company</th><th>Incident</th><th>Financial Impact</th><th>Date</th><th>Source</th><th></th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>`
                : `<div class="section-empty-state"><i data-lucide="bar-chart-2" style="width:24px;height:24px;color:var(--text-muted);"></i><span>No baseline entries yet. Add industry incidents to quantify what your integrity practices help avoid.</span></div>`;

            return `
                <div class="baseline-section">
                    <div class="section-header">
                        <h3><i data-lucide="bar-chart-2" style="width:18px;height:18px;"></i> Industry Baseline</h3>
                        <button class="btn-primary" onclick="openBaselineForm()" style="padding:0.5rem 1rem;font-size:0.85rem;">
                            <i data-lucide="plus" style="width:14px;height:14px;"></i> Add Entry
                        </button>
                    </div>
                    <div class="baseline-content">
                        ${content}
                    </div>
                </div>
            `;
        }

        // Store current baseline state for form operations
        let _baselineAsset = null;
        let _baselineEntries = [];

        async function openBaselineForm() {
            if (typeof ModalService === 'undefined') return;

            const result = await ModalService.form({
                title: 'Add Industry Baseline Entry',
                fields: [
                    { name: 'industry', label: 'Industry / Company', type: 'text', required: true, placeholder: 'e.g. Financial Services, Wells Fargo' },
                    { name: 'incident', label: 'Incident Description', type: 'textarea', required: true, placeholder: 'What happened?' },
                    { name: 'financialImpact', label: 'Financial Impact', type: 'text', placeholder: 'e.g. $3.7 billion in fines' },
                    { name: 'date', label: 'Incident Date', type: 'text', placeholder: 'e.g. 2023-09 or September 2023' },
                    { name: 'source', label: 'Source / Reference', type: 'text', placeholder: 'e.g. SEC filing, news article URL' }
                ],
                submitText: 'Add Entry'
            });

            if (!result) return;

            try {
                const headers = getIntegrityHeaders();

                // Re-fetch current baseline to avoid stale data
                const currentRes = await fetch('/api/context/assets?type=industry_baseline', { headers }).then(r => r.json()).catch(() => ({}));
                const currentAsset = currentRes.success ? (currentRes.data || [])[0] : null;
                const currentEntries = currentAsset?.content_json?.entries || [];

                const newEntries = [...currentEntries, {
                    industry: result.industry,
                    incident: result.incident,
                    financialImpact: result.financialImpact,
                    date: result.date,
                    source: result.source,
                    addedAt: new Date().toISOString()
                }];

                let res;
                if (currentAsset) {
                    // Update existing asset
                    res = await fetch(`/api/context/assets/${currentAsset.id}`, {
                        method: 'PUT',
                        headers,
                        body: JSON.stringify({
                            content_json: { entries: newEntries },
                            name: 'Industry Baseline'
                        })
                    });
                } else {
                    // Create new asset
                    res = await fetch('/api/context/assets', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            asset_type: 'industry_baseline',
                            name: 'Industry Baseline',
                            description: 'Industry incidents for integrity counterfactual comparison',
                            content_json: { entries: newEntries }
                        })
                    });
                }

                const data = await res.json();
                if (data.success) {
                    if (typeof showToast === 'function') showToast('Baseline entry added', 'success');
                    await loadDashboard();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Failed to add entry', 'error');
                }
            } catch (err) {
                console.error('Error adding baseline entry:', err);
                if (typeof showToast === 'function') showToast('Failed to add baseline entry', 'error');
            }
        }

        async function deleteBaselineEntry(index) {
            if (typeof ModalService === 'undefined') return;

            const confirmed = await ModalService.confirm({
                title: 'Remove Entry',
                message: 'Remove this industry baseline entry?',
                confirmText: 'Remove',
                confirmClass: 'btn-danger'
            });

            if (!confirmed) return;

            try {
                const headers = getIntegrityHeaders();

                // Re-fetch current baseline
                const currentRes = await fetch('/api/context/assets?type=industry_baseline', { headers }).then(r => r.json()).catch(() => ({}));
                const currentAsset = currentRes.success ? (currentRes.data || [])[0] : null;
                if (!currentAsset) return;

                const currentEntries = [...(currentAsset.content_json?.entries || [])];
                currentEntries.splice(index, 1);

                const res = await fetch(`/api/context/assets/${currentAsset.id}`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({
                        content_json: { entries: currentEntries }
                    })
                });

                const data = await res.json();
                if (data.success) {
                    if (typeof showToast === 'function') showToast('Entry removed', 'success');
                    await loadDashboard();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Failed to remove entry', 'error');
                }
            } catch (err) {
                console.error('Error deleting baseline entry:', err);
                if (typeof showToast === 'function') showToast('Failed to remove entry', 'error');
            }
        }

        async function refreshData() {
            const btn = event.target.closest('button');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" style="width: 16px; height: 16px; animation: spin 1s linear infinite;"></i> Recalculating...';

            await loadDashboard();

            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i> Recalculate';

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }
    </script>
    <script src="/js/modal-service-loader.js"></script>
    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
</body>
</html>
