<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Assets | Insight 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme-toggle.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Context Admin Specific Styles */
        .context-layout {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 0;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Left Panel - Asset List */
        .asset-list-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-tertiary);
        }

        .panel-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            margin: 0 0 0.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-header h2 .count {
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-family: 'Source Sans 3', sans-serif;
        }

        .filter-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .filter-row select,
        .filter-row input {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-buttons button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .asset-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .asset-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .asset-item:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .asset-item.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
        }

        .asset-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
        }

        .asset-info {
            flex: 1;
            min-width: 0;
        }

        .asset-name {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .asset-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .asset-actions {
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .asset-item:hover .asset-actions {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Center Panel - Editor */
        .editor-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .editor-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        .editor-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            margin: 0;
        }

        .editor-actions {
            display: flex;
            gap: 0.5rem;
        }

        .editor-form {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.5rem 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Tabs */
        .editor-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* JSON Editor */
        #jsonEditor {
            flex: 1;
            width: 100%;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            background: var(--bg-code, #0d0d14);
            color: var(--text-primary);
            border: none;
            resize: none;
        }

        #jsonEditor:focus {
            outline: none;
        }

        #jsonEditor.invalid {
            border-left: 3px solid var(--danger);
        }

        /* Plain Text Editor */
        #plainTextEditor {
            flex: 1;
            width: 100%;
            padding: 1rem;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.9rem;
            line-height: 1.7;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: none;
            resize: none;
        }

        .editor-footer {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
        }

        .editor-footer .valid {
            color: var(--success);
        }

        .editor-footer .invalid {
            color: var(--danger);
        }

        /* Right Panel - Preview */
        .preview-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .preview-field {
            margin-bottom: 1rem;
        }

        .preview-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .preview-field p {
            color: var(--text-primary);
            margin: 0;
        }

        .preview-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .preview-section h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary);
            margin: 0 0 0.75rem 0;
        }

        .pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .pill {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .pill.positive {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .preview-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .preview-list li {
            padding: 0.25rem 0;
            padding-left: 1.25rem;
            position: relative;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .preview-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        .preview-list li.negative::before {
            content: '✗';
            color: var(--danger);
        }

        .preview-placeholder {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }

        .preview-error {
            color: var(--danger);
            text-align: center;
            padding: 2rem;
        }

        /* Notifications */
        .notification {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification-success {
            border-left-color: var(--success);
        }

        .notification-error {
            border-left-color: var(--danger);
        }

        .notification button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Button styles */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark, #4f46e5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-icon.btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        /* Hidden file input */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .context-layout {
                grid-template-columns: 280px 1fr;
            }
            .preview-panel {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .context-layout {
                grid-template-columns: 1fr;
            }
            .asset-list-panel {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="/assets/logo.svg" alt="Insight 360" class="logo-image" onerror="this.style.display='none'">
                    <span class="logo-text">Insight 360</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/chat.html" class="nav-item">
                    <i data-lucide="message-square"></i>
                    <span>Multi-LLM Chat</span>
                </a>
                <a href="/context.html" class="nav-item active">
                    <i data-lucide="database"></i>
                    <span>Context Assets</span>
                </a>
                <a href="/agents.html" class="nav-item">
                    <i data-lucide="bot"></i>
                    <span>Agent Library</span>
                </a>
                <a href="/briefing.html" class="nav-item">
                    <i data-lucide="newspaper"></i>
                    <span>Daily Briefing</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="padding: 0; overflow: hidden;">
            <div class="context-layout">
                <!-- Left Panel - Asset List -->
                <div class="asset-list-panel">
                    <div class="panel-header">
                        <h2>
                            <i data-lucide="database"></i>
                            Context Assets
                            <span id="assetCount" class="count">0</span>
                        </h2>
                        
                        <div class="filter-row">
                            <select id="typeFilter">
                                <option value="">All Types</option>
                            </select>
                            <input type="text" id="searchInput" placeholder="Search...">
                        </div>
                        
                        <div class="filter-row">
                            <select id="statusFilter">
                                <option value="current">Current</option>
                                <option value="archived">Archived</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                        
                        <div class="action-buttons">
                            <button id="newAssetBtn" class="btn-primary">
                                <i data-lucide="plus"></i> New
                            </button>
                            <button id="importBtn" class="btn-secondary">
                                <i data-lucide="upload"></i> Import
                            </button>
                            <input type="file" id="importInput" accept=".json" class="hidden">
                            <button id="exportBtn" class="btn-secondary">
                                <i data-lucide="download"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div id="assetList" class="asset-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Center Panel - Editor -->
                <div class="editor-panel">
                    <div class="editor-header">
                        <h2 id="editorTitle">➕ New Asset</h2>
                        <div class="editor-actions">
                            <button id="saveBtn" class="btn-primary" disabled>
                                <i data-lucide="save"></i> Save
                            </button>
                        </div>
                    </div>
                    
                    <div class="editor-form">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="assetName" placeholder="Asset name...">
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="assetType">
                                <option value="">Select type...</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>Description</label>
                            <input type="text" id="assetDescription" placeholder="Brief description...">
                        </div>
                        <div class="form-group full-width">
                            <label>Tags (comma-separated)</label>
                            <input type="text" id="assetTags" placeholder="brand, voice, core...">
                        </div>
                    </div>
                    
                    <div class="editor-tabs">
                        <button class="tab-btn active" data-tab="json">JSON Editor</button>
                        <button class="tab-btn" data-tab="plaintext">Plain Text</button>
                    </div>
                    
                    <div id="jsonTab" class="tab-content active">
                        <textarea id="jsonEditor" placeholder='{\n  "key": "value"\n}'>{
  
}</textarea>
                    </div>
                    
                    <div id="plaintextTab" class="tab-content">
                        <textarea id="plainTextEditor" placeholder="Auto-generated from JSON..." readonly></textarea>
                    </div>
                    
                    <div class="editor-footer">
                        <span id="validationStatus"><span class="valid">✓ Valid JSON</span></span>
                        <span id="tokenCount">~0 tokens</span>
                    </div>
                </div>

                <!-- Right Panel - Preview -->
                <div class="preview-panel">
                    <div class="panel-header">
                        <h2><i data-lucide="eye"></i> Preview</h2>
                    </div>
                    <div id="previewContent" class="preview-content">
                        <p class="preview-placeholder">Select or create an asset to see preview</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Load Supabase client first -->
    <script src="/js/supabase.js"></script>
    <!-- Context Admin JS -->
    <script src="/js/context.js"></script>
</body>
</html>
