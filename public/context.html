<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Assets | Insight 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <link rel="stylesheet" href="/css/usage-nudge.css">
    <script src="/js/navigation.js"></script>
    <script src="/js/modal-service/loader.js" data-auto-load></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Context Admin Specific Styles */

        .context-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Resize Handle - positioned at right edge of panels */
        .resize-handle {
            position: absolute;
            right: -3px;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            background: transparent;
            z-index: 10;
            transition: background 0.2s;
        }

        .resize-handle:hover,
        .resize-handle.active {
            background: var(--primary);
        }

        /* Preview panel resize handle - on left side */
        .preview-resize-handle {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            background: transparent;
            z-index: 10;
            transition: background 0.2s;
        }

        .preview-resize-handle:hover,
        .preview-resize-handle.active {
            background: var(--primary);
        }

        /* Left Panel - Asset List */
        .asset-list-panel {
            width: 320px;
            min-width: 220px;
            max-width: 500px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-tertiary);
            display: flex;
            flex-direction: column;
        }

        /* Row layout variant for simple headers (title + actions on same line) */
        .panel-header.panel-header-row {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .panel-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
            white-space: nowrap;
        }

        .panel-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header-actions .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .panel-header-actions .btn-icon:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .panel-header h2 .count {
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-family: 'Source Sans 3', sans-serif;
        }

        .filter-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .filter-row select {
            flex: 1;
            min-width: 0;
            padding: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            text-overflow: ellipsis;
        }

        .filter-row select:hover {
            border-color: var(--primary);
        }

        .filter-row select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-row {
            margin-bottom: 0.5rem;
        }

        .search-row input {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .search-row input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-buttons button {
            padding: 0.5rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-buttons .btn-primary,
        .action-buttons .btn-ai {
            flex: 1;
        }

        .action-buttons .btn-icon-only {
            flex: 0 0 auto;
            padding: 0.5rem 0.6rem;
        }

        .action-buttons .btn-primary:hover {
            background: var(--primary-dark, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .action-buttons .btn-ai:hover {
            background: linear-gradient(135deg, var(--accent, #6d28d9) 0%, var(--primary-dark, #4338ca) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.5);
        }

        .action-buttons .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--primary);
        }

        .asset-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .asset-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .asset-item:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .asset-item.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
        }

        .asset-item.is-template {
            border-left: 3px solid var(--warning, #f59e0b);
        }

        .asset-template-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning, #f59e0b);
            margin-left: auto;
            flex-shrink: 0;
        }

        .template-callout {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: rgba(245, 158, 11, 0.1);
            border-left: 3px solid var(--warning, #f59e0b);
            border-radius: 0 6px 6px 0;
            margin: 0.5rem 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .template-callout strong {
            color: var(--warning, #f59e0b);
        }

        .template-callout .btn-duplicate {
            margin-left: auto;
            flex-shrink: 0;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--warning, #f59e0b);
            border-radius: 6px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .template-callout .btn-duplicate:hover {
            background: rgba(245, 158, 11, 0.3);
        }

        .asset-item * {
            pointer-events: none;
        }

        .asset-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }

        .asset-info {
            flex: 1;
            min-width: 0;
        }

        .asset-name {
            font-weight: 600;
            color: var(--text-primary);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .asset-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Center Panel - Editor */
        .editor-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .editor-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .editor-header-top {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }

        .editor-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .editor-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .editor-title-icon i {
            width: 20px;
            height: 20px;
        }

        .editor-title-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .editor-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
            overflow: hidden;
        }

        .editor-meta .meta-separator {
            opacity: 0.5;
            flex-shrink: 0;
        }

        .editor-meta span {
            flex-shrink: 0;
        }

        .editor-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        .editor-empty-state .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        .editor-empty-state h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            color: var(--text-primary);
            margin: 0 0 0.5rem 0;
        }

        .editor-empty-state p {
            margin: 0 0 1.5rem 0;
            max-width: 300px;
            line-height: 1.5;
        }

        .editor-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .editor-actions .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .editor-actions .btn-icon:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--primary);
        }

        .editor-actions .btn-icon.btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .editor-actions .btn-icon.btn-primary:hover {
            background: var(--primary-dark, #4338ca);
        }

        .editor-actions .btn-icon.btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .editor-actions .btn-icon.btn-danger {
            color: var(--danger);
            border-color: var(--danger);
            background: transparent;
        }

        .editor-actions .btn-icon.btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .editor-form {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.5rem 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Tabs */
        .editor-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Editor tab content (for JSON/Plain Text tabs) */
        #editorContent .tab-content {
            display: none;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        #editorContent .tab-content.active {
            display: block;
        }

        /* Modal tab content */
        .modal-body .tab-content {
            display: none;
        }

        .modal-body .tab-content.active {
            display: block;
        }

        /* JSON Editor */
        #jsonEditor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            background: var(--bg-code, #0d0d14);
            color: var(--text-primary);
            border: none;
            resize: none;
        }

        #jsonEditor:focus {
            outline: none;
        }

        #jsonEditor.invalid {
            border-left: 3px solid var(--danger);
        }

        /* Editor Content Container */
        #editorContent {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* Plain Text Editor */
        #plainTextEditor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.9rem;
            line-height: 1.7;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: none;
            resize: none;
        }

        .editor-footer {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .editor-footer .valid {
            color: var(--success);
        }

        .editor-footer .invalid {
            color: var(--danger);
        }

        /* Right Panel - Markdown Editor */
        .markdown-panel {
            width: 480px;
            min-width: 300px;
            max-width: 900px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .resize-handle-left {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            background: transparent;
            z-index: 10;
            transition: background 0.2s;
        }

        .resize-handle-left:hover,
        .resize-handle-left.active {
            background: var(--primary);
        }

        .markdown-editor-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .markdown-editor-wrapper textarea {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            resize: none;
        }

        .markdown-editor-wrapper textarea:focus {
            outline: none;
        }

        /* JSON Section (Collapsible) */
        .json-section {
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .section-header {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .section-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .json-editor-container {
            position: relative;
            height: 300px;
        }

        .json-editor-container textarea {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 40px;
            width: 100%;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            background: var(--bg-code, #0d0d14);
            color: var(--text-primary);
            border: none;
            resize: none;
        }

        /* Preview Section at Bottom */
        .preview-section-bottom {
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            max-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .preview-content-bottom {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .preview-field {
            margin-bottom: 1rem;
        }

        .preview-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .preview-field p {
            color: var(--text-primary);
            margin: 0;
        }

        .preview-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .preview-section h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary);
            margin: 0 0 0.75rem 0;
        }

        .pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .pill {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .pill.positive {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success, #10b981);
        }

        .preview-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .preview-list li {
            padding: 0.25rem 0;
            padding-left: 1.25rem;
            position: relative;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .preview-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        .preview-list li.negative::before {
            content: '✗';
            color: var(--danger);
        }

        .preview-placeholder {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }

        .preview-error {
            color: var(--danger);
            text-align: center;
            padding: 2rem;
        }

        /* Markdown rendering in preview */
        .preview-text {
            color: var(--text-primary);
            line-height: 1.6;
        }

        .preview-text p {
            margin: 0 0 0.75rem 0;
        }

        .preview-text p:last-child {
            margin-bottom: 0;
        }

        .preview-text h3,
        .preview-text h4,
        .preview-text h5 {
            color: var(--text-primary);
            margin: 1rem 0 0.5rem 0;
            font-weight: 600;
        }

        .preview-text h3 {
            font-size: 1.1rem;
        }

        .preview-text h4 {
            font-size: 1rem;
        }

        .preview-text h5 {
            font-size: 0.9rem;
        }

        .preview-text strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .preview-text em {
            font-style: italic;
        }

        .preview-text code {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
            color: var(--primary);
        }

        .preview-text a {
            color: var(--primary);
            text-decoration: none;
        }

        .preview-text a:hover {
            text-decoration: underline;
        }

        .preview-text hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1rem 0;
        }

        .preview-list li .preview-text p {
            display: inline;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        /* Button styles */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark, #4f46e5);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-ai {
            background: linear-gradient(135deg, var(--accent, #8b5cf6) 0%, var(--primary, #6366f1) 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-ai:hover {
            background: linear-gradient(135deg, var(--accent-dark, #7c3aed) 0%, var(--primary-dark, #4f46e5) 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-ai:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .btn-secondary.btn-danger {
            background: var(--danger, #ef4444);
            color: white;
            border-color: var(--danger, #ef4444);
        }

        .btn-secondary.btn-danger:hover {
            background: var(--danger-dark, #dc2626);
            border-color: var(--danger-dark, #dc2626);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-icon.btn-danger {
            background: var(--danger, #ef4444);
            color: white;
            padding: 0.25rem 0.5rem;
        }

        .btn-icon.btn-danger:hover {
            background: var(--danger-dark, #dc2626);
            color: white;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        /* Hidden file input */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .context-layout {
                grid-template-columns: 280px 1fr;
            }
            .preview-panel {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .context-layout {
                grid-template-columns: 1fr;
            }
            .asset-list-panel {
                max-height: 40vh;
            }
        }

        /* Modal styles handled by modal-manager.js */
        /* Context-specific modal overrides */
        .modal-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        .modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: 60vh;
        }

        .modal-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .modal-body .form-group {
            margin-bottom: 1rem;
        }

        .modal-body .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .modal-body .form-group input,
        .modal-body .form-group select,
        .modal-body .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
        }

        .modal-body .form-group input:focus,
        .modal-body .form-group select:focus,
        .modal-body .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-body .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* Generate Status */
        .generate-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-top: 1rem;
        }

        .generate-spinner .loading-spinner {
            width: 32px;
            height: 32px;
        }

        .generate-status span {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Modal Tabs */
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 1rem;
            background: var(--bg-tertiary);
        }

        .modal-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .modal-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .modal-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .modal-tab i {
            width: 16px;
            height: 16px;
        }

        /* File Upload Area */
        .file-upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .file-upload-area:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .file-upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .file-upload-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }

        .file-upload-content span {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .file-upload-content small {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .file-selected {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .file-selected span {
            color: var(--text-primary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->

            <header class="page-header">

            <div class="context-layout">

                <div class="asset-list-panel">

                            <h2>
                                <i data-lucide="database"></i>
                                Assets
                                <span id="assetCount" class="count">0</span>
                            </h2>
                        </div>

                        <div class="filter-row">
                            <select id="departmentFilter">
                                <option value="">All Departments</option>
                            </select>

                            <select id="typeFilter">

                            </select>
                        </div>

                        <div class="search-row">
                            <input type="text" id="searchInput" placeholder="Search assets...">
                        </div>

                        <div class="action-buttons">

                                <i data-lucide="sparkles"></i> Generate
                            </button>
                            <button id="importBtn" class="btn-secondary btn-icon-only" title="Import assets from JSON">
                                <i data-lucide="upload"></i>
                            </button>
                            <input type="file" id="importInput" accept=".json" class="hidden">
                            <button id="exportBtn" class="btn-secondary btn-icon-only" title="Export all assets">
                                <i data-lucide="download"></i>
                            </button>

                    </div>
                    
                    <div id="assetList" class="asset-list">

                    <!-- Empty State (shown when no asset selected) -->

}</textarea>

    <!-- Context Admin JS -->

    <!-- Panel Resize Script -->
    <script>
    (function() {
        // Asset List Panel Resize (left panel)
        const assetListPanel = document.querySelector('.asset-list-panel');
        const assetListHandle = document.getElementById('assetListResizeHandle');

        if (assetListPanel && assetListHandle) {
            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            // Restore saved width
            const savedWidth = localStorage.getItem('contextAssetListPanelWidth');
            if (savedWidth) {
                const parsed = parseInt(savedWidth);
                if (parsed >= 220 && parsed <= 500) {
                    assetListPanel.style.width = parsed + 'px';
                }
            }

            assetListHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = assetListPanel.offsetWidth;
                assetListHandle.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                const delta = e.clientX - startX;
                const newWidth = Math.max(220, Math.min(500, startWidth + delta));
                assetListPanel.style.width = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    assetListHandle.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    localStorage.setItem('contextAssetListPanelWidth', assetListPanel.offsetWidth);
                }
            });
        }

        // Markdown Panel Resize (right panel)
        const markdownPanel = document.querySelector('.markdown-panel');
        const markdownHandle = document.getElementById('markdownResizeHandle');

        if (markdownPanel && markdownHandle) {
            let isResizingMarkdown = false;
            let markdownStartX = 0;
            let markdownStartWidth = 0;

            // Restore saved width
            const savedMarkdownWidth = localStorage.getItem('contextMarkdownPanelWidth');
            if (savedMarkdownWidth) {
                const parsed = parseInt(savedMarkdownWidth);
                if (parsed >= 300 && parsed <= 900) {
                    markdownPanel.style.width = parsed + 'px';
                }
            }

            markdownHandle.addEventListener('mousedown', (e) => {
                isResizingMarkdown = true;
                markdownStartX = e.clientX;
                markdownStartWidth = markdownPanel.offsetWidth;
                markdownHandle.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizingMarkdown) return;

                // Resize handle is on LEFT of markdown panel
                // Drag left = panel wider, drag right = panel narrower
                const mouseDelta = markdownStartX - e.clientX;
                const newWidth = markdownStartWidth + mouseDelta;
                const clampedWidth = Math.max(300, Math.min(900, newWidth));
                markdownPanel.style.width = clampedWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizingMarkdown) {
                    isResizingMarkdown = false;
                    markdownHandle.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    localStorage.setItem('contextMarkdownPanelWidth', markdownPanel.offsetWidth);
                }
            });
        }
    })();
    </script>
    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
