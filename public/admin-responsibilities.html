<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsibilities Management | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .responsibilities-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.95rem;
            width: 200px;
        }

        .search-box svg {
            color: var(--text-secondary);
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            font-size: 0.95rem;
        }

        .responsibilities-grid {
            display: grid;
            gap: 1rem;
        }

        .responsibility-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .responsibility-card:hover {
            border-color: var(--primary);
        }

        .responsibility-info {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            flex: 1;
        }

        .responsibility-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
        }

        .responsibility-details {
            flex: 1;
        }

        .responsibility-details h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
        }

        .responsibility-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .responsibility-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .ai-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .ai-count-badge.empty {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .level-badge {
            display: inline-flex;
            padding: 0.2rem 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .hierarchy-tree {
            margin-left: 1rem;
            padding-left: 1rem;
            border-left: 2px solid var(--border);
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .help-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .help-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="responsibilities-container">
                <div class="page-header">
                    <h1>Responsibilities</h1>
                    <div class="header-actions">
                        <button class="help-btn" onclick="HelpModal.open()" title="Help">
                            <i data-lucide="help-circle"></i>
                        </button>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="search-input" placeholder="Search responsibilities..." oninput="filterResponsibilities()">
                    </div>
                    <select id="level-filter" class="filter-select" onchange="filterResponsibilities()">
                        <option value="">All Levels</option>
                        <option value="strategic">Strategic</option>
                        <option value="tactical">Tactical</option>
                        <option value="operational">Operational</option>
                    </select>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="total-count">0</span>
                    <span class="stat-label">Total Responsibilities</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="mapped-count">0</span>
                    <span class="stat-label">With AI Mappings</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="unmapped-count">0</span>
                    <span class="stat-label">Without AI Mappings</span>
                </div>
            </div>

            <!-- Responsibilities List -->
            <div id="responsibilities-list" class="responsibilities-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </main>
    </div>

    <script src="/js/help-modal.js"></script>
    <script src="/js/help-registry.js"></script>
    <script>
        // State
        let responsibilities = [];
        let aiMappingCounts = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadResponsibilities();
        });

        async function loadResponsibilities() {
            try {
                const response = await fetch('/api/roles/responsibilities/all');
                const result = await response.json();

                if (result.success) {
                    responsibilities = result.data || [];
                    await loadAIMappingCounts();
                    updateStats();
                    renderResponsibilities();
                } else {
                    showError('Failed to load responsibilities');
                }
            } catch (error) {
                console.error('Error loading responsibilities:', error);
                showError('Error loading responsibilities');
            }
        }

        async function loadAIMappingCounts() {
            // Load AI mapping counts for each responsibility
            // This would ideally be a single batch endpoint, but for now we'll use the view
            try {
                for (const resp of responsibilities) {
                    const response = await fetch(`/api/connections/responsibilities/${resp.id}/ai`);
                    const result = await response.json();
                    if (result.success) {
                        aiMappingCounts[resp.id] = result.data?.length || 0;
                    }
                }
            } catch (error) {
                console.error('Error loading AI mapping counts:', error);
            }
        }

        function updateStats() {
            const total = responsibilities.length;
            const mapped = responsibilities.filter(r => (aiMappingCounts[r.id] || 0) > 0).length;
            const unmapped = total - mapped;

            document.getElementById('total-count').textContent = total;
            document.getElementById('mapped-count').textContent = mapped;
            document.getElementById('unmapped-count').textContent = unmapped;
        }

        function renderResponsibilities() {
            const container = document.getElementById('responsibilities-list');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const levelFilter = document.getElementById('level-filter').value;

            let filtered = responsibilities.filter(r => {
                const matchesSearch = !searchTerm ||
                    r.name.toLowerCase().includes(searchTerm) ||
                    (r.description || '').toLowerCase().includes(searchTerm);
                const matchesLevel = !levelFilter || r.level === levelFilter;
                return matchesSearch && matchesLevel;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M3 9h18M9 21V9"/>
                        </svg>
                        <p>No responsibilities found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(resp => {
                const aiCount = aiMappingCounts[resp.id] || 0;
                return `
                    <div class="responsibility-card">
                        <div class="responsibility-info">
                            <div class="responsibility-icon">
                                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 11l3 3L22 4"/>
                                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                                </svg>
                            </div>
                            <div class="responsibility-details">
                                <h3>${escapeHtml(resp.name)}</h3>
                                <div class="responsibility-meta">
                                    <span class="level-badge">${resp.level || 'N/A'}</span>
                                    ${resp.description ? `<span>${escapeHtml(resp.description.substring(0, 100))}${resp.description.length > 100 ? '...' : ''}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <span class="ai-count-badge ${aiCount === 0 ? 'empty' : ''}">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                    <path d="M2 17l10 5 10-5"/>
                                </svg>
                                ${aiCount} AI ${aiCount === 1 ? 'mapping' : 'mappings'}
                            </span>
                            <a href="/admin-responsibility-ai.html?id=${resp.id}" class="action-btn primary">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                                Configure AI
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterResponsibilities() {
            renderResponsibilities();
        }

        function showError(message) {
            document.getElementById('responsibilities-list').innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 8v4M12 16h.01"/>
                    </svg>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
