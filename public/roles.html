<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Management | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/help-modal.css">
    <script src="/js/navigation.js"></script>
    <script src="/js/modal-service/loader.js" data-auto-load></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Base styles handled by /css/styles.css */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header-subtitle { color: var(--text-secondary); margin-top: 0.25rem; }
        .header-actions { display: flex; gap: 0.75rem; }
    </style>
    <style>
        /* Role-Specific Styles */
        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .role-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .role-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .role-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 1.25rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .role-info {
            flex: 1;
        }

        .role-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .role-department {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .role-level {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .role-level.executive { background: rgba(124, 58, 237, 0.15); color: #7c3aed; }
        .role-level.director { background: rgba(99, 102, 241, 0.15); color: #6366f1; }
        .role-level.manager { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .role-level.supervisor { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .role-level.ic { background: rgba(107, 114, 128, 0.15); color: #6b7280; }

        .role-card-body {
            padding: 1.25rem;
        }

        .role-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .role-section {
            margin-bottom: 1rem;
        }

        .role-section:last-child {
            margin-bottom: 0;
        }

        .role-section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .tag-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
        }

        .tag-chip.skill { border-color: var(--primary); color: var(--primary); }
        .tag-chip.domain { border-color: var(--success); color: var(--success); }
        .tag-chip.function { border-color: var(--warning); color: var(--warning); }

        .responsibility-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .responsibility-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .responsibility-item i {
            width: 14px;
            height: 14px;
            color: var(--success);
        }

        .role-card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--bg-primary);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
        }

        .stat-card.roles { border-left: 4px solid var(--primary); }
        .stat-card.responsibilities { border-left: 4px solid var(--success); }
        .stat-card.templates { border-left: 4px solid var(--warning); }
        .stat-card.users { border-left: 4px solid var(--secondary); }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Controls */
        .controls-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box i {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            min-width: 180px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.85rem;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 0.375rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .icon-btn.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            position: absolute;
            background: var(--bg-primary);
            border-radius: 12px;
            min-width: 400px;
            min-height: 300px;
            width: 560px;
            height: auto;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
            cursor: move;
            user-select: none;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        /* Resize handles */
        .resize-handle {
            position: absolute;
            z-index: 10;
        }

        .resize-handle.top {
            top: -4px;
            left: 10px;
            right: 10px;
            height: 8px;
            cursor: ns-resize;
        }

        .resize-handle.bottom {
            bottom: -4px;
            left: 10px;
            right: 10px;
            height: 8px;
            cursor: ns-resize;
        }

        .resize-handle.left {
            left: -4px;
            top: 10px;
            bottom: 10px;
            width: 8px;
            cursor: ew-resize;
        }

        .resize-handle.right {
            right: -4px;
            top: 10px;
            bottom: 10px;
            width: 8px;
            cursor: ew-resize;
        }

        .resize-handle.top-left {
            top: -4px;
            left: -4px;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
        }

        .resize-handle.top-right {
            top: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            cursor: nesw-resize;
        }

        .resize-handle.bottom-left {
            bottom: -4px;
            left: -4px;
            width: 14px;
            height: 14px;
            cursor: nesw-resize;
        }

        .resize-handle.bottom-right {
            bottom: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Tag Selector */
        .tag-selector {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            max-height: 180px;
            overflow-y: auto;
            background: var(--bg-secondary);
        }

        .tag-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.625rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .tag-option:hover {
            background: var(--bg-hover);
        }

        .tag-option input[type="checkbox"] {
            margin: 0;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            accent-color: var(--primary);
        }

        .tag-option-label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 0.75rem 1.25rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: -1px;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 3-Column Modal Layout */
        .modal-content-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 1.5rem;
            min-height: 400px;
        }

        .modal-column {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .column-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* Inline Add Form */
        .inline-add-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .inline-add-form .form-input {
            flex: 1;
        }

        .inline-add-form .btn {
            flex-shrink: 0;
            padding: 0.5rem;
        }

        /* Selector List with Checkbox + Description on Same Line */
        .selector-list {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            overflow-y: auto;
            background: var(--bg-secondary);
            max-height: 300px;
        }

        .selector-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.625rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .selector-item:hover {
            background: var(--bg-hover);
        }

        .selector-item input[type="checkbox"] {
            margin: 0;
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            accent-color: var(--primary);
        }

        .selector-item-content {
            flex: 1;
            min-width: 0;
        }

        .selector-item-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .selector-item-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.125rem;
            line-height: 1.3;
        }

        /* Expand modal width for 3 columns */
        #role-modal-dialog.three-column {
            width: 950px;
            max-width: 95vw;
        }

        @media (max-width: 1024px) {
            .modal-content-grid {
                grid-template-columns: 1fr;
            }

            #role-modal-dialog.three-column {
                width: 560px;
            }
        }

        /* ModalService styles for this page */
        .i360-modal .modal-content-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 1.5rem;
            min-height: 400px;
        }

        .i360-modal .modal-column {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .i360-modal .column-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .i360-modal .form-group {
            margin-bottom: 1.25rem;
        }

        .i360-modal .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .i360-modal .form-input,
        .i360-modal .form-select,
        .i360-modal .form-textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .i360-modal .form-input:focus,
        .i360-modal .form-select:focus,
        .i360-modal .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .i360-modal .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .i360-modal .inline-add-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .i360-modal .inline-add-form .form-input {
            flex: 1;
        }

        .i360-modal .selector-list {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            overflow-y: auto;
            background: var(--bg-secondary);
            max-height: 300px;
        }

        .i360-modal .selector-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.625rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .i360-modal .selector-item:hover {
            background: var(--bg-hover);
        }

        .i360-modal .selector-item input[type="checkbox"] {
            margin: 0;
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            accent-color: var(--primary);
        }

        .i360-modal .selector-item-content {
            flex: 1;
            min-width: 0;
        }

        .i360-modal .selector-item-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .i360-modal .selector-item-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.125rem;
            line-height: 1.3;
        }

        .i360-modal .role-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .i360-modal .role-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 1024px) {
            .i360-modal .modal-content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar injected by navigation.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-container">
            <!-- Page Header -->
            <div class="page-header">
                <div class="header-content">
                    <h1>Title Management</h1>
                    <p class="header-subtitle">Define job titles and their responsibilities</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="openTemplatesModal()">
                        <i data-lucide="copy"></i>
                        Templates
                    </button>
                    <button class="btn btn-primary" onclick="openCreateRoleModal()">
                        <i data-lucide="plus"></i>
                        New Title
                    </button>
                    <button class="help-btn" onclick="HelpModal.open()" title="Help">
                        <i data-lucide="help-circle"></i>
                    </button>
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card roles">
                    <div class="stat-value" id="total-roles">0</div>
                    <div class="stat-label">Total Titles</div>
                </div>
                <div class="stat-card responsibilities">
                    <div class="stat-value" id="total-responsibilities">0</div>
                    <div class="stat-label">Responsibilities</div>
                </div>
                <div class="stat-card templates">
                    <div class="stat-value" id="total-templates">0</div>
                    <div class="stat-label">Templates</div>
                </div>
                <div class="stat-card users">
                    <div class="stat-value" id="users-assigned">0</div>
                    <div class="stat-label">Users Assigned</div>
                </div>
            </div>

            <!-- Controls Bar -->
            <div class="controls-bar">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="search-input" placeholder="Search titles..." oninput="filterRoles()">
                </div>
                <select class="filter-select" id="department-filter" onchange="filterRoles()">
                    <option value="">All Departments</option>
                </select>
                <select class="filter-select" id="level-filter" onchange="filterRoles()">
                    <option value="">All Levels</option>
                    <option value="executive">Executive</option>
                    <option value="director">Director</option>
                    <option value="manager">Manager</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="ic">Individual Contributor</option>
                </select>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('roles', this)">Department Titles</button>
                <button class="tab-btn" onclick="switchTab('responsibilities', this)">Responsibilities</button>
            </div>

            <!-- Roles Tab -->
            <div class="tab-content active" id="tab-roles">
                <div class="role-grid" id="role-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Responsibilities Tab -->
            <div class="tab-content" id="tab-responsibilities">
                <div id="responsibilities-container">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/help-modal.js"></script>
    <script>
        // State
        let allRoles = [];
        let allTags = [];
        let allResponsibilities = [];
        let departments = [];
        let editingRoleId = null;
        let deletingRoleId = null;
        let editingResponsibilityId = null;
        let deletingResponsibilityId = null;

        // Modal instances
        let roleModal = null;
        let templatesModal = null;
        let responsibilityModal = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            // Initialize help modal
            HelpModal.init({
                helpFile: '/api/docs/roles-user-guide.md',
                title: 'Title Management Guide'
            });

            await Promise.all([
                loadRoles(),
                loadTags(),
                loadResponsibilities(),
                loadDepartments()
            ]);
            populateDepartmentFilters();
        });

        // Load all roles
        async function loadRoles() {
            try {
                const response = await fetch('/api/roles');
                const data = await response.json();

                if (data.success) {
                    allRoles = data.data;
                    document.getElementById('total-roles').textContent = allRoles.length;
                    renderRoles();
                }
            } catch (error) {
                console.error('Error loading roles:', error);
            }
        }

        // Load tags
        async function loadTags() {
            try {
                const response = await fetch('/api/tags');
                const data = await response.json();

                if (data.success) {
                    allTags = data.data;
                    populateTagSelector();
                }
            } catch (error) {
                console.error('Error loading tags:', error);
            }
        }

        // Load responsibilities
        async function loadResponsibilities() {
            try {
                const response = await fetch('/api/roles/responsibilities');
                const data = await response.json();

                if (data.success) {
                    allResponsibilities = data.data;
                    document.getElementById('total-responsibilities').textContent = allResponsibilities.length;
                    populateResponsibilitySelector();
                }
            } catch (error) {
                console.error('Error loading responsibilities:', error);
            }
        }

        // Load departments
        async function loadDepartments() {
            try {
                const response = await fetch('/api/departments');
                const data = await response.json();

                if (data.success) {
                    departments = data.data || data;
                }
            } catch (error) {
                console.error('Error loading departments:', error);
                // Fallback departments
                departments = [
                    { id: 'hr', name: 'Human Resources' },
                    { id: 'finance', name: 'Finance' },
                    { id: 'operations', name: 'Operations' },
                    { id: 'it', name: 'Information Technology' },
                    { id: 'marketing', name: 'Marketing' },
                    { id: 'sales', name: 'Sales' }
                ];
            }
        }

        // Populate department filters
        function populateDepartmentFilters() {
            const filterSelect = document.getElementById('department-filter');
            const formSelect = document.getElementById('role-department');

            departments.forEach(dept => {
                filterSelect.innerHTML += `<option value="${dept.id}">${dept.name}</option>`;
                formSelect.innerHTML += `<option value="${dept.id}">${dept.name}</option>`;
            });
        }


        // Render roles grid
        function renderRoles() {
            const grid = document.getElementById('role-grid');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const deptFilter = document.getElementById('department-filter').value;
            const levelFilter = document.getElementById('level-filter').value;

            let filteredRoles = allRoles.filter(role => {
                const matchesSearch = role.name.toLowerCase().includes(searchTerm) ||
                                     (role.description && role.description.toLowerCase().includes(searchTerm));
                const matchesDept = !deptFilter || role.department_id === deptFilter;
                const matchesLevel = !levelFilter || role.role_level === levelFilter;
                return matchesSearch && matchesDept && matchesLevel;
            });

            if (filteredRoles.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i data-lucide="users"></i>
                        <h3>No roles found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filteredRoles.map(role => `
                <div class="role-card">
                    <div class="role-card-header">
                        <div class="role-info">
                            <div class="role-title">${escapeHtml(role.name)}</div>
                            <div class="role-department">
                                <i data-lucide="building-2"></i>
                                ${getDepartmentName(role.department_id)}
                            </div>
                        </div>
                        <span class="role-level ${role.role_level}">${formatLevel(role.role_level)}</span>
                    </div>
                    <div class="role-card-body">
                        ${role.description ? `<p class="role-description">${escapeHtml(role.description)}</p>` : ''}

                        ${role.tags && role.tags.length > 0 ? `
                            <div class="role-section">
                                <div class="role-section-title">Associated Tags</div>
                                <div class="tag-list">
                                    ${role.tags.map(tag => `
                                        <span class="tag-chip ${tag.category}">${escapeHtml(tag.name)}</span>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        ${role.responsibilities && role.responsibilities.length > 0 ? `
                            <div class="role-section">
                                <div class="role-section-title">Responsibilities</div>
                                <div class="responsibility-list">
                                    ${role.responsibilities.slice(0, 3).map(resp => `
                                        <div class="responsibility-item">
                                            <i data-lucide="check-circle"></i>
                                            ${escapeHtml(resp.name)}
                                        </div>
                                    `).join('')}
                                    ${role.responsibilities.length > 3 ? `
                                        <div class="responsibility-item" style="color: var(--text-muted);">
                                            +${role.responsibilities.length - 3} more
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="role-card-footer">
                        <button class="btn btn-sm btn-secondary" onclick="editRole('${role.id}')">
                            <i data-lucide="pencil"></i>
                            Edit
                        </button>
                        <button class="icon-btn danger" onclick="deleteRole('${role.id}', '${escapeHtml(role.name)}')">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Filter roles
        function filterRoles() {
            renderRoles();
        }

        // Tab switching
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'responsibilities') {
                renderResponsibilities();
            }
        }

        // Render responsibilities tab
        function renderResponsibilities() {
            const container = document.getElementById('responsibilities-container');

            if (allResponsibilities.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="clipboard-list"></i>
                        <h3>No responsibilities defined</h3>
                        <p>Responsibilities help define what each title is accountable for</p>
                        <button class="btn btn-primary" onclick="openResponsibilityModal()" style="margin-top: 1rem;">
                            <i data-lucide="plus"></i> Add Responsibility
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = `
                <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
                    <button class="btn btn-primary" onclick="openResponsibilityModal()">
                        <i data-lucide="plus"></i> Add Responsibility
                    </button>
                </div>
                <div class="table-container" style="background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border);">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: var(--bg-tertiary);">
                                <th style="text-align: left; padding: 0.875rem 1.25rem; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary);">Name</th>
                                <th style="text-align: left; padding: 0.875rem 1.25rem; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary);">Description</th>
                                <th style="text-align: center; padding: 0.875rem 1.25rem; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary);">Titles Using</th>
                                <th style="text-align: right; padding: 0.875rem 1.25rem; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary);">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${allResponsibilities.map(resp => `
                                <tr>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);">
                                        <strong>${escapeHtml(resp.name)}</strong>
                                    </td>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light); color: var(--text-secondary);">
                                        ${resp.description ? escapeHtml(resp.description) : '-'}
                                    </td>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light); text-align: center;">
                                        ${resp.role_count || 0}
                                    </td>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light); text-align: right;">
                                        <button class="icon-btn" onclick="editResponsibility('${resp.id}')" title="Edit">
                                            <i data-lucide="pencil"></i>
                                        </button>
                                        <button class="icon-btn danger" onclick="deleteResponsibility('${resp.id}', '${escapeHtml(resp.name).replace(/'/g, "\\'")}')" title="Delete">
                                            <i data-lucide="trash-2"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            lucide.createIcons();
        }

        // ==========================================
        // Responsibility CRUD Functions
        // ==========================================

        // Build parent responsibility options
        function buildParentResponsibilityOptions(selectedId = '') {
            return '<option value="">None (Top-level)</option>' +
                allResponsibilities.map(r => `<option value="${r.id}" ${r.id === selectedId ? 'selected' : ''}>${escapeHtml(r.name)}</option>`).join('');
        }

        // Open responsibility modal for create
        function openResponsibilityModal() {
            editingResponsibilityId = null;
            showResponsibilityModal('Add Responsibility', 'Add Responsibility', {});
        }

        // Open responsibility modal for edit
        async function editResponsibility(id) {
            const resp = allResponsibilities.find(r => r.id === id);
            if (!resp) return;

            editingResponsibilityId = id;
            showResponsibilityModal('Edit Responsibility', 'Save Changes', resp);
        }

        function showResponsibilityModal(title, buttonText, resp) {
            responsibilityModal = ModalService.create({
                title: title,
                content: `
                    <div class="form-group">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-input" id="responsibility-name" required placeholder="e.g., Budget planning" value="${escapeHtml(resp.name || '')}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-textarea" id="responsibility-description" placeholder="Brief description of this responsibility...">${escapeHtml(resp.description || '')}</textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Parent Responsibility (Optional)</label>
                        <select class="form-select" id="responsibility-parent">
                            ${buildParentResponsibilityOptions(resp.parent_id)}
                        </select>
                    </div>
                `,
                footer: `
                    <button type="button" class="i360-btn i360-btn-secondary" data-action="close">Cancel</button>
                    <button type="button" class="i360-btn i360-btn-primary" id="responsibility-save-btn">${buttonText}</button>
                `,
                width: 500,
                draggable: true,
                onOpen: () => {
                    document.getElementById('responsibility-save-btn').addEventListener('click', saveResponsibility);
                }
            });
            responsibilityModal.open();
        }

        // Close responsibility modal
        function closeResponsibilityModal() {
            if (responsibilityModal) {
                responsibilityModal.close();
                responsibilityModal = null;
            }
            editingResponsibilityId = null;
        }

        // Save responsibility (create or update)
        async function saveResponsibility() {
            const respData = {
                name: document.getElementById('responsibility-name').value.trim(),
                description: document.getElementById('responsibility-description').value.trim() || null,
                parent_id: document.getElementById('responsibility-parent').value || null
            };

            if (!respData.name) {
                ModalService.warning('Please enter a responsibility name');
                return;
            }

            try {
                const url = editingResponsibilityId
                    ? `/api/roles/responsibilities/${editingResponsibilityId}`
                    : '/api/roles/responsibilities';
                const method = editingResponsibilityId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(respData)
                });

                const data = await response.json();

                if (data.success) {
                    closeResponsibilityModal();
                    await loadResponsibilities();
                    renderResponsibilities();
                    ModalService.success(editingResponsibilityId ? 'Responsibility updated' : 'Responsibility added');
                } else {
                    ModalService.error(data.error || 'Failed to save responsibility');
                }
            } catch (error) {
                console.error('Error saving responsibility:', error);
                ModalService.error('Failed to save responsibility');
            }
        }

        // Delete responsibility
        async function deleteResponsibility(id, name) {
            const confirmed = await ModalService.confirm({
                title: 'Delete Responsibility',
                message: `Are you sure you want to delete "${name}"? This action cannot be undone.`,
                type: 'danger',
                confirmText: 'Delete',
                cancelText: 'Cancel'
            });

            if (!confirmed) return;

            try {
                const response = await fetch(`/api/roles/responsibilities/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    await loadResponsibilities();
                    renderResponsibilities();
                    ModalService.success('Responsibility deleted');
                } else {
                    ModalService.error(data.error || 'Failed to delete responsibility');
                }
            } catch (error) {
                console.error('Error deleting responsibility:', error);
                ModalService.error('Failed to delete responsibility');
            }
        }

        // Inline add responsibility from modal
        async function addResponsibilityInline() {
            const input = document.getElementById('new-responsibility-name');
            if (!input) return;

            const name = input.value.trim();

            if (!name) {
                input.focus();
                return;
            }

            try {
                const response = await fetch('/api/roles/responsibilities', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description: null })
                });

                const data = await response.json();

                if (data.success) {
                    input.value = '';
                    await loadResponsibilities();

                    // Refresh the responsibility selector in the open modal
                    const selector = document.getElementById('responsibility-selector');
                    if (selector) {
                        selector.innerHTML = buildResponsibilitySelectorHtml([]);

                        // Auto-check the newly added responsibility
                        const newCheckbox = selector.querySelector(`input[value="${data.data.id}"]`);
                        if (newCheckbox) {
                            newCheckbox.checked = true;
                        }
                    }

                    ModalService.toast({ message: 'Responsibility added', type: 'success', duration: 2000 });
                } else {
                    ModalService.error(data.error || 'Failed to add responsibility');
                }
            } catch (error) {
                console.error('Error adding responsibility:', error);
                ModalService.error('Failed to add responsibility');
            }
        }

        // Build department options HTML
        function buildDepartmentOptions(selectedId = '') {
            return '<option value="">Select department...</option>' +
                departments.map(d => `<option value="${d.id}" ${d.id === selectedId ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('');
        }

        // Build tag selector HTML
        function buildTagSelectorHtml(selectedTags = []) {
            if (allTags.length === 0) {
                return '<p style="color: var(--text-muted); padding: 1rem;">No tags available</p>';
            }

            const grouped = { skill: [], domain: [], function: [] };
            allTags.forEach(tag => {
                if (grouped[tag.category]) {
                    grouped[tag.category].push(tag);
                }
            });

            let html = '';
            Object.entries(grouped).forEach(([category, tags]) => {
                if (tags.length > 0) {
                    html += `<div style="margin-bottom: 0.75rem;">
                        <div style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; padding: 0 0.5rem;">${category}s</div>`;
                    html += tags.map(tag => `
                        <label class="selector-item">
                            <input type="checkbox" name="tags" value="${tag.id}" ${selectedTags.some(t => t.id === tag.id) ? 'checked' : ''}>
                            <div class="selector-item-content">
                                <div class="selector-item-name">${escapeHtml(tag.name)}</div>
                                ${tag.description ? `<div class="selector-item-desc">${escapeHtml(tag.description)}</div>` : ''}
                            </div>
                        </label>
                    `).join('');
                    html += '</div>';
                }
            });

            return html;
        }

        // Build responsibility selector HTML
        function buildResponsibilitySelectorHtml(selectedResps = []) {
            if (allResponsibilities.length === 0) {
                return '<p style="color: var(--text-muted); padding: 1rem;">No responsibilities available. Add one above.</p>';
            }

            return allResponsibilities.map(resp => `
                <label class="selector-item">
                    <input type="checkbox" name="responsibilities" value="${resp.id}" ${selectedResps.some(r => r.id === resp.id) ? 'checked' : ''}>
                    <div class="selector-item-content">
                        <div class="selector-item-name">${escapeHtml(resp.name)}</div>
                        ${resp.description ? `<div class="selector-item-desc">${escapeHtml(resp.description)}</div>` : ''}
                    </div>
                </label>
            `).join('');
        }

        // Modal handlers
        function openCreateRoleModal() {
            editingRoleId = null;
            showRoleModal('Create New Title', 'Create Title', {});
        }

        async function editRole(id) {
            const role = allRoles.find(r => r.id === id);
            if (!role) return;

            editingRoleId = id;
            showRoleModal('Edit Title', 'Save Changes', role);
        }

        function showRoleModal(title, buttonText, role) {
            roleModal = ModalService.create({
                title: title,
                content: `
                    <div class="modal-content-grid">
                        <!-- COLUMN 1: Basic Info -->
                        <div class="modal-column">
                            <h4 class="column-title">Basic Information</h4>

                            <div class="form-group">
                                <label class="form-label">Department *</label>
                                <select class="form-select" id="role-department" required>
                                    ${buildDepartmentOptions(role.department_id)}
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Level *</label>
                                <select class="form-select" id="role-level" required>
                                    <option value="">Select level...</option>
                                    <option value="ic" ${role.role_level === 'ic' ? 'selected' : ''}>Individual Contributor</option>
                                    <option value="manager" ${role.role_level === 'manager' ? 'selected' : ''}>Manager</option>
                                    <option value="director" ${role.role_level === 'director' ? 'selected' : ''}>Director</option>
                                    <option value="vp" ${role.role_level === 'vp' ? 'selected' : ''}>Vice President</option>
                                    <option value="c-level" ${role.role_level === 'c-level' ? 'selected' : ''}>C-Level Executive</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Title Name *</label>
                                <input type="text" class="form-input" id="role-title" required placeholder="e.g., Marketing Manager" value="${escapeHtml(role.name || '')}">
                            </div>

                            <div class="form-group">
                                <label class="form-label">Description</label>
                                <textarea class="form-textarea" id="role-description" placeholder="What this title is responsible for...">${escapeHtml(role.description || '')}</textarea>
                            </div>
                        </div>

                        <!-- COLUMN 2: Responsibilities -->
                        <div class="modal-column">
                            <h4 class="column-title">Responsibilities</h4>

                            <div class="inline-add-form">
                                <input type="text" class="form-input" id="new-responsibility-name" placeholder="Add new responsibility...">
                                <button type="button" class="btn btn-primary btn-sm" id="add-resp-btn" title="Add Responsibility">
                                    <i data-lucide="plus"></i>
                                </button>
                            </div>

                            <div class="selector-list" id="responsibility-selector">
                                ${buildResponsibilitySelectorHtml(role.responsibilities || [])}
                            </div>
                        </div>

                        <!-- COLUMN 3: Associated Tags -->
                        <div class="modal-column">
                            <h4 class="column-title">Associated Tags</h4>

                            <div class="selector-list" id="tag-selector">
                                ${buildTagSelectorHtml(role.tags || [])}
                            </div>
                        </div>
                    </div>
                `,
                footer: `
                    <button type="button" class="i360-btn i360-btn-secondary" data-action="close">Cancel</button>
                    <button type="button" class="i360-btn i360-btn-primary" id="save-btn">${buttonText}</button>
                `,
                width: 950,
                draggable: true,
                resizable: true,
                className: 'role-modal-dialog',
                onOpen: () => {
                    lucide.createIcons();
                    document.getElementById('save-btn').addEventListener('click', saveRole);
                    document.getElementById('add-resp-btn').addEventListener('click', addResponsibilityInline);
                }
            });
            roleModal.open();
        }

        function closeModal() {
            if (roleModal) {
                roleModal.close();
                roleModal = null;
            }
            editingRoleId = null;
        }

        // Templates modal
        async function openTemplatesModal() {
            templatesModal = ModalService.create({
                title: 'Role Templates',
                content: `
                    <p style="color: var(--text-secondary); margin-bottom: 1rem;">Select a template to create a pre-configured role:</p>
                    <div id="templates-list">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                `,
                footer: `
                    <button type="button" class="i360-btn i360-btn-secondary" data-action="close">Close</button>
                `,
                width: 560,
                draggable: true,
                onOpen: async () => {
                    try {
                        const response = await fetch('/api/roles/templates');
                        const data = await response.json();

                        const container = document.getElementById('templates-list');
                        if (data.success && data.data.length > 0) {
                            container.innerHTML = data.data.map(template => `
                                <div class="role-card" style="margin-bottom: 1rem; cursor: pointer;" data-template-id="${template.id}">
                                    <div class="role-card-header">
                                        <div class="role-info">
                                            <div class="role-title">${escapeHtml(template.title)}</div>
                                            <div class="role-department">
                                                <i data-lucide="building-2"></i>
                                                ${getDepartmentName(template.department_id)}
                                            </div>
                                        </div>
                                        <span class="role-level ${template.role_level}">${formatLevel(template.role_level)}</span>
                                    </div>
                                </div>
                            `).join('');

                            // Add click handlers
                            container.querySelectorAll('.role-card').forEach(card => {
                                card.addEventListener('click', () => useTemplate(card.dataset.templateId));
                            });

                            lucide.createIcons();
                        } else {
                            container.innerHTML = '<p style="color: var(--text-muted);">No templates available</p>';
                        }
                    } catch (error) {
                        console.error('Error loading templates:', error);
                    }
                }
            });
            templatesModal.open();
        }

        function closeTemplatesModal() {
            if (templatesModal) {
                templatesModal.close();
                templatesModal = null;
            }
        }

        async function useTemplate(templateId) {
            try {
                const response = await fetch(`/api/roles/templates/${templateId}`);
                const data = await response.json();

                if (data.success) {
                    const template = data.data;
                    closeTemplatesModal();

                    // Create role modal pre-filled with template data
                    editingRoleId = null;
                    showRoleModal('Create New Title', 'Create Title', {
                        name: template.title,
                        role_level: template.role_level,
                        department_id: template.department_id,
                        description: template.description || ''
                    });
                }
            } catch (error) {
                console.error('Error using template:', error);
            }
        }

        // Save role
        async function saveRole() {
            const selectedTags = Array.from(document.querySelectorAll('#tag-selector input:checked')).map(cb => cb.value);
            const selectedResponsibilities = Array.from(document.querySelectorAll('#responsibility-selector input:checked')).map(cb => cb.value);

            const roleData = {
                title: document.getElementById('role-title').value.trim(),
                role_level: document.getElementById('role-level').value,
                department_id: document.getElementById('role-department').value,
                description: document.getElementById('role-description').value.trim() || null,
                tag_ids: selectedTags,
                responsibility_ids: selectedResponsibilities
            };

            if (!roleData.title || !roleData.role_level || !roleData.department_id) {
                ModalService.warning('Please fill in all required fields');
                return;
            }

            try {
                const url = editingRoleId ? `/api/roles/${editingRoleId}` : '/api/roles';
                const method = editingRoleId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roleData)
                });

                const data = await response.json();

                if (data.success) {
                    closeModal();
                    await loadRoles();
                    ModalService.success(editingRoleId ? 'Title updated successfully' : 'Title created successfully');
                } else {
                    ModalService.error(data.error || 'Failed to save title');
                }
            } catch (error) {
                console.error('Error saving title:', error);
                ModalService.error('Failed to save title');
            }
        }

        // Delete role
        async function deleteRole(id, title) {
            const confirmed = await ModalService.confirm({
                title: 'Delete Title',
                message: `Are you sure you want to delete "${title}"? This will remove all tag and responsibility associations.`,
                type: 'danger',
                confirmText: 'Delete',
                cancelText: 'Cancel'
            });

            if (!confirmed) return;

            try {
                const response = await fetch(`/api/roles/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    await loadRoles();
                    ModalService.success('Title deleted successfully');
                } else {
                    ModalService.error(data.error || 'Failed to delete title');
                }
            } catch (error) {
                console.error('Error deleting title:', error);
                ModalService.error('Failed to delete title');
            }
        }

        // Utility functions
        function getDepartmentName(id) {
            const dept = departments.find(d => d.id === id);
            return dept ? dept.name : id;
        }

        function formatLevel(level) {
            const levels = {
                executive: 'Executive',
                director: 'Director',
                manager: 'Manager',
                supervisor: 'Supervisor',
                ic: 'IC'
            };
            return levels[level] || level;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showSuccess(message) {
            ModalService.success(message);
        }

        function showError(message) {
            ModalService.error(message);
        }
    </script>
</body>
</html>
