<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucide Icons Browser | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/navigation.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Light Mode (default) */
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #e8e8ed;
            --bg-hover: #f0f0f5;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #aeaeb2;
            --border: #d2d2d7;
            --border-light: #e5e5ea;

            /* Brand Colors */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

            /* Layout */
            --nav-height: 60px;
            --sidebar-width: 260px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252540;
            --bg-hover: #2a2a45;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a80;
            --border: #3a3a50;
            --border-light: #2a2a40;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 30px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h1 i {
            color: var(--primary);
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-card i {
            color: var(--primary);
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Search and Filters */
        .search-filters {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filters-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .filter-btn {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .size-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .size-selector label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .size-selector select {
            padding: 10px 14px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
        }

        /* Icons Grid */
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .icon-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-card:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .icon-card.is-selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .icon-preview {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .icon-preview svg {
            width: 100%;
            height: 100%;
        }

        .icon-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            word-break: break-word;
        }

        .icon-card:hover .icon-name {
            color: var(--text-primary);
        }

        /* Icon Detail Panel */
        .icon-detail-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .icon-detail-panel.is-open {
            right: 0;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
        }

        .detail-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .detail-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .detail-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .detail-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .detail-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 30px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .detail-preview svg {
            width: 80px;
            height: 80px;
            color: var(--primary);
        }

        .detail-icon-name {
            font-size: 18px;
            font-weight: 600;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .code-block {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-primary);
            position: relative;
            overflow-x: auto;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: #ffffff;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .code-block:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn.is-copied {
            background: var(--success);
        }

        .size-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-btn {
            padding: 8px 14px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .size-btn:hover,
        .size-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 40px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .category-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-count {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-secondary);
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-secondary);
            gap: 16px;
        }

        .empty-state i {
            color: var(--text-muted);
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: var(--success);
            color: #ffffff;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .stats-bar {
                flex-wrap: wrap;
            }

            .search-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            .icons-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .icon-detail-panel {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar will be injected by navigation.js -->
        <aside class="sidebar"></aside>

        <main class="main-content">
        <div class="page-header">
            <h1>
                <i data-lucide="shapes" style="width: 32px; height: 32px;"></i>
                Lucide Icons Browser
            </h1>
            <p>Browse, search, and copy Lucide icons for use in Insight 360</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <i data-lucide="package" style="width: 24px; height: 24px;"></i>
                <div class="stat-info">
                    <span class="stat-value" id="totalIcons">0</span>
                    <span class="stat-label">Total Icons</span>
                </div>
            </div>
            <div class="stat-card">
                <i data-lucide="folder" style="width: 24px; height: 24px;"></i>
                <div class="stat-info">
                    <span class="stat-value" id="totalCategories">0</span>
                    <span class="stat-label">Categories</span>
                </div>
            </div>
            <div class="stat-card">
                <i data-lucide="search" style="width: 24px; height: 24px;"></i>
                <div class="stat-info">
                    <span class="stat-value" id="matchingIcons">0</span>
                    <span class="stat-label">Matching</span>
                </div>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="search-filters">
            <div class="search-row">
                <div class="search-box">
                    <i data-lucide="search" style="width: 18px; height: 18px;"></i>
                    <input type="text" id="searchInput" placeholder="Search icons by name...">
                </div>
                <div class="size-selector">
                    <label>Preview size:</label>
                    <select id="previewSize">
                        <option value="24">24px</option>
                        <option value="32">32px</option>
                        <option value="48" selected>48px</option>
                        <option value="64">64px</option>
                    </select>
                </div>
            </div>
            <div class="filters-row" id="categoryFilters">
                <button class="filter-btn active" data-category="all">All</button>
            </div>
        </div>

        <!-- Icons Container -->
        <div id="iconsContainer">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <span>Loading icons...</span>
            </div>
        </div>
    </main>
    </div>

    <!-- Icon Detail Panel -->
    <div class="overlay" id="overlay"></div>
    <div class="icon-detail-panel" id="detailPanel">
        <div class="detail-header">
            <h3>Icon Details</h3>
            <button class="detail-close" id="closeDetail">
                <i data-lucide="x" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
        <div class="detail-content" id="detailContent">
            <!-- Populated dynamically -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

            'weather': ['sun', 'moon', 'cloud', 'cloud-rain', 'cloud-snow', 'cloud-drizzle', 'cloud-fog', 'cloud-lightning', 'cloud-sun', 'cloud-moon', 'rainbow', 'thermometer', 'thermometer-sun', 'thermometer-snowflake', 'wind', 'tornado', 'umbrella', 'snowflake', 'haze', 'sunrise', 'sunset'],
            'shapes': ['circle', 'square', 'rectangle-horizontal', 'rectangle-vertical', 'triangle', 'pentagon', 'hexagon', 'octagon', 'star', 'heart', 'diamond', 'spade', 'club', 'shapes', 'component', 'puzzle', 'layers', 'layers-2', 'layers-3'],
            'misc': ['settings', 'settings-2', 'sliders', 'sliders-horizontal', 'filter', 'sort-asc', 'sort-desc', 'search', 'zoom-in', 'zoom-out', 'help-circle', 'info', 'check', 'check-circle', 'check-square', 'x', 'x-circle', 'x-square', 'plus', 'plus-circle', 'plus-square', 'minus', 'minus-circle', 'minus-square', 'loader', 'loader-2', 'refresh-cw', 'power', 'power-off', 'zap', 'zap-off', 'flame', 'sparkle', 'sparkles', 'award', 'trophy', 'medal', 'crown', 'gem', 'wand', 'wand-2', 'magic-wand', 'lightbulb', 'lightbulb-off', 'target', 'crosshair', 'flag', 'bookmark', 'bookmark-plus', 'bookmark-minus', 'bookmark-check', 'bell', 'bell-off', 'bell-ring', 'megaphone', 'pin', 'pin-off', 'paperclip', 'printer', 'scan', 'qr-code', 'barcode', 'hash', 'at-sign', 'anchor', 'compass', 'scale', 'ruler', 'palette', 'pipette', 'paint-bucket', 'brush', 'highlighter', 'droplet', 'droplets', 'leaf', 'tree', 'trees', 'flower', 'flower-2', 'shrub', 'vegan', 'bone', 'paw-print', 'fish', 'bird', 'cat', 'dog', 'rabbit', 'snail', 'turtle', 'bug', 'spider', 'rat', 'battery', 'battery-charging', 'battery-full', 'battery-low', 'battery-medium', 'battery-warning', 'plug', 'plug-2', 'unplug', 'cable']
        };

        // State
        let allIcons = [];
        let filteredIcons = [];
        let selectedIcon = null;
        let currentPreviewSize = 48;

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const categoryFilters = document.getElementById('categoryFilters');
        const previewSize = document.getElementById('previewSize');
        const iconsContainer = document.getElementById('iconsContainer');
        const detailPanel = document.getElementById('detailPanel');
        const detailContent = document.getElementById('detailContent');
        const overlay = document.getElementById('overlay');
        const closeDetail = document.getElementById('closeDetail');
        const toastContainer = document.getElementById('toastContainer');

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Get all Lucide icons
            await loadIcons();

            // Setup event listeners
            setupEventListeners();

            // Render initial view
            renderIcons();

            // Initialize Lucide icons
            lucide.createIcons();
        });

        async function loadIcons() {
            // Get icons from Lucide library
            allIcons = [];

            // Wait for lucide to be fully loaded
            await new Promise(resolve => {
                if (typeof lucide !== 'undefined' && lucide.icons) {
                    resolve();
                } else {
                    // Wait a bit for the library to load
                    setTimeout(resolve, 500);
                }
            });

            // Helper to convert kebab-case to PascalCase for matching
            function kebabToPascal(str) {
                return str.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join('');
            }

            // Helper to convert PascalCase to kebab-case for display (handles numbers)
            function pascalToKebab(str) {
                return str
                    .replace(/([a-z])([A-Z])/g, '$1-$2')  // lowercase followed by uppercase
                    .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')  // uppercase followed by uppercase+lowercase
                    .replace(/([a-zA-Z])(\d)/g, '$1-$2')  // letter followed by number
                    .replace(/(\d)([a-zA-Z])/g, '$1-$2')  // number followed by letter
                    .toLowerCase();
            }

            // Get all icon names from the categories (as a reference)
            // Store both PascalCase and kebab-case versions for matching
            const categorizedIcons = new Map();
            Object.entries(ICON_CATEGORIES).forEach(([category, icons]) => {
                icons.forEach(icon => {
                    // Store kebab-case version
                    categorizedIcons.set(icon.toLowerCase(), category);
                    // Also store PascalCase version
                    categorizedIcons.set(kebabToPascal(icon), category);
                });
            });

            // Get ALL icons from lucide library
            if (typeof lucide !== 'undefined' && lucide.icons) {
                Object.keys(lucide.icons).forEach(iconName => {
                    // Convert PascalCase to kebab-case for display and data-lucide attribute
                    const kebabName = pascalToKebab(iconName);

                    // Try to find category by kebab-case name
                    let category = categorizedIcons.get(kebabName);
                    if (!category) {
                        // Try PascalCase name
                        category = categorizedIcons.get(iconName);
                    }
                    if (!category) {
                        category = 'misc';
                    }

                    allIcons.push({
                        name: kebabName,  // Use kebab-case for data-lucide attribute
                        category: category
                    });
                });
            } else {
                // Fallback to categorized icons if lucide.icons not available
                Object.entries(ICON_CATEGORIES).forEach(([category, icons]) => {
                    icons.forEach(icon => {
                        allIcons.push({
                            name: icon,
                            category: category
                        });
                    });
                });
            }

            // Sort alphabetically
            allIcons.sort((a, b) => a.name.localeCompare(b.name));
            filteredIcons = [...allIcons];

            // Update stats
            document.getElementById('totalIcons').textContent = allIcons.length;
            document.getElementById('totalCategories').textContent = Object.keys(ICON_CATEGORIES).length;
            document.getElementById('matchingIcons').textContent = allIcons.length;

            // Build category filters from ICON_CATEGORIES (misc is already included)
            Object.keys(ICON_CATEGORIES).forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = category;
                btn.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                categoryFilters.appendChild(btn);
            });
        }

        function setupEventListeners() {
            // Search
            searchInput.addEventListener('input', debounce(handleSearch, 200));

            // Category filters
            categoryFilters.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    categoryFilters.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    e.target.classList.add('active');
                    handleCategoryFilter(e.target.dataset.category);
                }
            });

            // Preview size
            previewSize.addEventListener('change', (e) => {
                currentPreviewSize = parseInt(e.target.value);
                renderIcons();
            });

            // Close detail panel
            closeDetail.addEventListener('click', closeDetailPanel);
            overlay.addEventListener('click', closeDetailPanel);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDetailPanel();
                }
                if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        function handleSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const activeCategory = categoryFilters.querySelector('.filter-btn.active')?.dataset.category || 'all';

            filteredIcons = allIcons.filter(icon => {
                const matchesSearch = !query || icon.name.toLowerCase().includes(query);
                const matchesCategory = activeCategory === 'all' || icon.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            document.getElementById('matchingIcons').textContent = filteredIcons.length;
            renderIcons();
        }

        function handleCategoryFilter(category) {
            handleSearch(); // Re-apply search with new category
        }

        function renderIcons() {
            if (filteredIcons.length === 0) {
                iconsContainer.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="search-x" style="width: 48px; height: 48px;"></i>
                        <span>No icons found</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Group by category
            const grouped = {};
            filteredIcons.forEach(icon => {
                if (!grouped[icon.category]) {
                    grouped[icon.category] = [];
                }
                grouped[icon.category].push(icon);
            });

            let html = '';
            Object.entries(grouped).forEach(([category, icons]) => {
                html += `
                    <div class="category-section">
                        <div class="category-header">
                            <h3 class="category-title">
                                ${category.charAt(0).toUpperCase() + category.slice(1)}
                                <span class="category-count">(${icons.length})</span>
                            </h3>
                        </div>
                        <div class="icons-grid">
                            ${icons.map(icon => `
                                <div class="icon-card" data-icon="${icon.name}" data-category="${icon.category}">
                                    <div class="icon-preview">
                                        <i data-lucide="${icon.name}" style="width: ${currentPreviewSize}px; height: ${currentPreviewSize}px;"></i>
                                    </div>
                                    <span class="icon-name">${icon.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            iconsContainer.innerHTML = html;
            lucide.createIcons();

            // Add click handlers
            iconsContainer.querySelectorAll('.icon-card').forEach(card => {
                card.addEventListener('click', () => openIconDetail(card.dataset.icon, card.dataset.category));
            });
        }

        function openIconDetail(iconName, category) {
            selectedIcon = iconName;

            // Update selection state
            iconsContainer.querySelectorAll('.icon-card').forEach(card => {
                card.classList.toggle('is-selected', card.dataset.icon === iconName);
            });

            // Populate detail panel
            detailContent.innerHTML = `
                <div class="detail-preview">
                    <i data-lucide="${iconName}" style="width: 80px; height: 80px;"></i>
                    <span class="detail-icon-name">${iconName}</span>
                </div>

                <div class="detail-section">
                    <h4>Category</h4>
                    <span class="tag">${category}</span>
                </div>

                <div class="detail-section">
                    <h4>HTML Usage</h4>
                    <div class="code-block">
                        <code>&lt;i data-lucide="${iconName}"&gt;&lt;/i&gt;</code>
                        <button class="copy-btn" data-copy='<i data-lucide="${iconName}"></i>'>Copy</button>
                    </div>
                </div>

                <div class="detail-section">
                    <h4>With Size</h4>
                    <div class="code-block">
                        <code>&lt;i data-lucide="${iconName}" style="width: 24px; height: 24px;"&gt;&lt;/i&gt;</code>
                        <button class="copy-btn" data-copy='<i data-lucide="${iconName}" style="width: 24px; height: 24px;"></i>'>Copy</button>
                    </div>
                </div>

                <div class="detail-section">
                    <h4>React Component</h4>
                    <div class="code-block">
                        <code>import { ${toPascalCase(iconName)} } from 'lucide-react';</code>
                        <button class="copy-btn" data-copy="import { ${toPascalCase(iconName)} } from 'lucide-react';">Copy</button>
                    </div>
                </div>

                <div class="detail-section">
                    <h4>Preview Sizes</h4>
                    <div class="size-buttons">
                        ${[16, 20, 24, 32, 48, 64].map(size => `
                            <button class="size-btn" data-size="${size}" title="${size}px">
                                <i data-lucide="${iconName}" style="width: ${size}px; height: ${size}px;"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            lucide.createIcons();

            // Add copy handlers
            detailContent.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(btn.dataset.copy);
                    btn.classList.add('is-copied');
                    btn.textContent = 'Copied!';
                    setTimeout(() => {
                        btn.classList.remove('is-copied');
                        btn.textContent = 'Copy';
                    }, 2000);
                });
            });

            // Show panel
            detailPanel.classList.add('is-open');
            overlay.classList.add('is-visible');
        }

        function closeDetailPanel() {
            detailPanel.classList.remove('is-open');
            overlay.classList.remove('is-visible');
            selectedIcon = null;

            iconsContainer.querySelectorAll('.icon-card').forEach(card => {
                card.classList.remove('is-selected');
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard!', 'success');
            }).catch(err => {
                console.error('Failed to copy:', err);
                showToast('Failed to copy', 'error');
            });
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function toPascalCase(str) {
            return str
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join('');
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
