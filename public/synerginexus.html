<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynergiNexus | Insight 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #e8e8ed;
            --bg-hover: #f0f0f5;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #aeaeb2;
            --border: #d2d2d7;
            --border-light: #e5e5ea;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --sidebar-width: 260px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252540;
            --bg-hover: #2a2a45;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b80;
            --border: #2a2a40;
            --border-light: #353550;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .main-container {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            max-width: 1400px;
            flex: 1;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header-subtitle { color: var(--text-secondary); margin-top: 0.25rem; }
        .header-actions { display: flex; gap: 0.75rem; }
    </style>
    <style>
        /* SynergiNexus Specific Styles */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dashboard-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .dashboard-card.digm { border-left: 4px solid var(--primary); }
        .dashboard-card.values { border-left: 4px solid var(--success); }
        .dashboard-card.principles { border-left: 4px solid var(--warning); }
        .dashboard-card.conflicts { border-left: 4px solid var(--danger); }

        .dashboard-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .dashboard-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-card-icon.digm { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
        .dashboard-card-icon.values { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .dashboard-card-icon.principles { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .dashboard-card-icon.conflicts { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .dashboard-card-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .dashboard-card-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* DIGM Layers */
        .digm-section {
            margin-bottom: 2rem;
        }

        .digm-layers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .digm-layer-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .digm-layer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .digm-layer-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .digm-layer-title i {
            width: 20px;
            height: 20px;
        }

        .layer-identity { color: #8b5cf6; }
        .layer-cognitive { color: #3b82f6; }
        .layer-voice { color: #10b981; }
        .layer-adaptation { color: #f59e0b; }

        .digm-layer-content {
            padding: 1rem 1.25rem;
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-light);
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-key {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .config-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-badge.inactive { background: rgba(107, 114, 128, 0.15); color: var(--text-muted); }

        /* Values Grid */
        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .value-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .value-card:hover {
            border-color: var(--primary);
        }

        .value-card.non-negotiable {
            border-left: 4px solid var(--danger);
        }

        .value-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .value-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .value-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .value-badge.non-negotiable {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .value-badge.negotiable {
            background: rgba(107, 114, 128, 0.15);
            color: var(--text-muted);
        }

        .value-meaning {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .value-why {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .value-principles {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .principle-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.5rem 0;
            font-size: 0.85rem;
        }

        .principle-item i {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .principle-type {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-weight: 500;
            margin-left: 0.5rem;
        }

        .principle-type.requirement { background: rgba(59, 130, 246, 0.15); color: var(--info); }
        .principle-type.prohibition { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .principle-type.disclosure { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .principle-type.boundary { background: rgba(107, 114, 128, 0.15); color: var(--text-secondary); }

        /* Conflicts Section */
        .conflicts-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .conflict-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
        }

        .conflict-item:last-child {
            border-bottom: none;
        }

        .conflict-severity {
            width: 8px;
            height: 40px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .conflict-severity.low { background: var(--info); }
        .conflict-severity.medium { background: var(--warning); }
        .conflict-severity.high { background: #f97316; }
        .conflict-severity.critical { background: var(--danger); }

        .conflict-info {
            flex: 1;
        }

        .conflict-description {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .conflict-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .conflict-status {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .conflict-status.pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .conflict-status.escalated { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .conflict-status.resolved { background: rgba(16, 185, 129, 0.15); color: var(--success); }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 0.75rem 1.25rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: -1px;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.85rem;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 0.375rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-primary);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: translateY(-20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0.25rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-checkbox input {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar injected by navigation.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-container">
            <!-- Page Header -->
            <div class="page-header">
                <div class="header-content">
                    <h1>SynergiNexus</h1>
                    <p class="header-subtitle">Values-Driven Intelligence Governance</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="refreshDashboard()">
                        <i data-lucide="refresh-cw"></i>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Dashboard Overview -->
            <div class="dashboard-grid">
                <div class="dashboard-card digm">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon digm">
                            <i data-lucide="layers"></i>
                        </div>
                        <div>
                            <div class="dashboard-card-value" id="digm-count">0</div>
                            <div class="dashboard-card-label">DIGM Configs</div>
                        </div>
                    </div>
                </div>
                <div class="dashboard-card values">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon values">
                            <i data-lucide="heart"></i>
                        </div>
                        <div>
                            <div class="dashboard-card-value" id="values-count">0</div>
                            <div class="dashboard-card-label">Governance Values</div>
                        </div>
                    </div>
                </div>
                <div class="dashboard-card principles">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon principles">
                            <i data-lucide="shield-check"></i>
                        </div>
                        <div>
                            <div class="dashboard-card-value" id="principles-count">0</div>
                            <div class="dashboard-card-label">Principles</div>
                        </div>
                    </div>
                </div>
                <div class="dashboard-card conflicts">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon conflicts">
                            <i data-lucide="alert-triangle"></i>
                        </div>
                        <div>
                            <div class="dashboard-card-value" id="conflicts-count">0</div>
                            <div class="dashboard-card-label">Open Conflicts</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('digm', this)">DIGM Layers</button>
                <button class="tab-btn" onclick="switchTab('values', this)">Values & Principles</button>
                <button class="tab-btn" onclick="switchTab('conflicts', this)">Conflicts</button>
                <button class="tab-btn" onclick="switchTab('escalation', this)">Escalation Rules</button>
            </div>

            <!-- DIGM Tab -->
            <div class="tab-content active" id="tab-digm">
                <div class="section-header">
                    <h2 class="section-title">Disciplined Intelligence Governance Model</h2>
                </div>
                <div class="digm-layers" id="digm-layers">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Values Tab -->
            <div class="tab-content" id="tab-values">
                <div class="section-header">
                    <h2 class="section-title">Governance Values</h2>
                    <button class="btn btn-primary" onclick="openValueModal()">
                        <i data-lucide="plus"></i>
                        Add Value
                    </button>
                </div>
                <div class="values-grid" id="values-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Conflicts Tab -->
            <div class="tab-content" id="tab-conflicts">
                <div class="section-header">
                    <h2 class="section-title">Governance Conflicts</h2>
                    <button class="btn btn-primary" onclick="openConflictModal()">
                        <i data-lucide="plus"></i>
                        Log Conflict
                    </button>
                </div>
                <div class="conflicts-list" id="conflicts-list">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Escalation Tab -->
            <div class="tab-content" id="tab-escalation">
                <div class="section-header">
                    <h2 class="section-title">Escalation Rules</h2>
                </div>
                <div id="escalation-rules">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Value Modal -->
    <div class="modal-overlay" id="value-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Add Governance Value</h3>
                <button class="modal-close" onclick="closeValueModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="value-form" onsubmit="saveValue(event)">
                    <div class="form-group">
                        <label class="form-label">Value Name *</label>
                        <input type="text" class="form-input" id="value-name" required placeholder="e.g., Integrity">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Plain Meaning *</label>
                        <input type="text" class="form-input" id="value-meaning" required placeholder="What this value means in simple terms">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Why It Matters</label>
                        <textarea class="form-textarea" id="value-why" placeholder="Explain the importance of this value..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" id="value-non-negotiable">
                            <span>Non-Negotiable (Cannot be compromised)</span>
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeValueModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" form="value-form">Add Value</button>
            </div>
        </div>
    </div>

    <!-- Conflict Modal -->
    <div class="modal-overlay" id="conflict-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Log Governance Conflict</h3>
                <button class="modal-close" onclick="closeConflictModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="conflict-form" onsubmit="saveConflict(event)">
                    <div class="form-group">
                        <label class="form-label">Conflict Description *</label>
                        <textarea class="form-textarea" id="conflict-description" required placeholder="Describe the governance conflict..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Severity *</label>
                        <select class="form-select" id="conflict-severity" required>
                            <option value="">Select severity...</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Context</label>
                        <textarea class="form-textarea" id="conflict-context" placeholder="Additional context about when/how this occurred..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeConflictModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" form="conflict-form">Log Conflict</button>
            </div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script>
        // State
        let digmConfigs = [];
        let governanceValues = [];
        let conflicts = [];
        let escalationRules = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadDashboard();
        });

        // Load dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch('/api/synerginexus/dashboard');
                const data = await response.json();

                if (data.success) {
                    const summary = data.data;
                    document.getElementById('digm-count').textContent = summary.digm_configs || 0;
                    document.getElementById('values-count').textContent = summary.governance_values || 0;
                    document.getElementById('principles-count').textContent = summary.governance_principles || 0;
                    document.getElementById('conflicts-count').textContent = summary.open_conflicts || 0;
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }

            // Load tab content
            loadDIGM();
        }

        async function refreshDashboard() {
            await loadDashboard();
            showSuccess('Dashboard refreshed');
        }

        // Load DIGM configurations
        async function loadDIGM() {
            const container = document.getElementById('digm-layers');

            try {
                const response = await fetch('/api/synerginexus/digm');
                const data = await response.json();

                if (data.success) {
                    digmConfigs = data.data;
                    renderDIGM();
                }
            } catch (error) {
                console.error('Error loading DIGM:', error);
                container.innerHTML = '<p style="color: var(--danger);">Failed to load DIGM configuration</p>';
            }
        }

        function renderDIGM() {
            const container = document.getElementById('digm-layers');

            const layers = ['identity', 'cognitive', 'voice', 'adaptation'];
            const layerIcons = {
                identity: 'fingerprint',
                cognitive: 'brain',
                voice: 'message-circle',
                adaptation: 'settings-2'
            };
            const layerDescriptions = {
                identity: 'Role, Authority, Ethics',
                cognitive: 'Reasoning Framework',
                voice: 'Tone & Expression',
                adaptation: 'Contextual Flexibility'
            };

            container.innerHTML = layers.map(layer => {
                const configs = digmConfigs.filter(c => c.layer === layer);

                return `
                    <div class="digm-layer-card">
                        <div class="digm-layer-header">
                            <span class="digm-layer-title">
                                <i data-lucide="${layerIcons[layer]}" class="layer-${layer}"></i>
                                ${capitalizeFirst(layer)}
                            </span>
                            <span class="status-badge ${configs.some(c => c.is_active) ? 'active' : 'inactive'}">
                                ${configs.filter(c => c.is_active).length}/${configs.length} Active
                            </span>
                        </div>
                        <div class="digm-layer-content">
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">
                                ${layerDescriptions[layer]}
                            </p>
                            ${configs.length > 0 ? configs.map(config => `
                                <div class="config-item">
                                    <span class="config-key">${formatConfigKey(config.config_key)}</span>
                                    <div class="config-status">
                                        <span class="status-badge ${config.is_active ? 'active' : 'inactive'}">
                                            ${config.is_active ? 'Active' : 'Inactive'}
                                        </span>
                                        <button class="icon-btn" onclick="viewConfig('${config.id}')" title="View Details">
                                            <i data-lucide="eye"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('') : '<p style="color: var(--text-muted);">No configurations</p>'}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Load governance values
        async function loadValues() {
            const container = document.getElementById('values-grid');

            try {
                const response = await fetch('/api/synerginexus/values');
                const data = await response.json();

                if (data.success) {
                    governanceValues = data.data;
                    renderValues();
                }
            } catch (error) {
                console.error('Error loading values:', error);
                container.innerHTML = '<p style="color: var(--danger);">Failed to load values</p>';
            }
        }

        function renderValues() {
            const container = document.getElementById('values-grid');

            if (governanceValues.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i data-lucide="heart"></i>
                        <h3>No governance values defined</h3>
                        <p>Add values to guide AI behavior</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = governanceValues.map(value => `
                <div class="value-card ${value.is_non_negotiable ? 'non-negotiable' : ''}">
                    <div class="value-header">
                        <span class="value-name">${escapeHtml(value.name)}</span>
                        <span class="value-badge ${value.is_non_negotiable ? 'non-negotiable' : 'negotiable'}">
                            ${value.is_non_negotiable ? 'Non-Negotiable' : 'Negotiable'}
                        </span>
                    </div>
                    <p class="value-meaning">${escapeHtml(value.plain_meaning)}</p>
                    ${value.why_it_matters ? `<p class="value-why">"${escapeHtml(value.why_it_matters)}"</p>` : ''}

                    ${value.principles && value.principles.length > 0 ? `
                        <div class="value-principles">
                            ${value.principles.map(p => `
                                <div class="principle-item">
                                    <i data-lucide="${getPrincipleIcon(p.constraint_type)}"></i>
                                    <span>
                                        ${escapeHtml(p.statement)}
                                        <span class="principle-type ${p.constraint_type}">${p.constraint_type}</span>
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Load conflicts
        async function loadConflicts() {
            const container = document.getElementById('conflicts-list');

            try {
                const response = await fetch('/api/synerginexus/conflicts');
                const data = await response.json();

                if (data.success) {
                    conflicts = data.data;
                    renderConflicts();
                }
            } catch (error) {
                console.error('Error loading conflicts:', error);
                container.innerHTML = '<p style="color: var(--danger);">Failed to load conflicts</p>';
            }
        }

        function renderConflicts() {
            const container = document.getElementById('conflicts-list');

            if (conflicts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="check-circle"></i>
                        <h3>No conflicts</h3>
                        <p>All governance is operating smoothly</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = conflicts.map(conflict => `
                <div class="conflict-item">
                    <div class="conflict-severity ${conflict.severity}"></div>
                    <div class="conflict-info">
                        <div class="conflict-description">${escapeHtml(conflict.description)}</div>
                        <div class="conflict-meta">
                            ${formatDate(conflict.created_at)} &bull;
                            Severity: ${capitalizeFirst(conflict.severity)}
                        </div>
                    </div>
                    <span class="conflict-status ${conflict.status}">${capitalizeFirst(conflict.status)}</span>
                    ${conflict.status !== 'resolved' ? `
                        <button class="btn btn-sm btn-secondary" onclick="resolveConflict('${conflict.id}')">
                            Resolve
                        </button>
                    ` : ''}
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Load escalation rules
        async function loadEscalation() {
            const container = document.getElementById('escalation-rules');

            try {
                const response = await fetch('/api/synerginexus/escalation');
                const data = await response.json();

                if (data.success) {
                    escalationRules = data.data;
                    renderEscalation();
                }
            } catch (error) {
                console.error('Error loading escalation rules:', error);
                container.innerHTML = '<p style="color: var(--danger);">Failed to load escalation rules</p>';
            }
        }

        function renderEscalation() {
            const container = document.getElementById('escalation-rules');

            if (escalationRules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="arrow-up-circle"></i>
                        <h3>No escalation rules</h3>
                        <p>Define rules for conflict escalation</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = `
                <div style="background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border);">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: var(--bg-tertiary);">
                                <th style="text-align: left; padding: 0.875rem 1.25rem;">Severity</th>
                                <th style="text-align: left; padding: 0.875rem 1.25rem;">Resolver Level</th>
                                <th style="text-align: left; padding: 0.875rem 1.25rem;">Auto-Escalate After</th>
                                <th style="text-align: left; padding: 0.875rem 1.25rem;">Notification Channels</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${escalationRules.map(rule => `
                                <tr>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);">
                                        <span class="status-badge" style="background: ${getSeverityColor(rule.severity)}20; color: ${getSeverityColor(rule.severity)};">
                                            ${capitalizeFirst(rule.severity)}
                                        </span>
                                    </td>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);">
                                        ${formatResolverLevel(rule.resolver_level)}
                                    </td>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);">
                                        ${rule.auto_escalate_after_hours} hours
                                    </td>
                                    <td style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);">
                                        ${(rule.notification_channels || []).map(ch => `
                                            <span style="padding: 0.15rem 0.4rem; background: var(--bg-tertiary); border-radius: 4px; font-size: 0.8rem; margin-right: 0.25rem;">
                                                ${ch}
                                            </span>
                                        `).join('')}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Tab switching
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            // Load content for tab
            switch (tab) {
                case 'digm': loadDIGM(); break;
                case 'values': loadValues(); break;
                case 'conflicts': loadConflicts(); break;
                case 'escalation': loadEscalation(); break;
            }
        }

        // Modal handlers
        function openValueModal() {
            document.getElementById('value-form').reset();
            document.getElementById('value-modal').classList.add('active');
        }

        function closeValueModal() {
            document.getElementById('value-modal').classList.remove('active');
        }

        function openConflictModal() {
            document.getElementById('conflict-form').reset();
            document.getElementById('conflict-modal').classList.add('active');
        }

        function closeConflictModal() {
            document.getElementById('conflict-modal').classList.remove('active');
        }

        // Save handlers
        async function saveValue(event) {
            event.preventDefault();

            const valueData = {
                name: document.getElementById('value-name').value.trim(),
                plain_meaning: document.getElementById('value-meaning').value.trim(),
                why_it_matters: document.getElementById('value-why').value.trim() || null,
                is_non_negotiable: document.getElementById('value-non-negotiable').checked
            };

            try {
                const response = await fetch('/api/synerginexus/values', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(valueData)
                });

                const data = await response.json();

                if (data.success) {
                    closeValueModal();
                    loadValues();
                    loadDashboard();
                    showSuccess('Value added successfully');
                } else {
                    showError(data.error || 'Failed to add value');
                }
            } catch (error) {
                console.error('Error saving value:', error);
                showError('Failed to add value');
            }
        }

        async function saveConflict(event) {
            event.preventDefault();

            const conflictData = {
                description: document.getElementById('conflict-description').value.trim(),
                severity: document.getElementById('conflict-severity').value,
                context: { note: document.getElementById('conflict-context').value.trim() }
            };

            try {
                const response = await fetch('/api/synerginexus/conflicts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(conflictData)
                });

                const data = await response.json();

                if (data.success) {
                    closeConflictModal();
                    loadConflicts();
                    loadDashboard();
                    showSuccess('Conflict logged successfully');
                } else {
                    showError(data.error || 'Failed to log conflict');
                }
            } catch (error) {
                console.error('Error saving conflict:', error);
                showError('Failed to log conflict');
            }
        }

        async function resolveConflict(id) {
            const resolution = prompt('Enter resolution notes:');
            if (!resolution) return;

            try {
                const response = await fetch(`/api/synerginexus/conflicts/${id}/resolve`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resolution })
                });

                const data = await response.json();

                if (data.success) {
                    loadConflicts();
                    loadDashboard();
                    showSuccess('Conflict resolved');
                } else {
                    showError(data.error || 'Failed to resolve conflict');
                }
            } catch (error) {
                console.error('Error resolving conflict:', error);
                showError('Failed to resolve conflict');
            }
        }

        function viewConfig(id) {
            const config = digmConfigs.find(c => c.id === id);
            if (!config) return;

            alert(`Config: ${config.config_key}\n\nValue:\n${JSON.stringify(config.config_value, null, 2)}`);
        }

        // Utility functions
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function formatConfigKey(key) {
            return key.split('_').map(capitalizeFirst).join(' ');
        }

        function formatResolverLevel(level) {
            const levels = {
                department_admin: 'Department Admin',
                system_admin: 'System Admin',
                super_admin: 'Super Admin'
            };
            return levels[level] || level;
        }

        function getPrincipleIcon(type) {
            switch (type) {
                case 'requirement': return 'check-circle';
                case 'prohibition': return 'x-circle';
                case 'disclosure': return 'info';
                case 'boundary': return 'shield';
                default: return 'circle';
            }
        }

        function getSeverityColor(severity) {
            switch (severity) {
                case 'low': return '#3b82f6';
                case 'medium': return '#f59e0b';
                case 'high': return '#f97316';
                case 'critical': return '#ef4444';
                default: return '#6b7280';
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showSuccess(message) {
            console.log('Success:', message);
        }

        function showError(message) {
            alert(message);
        }
    </script>
</body>
</html>
