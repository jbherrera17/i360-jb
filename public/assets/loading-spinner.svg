<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <!-- Gradient for outer swirl (pink to purple to blue) -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Gradient for middle swirl (orange to pink) -->
    <linearGradient id="gradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Gradient for inner swirl (cyan to blue) -->
    <linearGradient id="gradient3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(50,50)" filter="url(#shadow)">
    <!-- Outer swirl -->
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="none" stroke="url(#gradient1)" stroke-width="5" stroke-linecap="round" transform="rotate(-20)">
      <animateTransform attributeName="transform" type="rotate" from="-20" to="340" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Middle swirl -->
    <ellipse cx="0" cy="0" rx="28" ry="16" fill="none" stroke="url(#gradient2)" stroke-width="4" stroke-linecap="round" transform="rotate(40)">
      <animateTransform attributeName="transform" type="rotate" from="40" to="-320" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Inner swirl -->
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="none" stroke="url(#gradient3)" stroke-width="3.5" stroke-linecap="round" transform="rotate(-60)">
      <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
